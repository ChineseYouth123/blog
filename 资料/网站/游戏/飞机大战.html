<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#070b14">
<title>✈️ 飞机大战 · 十关BOSS增强版</title>
<style>
  :root {
    --neon-cyan: #22e0ff;
    --neon-blue: #3b82f6;
    --neon-gold: #ffcc33;
    --neon-pink: #ff2d78;
    --hud-bg: rgba(10, 20, 36, 0.55);
    --hud-border: rgba(90, 200, 255, 0.28);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%; height: 100%;
    background: #05070c;
    overflow: hidden;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(30, 100, 200, 0.22), transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(120, 30, 160, 0.16), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  #game-container {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(177.77vw, 100vh);
    width: min(100vw, 56.25dvh);
    height: min(177.77vw, 100dvh);
    overflow: hidden;
    border-radius: clamp(0px, 2.2vh, 22px);
    box-shadow:
      0 0 0 1px rgba(90, 200, 255, 0.18),
      0 0 60px rgba(0, 150, 255, 0.18),
      0 0 140px rgba(0, 80, 200, 0.12),
      inset 0 0 80px rgba(0, 0, 0, 0.6);
    cursor: none;
    touch-action: none;
    background: #000;
    z-index: 1;
    isolation: isolate;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
    border-radius: inherit;
  }

  .hud {
    position: absolute;
    top: calc(14px + var(--safe-top));
    left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: stretch;
    gap: 8px;
    pointer-events: none;
    z-index: 12;
    font-variant-numeric: tabular-nums;
  }
  .hud-item {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    padding: 8px 4px;
    border-radius: 12px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    font-size: clamp(13px, 2.1vh, 20px);
    font-weight: 800;
    color: #dbeafe;
    white-space: nowrap;
    transition: transform .15s ease;
  }
  .hud-item .icon { font-size: 1.05em; filter: drop-shadow(0 0 6px currentColor); }
  .hud-item .val { letter-spacing: 0.5px; }

  #score { color: var(--neon-cyan); text-shadow: 0 0 12px rgba(34, 224, 255, 0.75); }
  #levelDisplay { color: var(--neon-gold); text-shadow: 0 0 12px rgba(255, 204, 51, 0.65); }
  #lives { color: var(--neon-pink); text-shadow: 0 0 12px rgba(255, 45, 120, 0.7); }

  .hud-item.flash { animation: hudFlash 0.45s ease; }
  @keyframes hudFlash {
    0% { transform: scale(1); }
    35% { transform: scale(1.12); box-shadow: 0 0 22px rgba(34, 224, 255, 0.7); }
    100% { transform: scale(1); }
  }

  .weapon-hud {
    position: absolute;
    bottom: calc(18px + var(--safe-bottom));
    left: 14px;
    display: flex; align-items: center; gap: 9px;
    padding: 9px 14px 9px 12px;
    border-radius: 999px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: clamp(12px, 1.9vh, 18px);
    font-weight: 800;
    pointer-events: none;
    z-index: 12;
    max-width: calc(100% - 90px);
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .weapon-hud.active {
    border-color: rgba(120, 220, 255, 0.5);
    box-shadow: 0 4px 22px rgba(0, 0, 0, 0.45), 0 0 20px rgba(34, 224, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  #weaponName {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    letter-spacing: 0.3px;
  }
  .weapon-bar {
    width: clamp(52px, 10vh, 96px);
    height: 8px;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    overflow: hidden;
    display: none;
    flex-shrink: 0;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  }
  .weapon-bar-inner {
    height: 100%; width: 100%;
    border-radius: inherit;
    transition: width 0.12s linear, background 0.25s ease;
    box-shadow: 0 0 8px currentColor;
  }

  .mute-btn {
    position: absolute;
    right: 14px;
    bottom: calc(16px + var(--safe-bottom));
    width: clamp(42px, 6.2vh, 52px);
    height: clamp(42px, 6.2vh, 52px);
    border-radius: 50%;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    color: #e0f2fe;
    font-size: clamp(17px, 2.6vh, 22px);
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.07);
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease, opacity .2s ease;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .mute-btn:hover { background: rgba(34, 224, 255, 0.16); box-shadow: 0 0 22px rgba(34, 224, 255, 0.35); }
  .mute-btn:active { transform: scale(0.88); background: rgba(34, 224, 255, 0.3); }

  .boss-hud {
    position: absolute;
    top: calc(66px + var(--safe-top));
    left: 14px; right: 14px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 13;
    pointer-events: none;
  }
  .boss-hud.show { display: flex; }
  .boss-name {
    font-size: clamp(11px, 1.7vh, 14px);
    font-weight: 800;
    color: #ffd166;
    text-shadow: 0 0 10px rgba(255, 209, 102, 0.7);
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;
  }
  .boss-bar-bg {
    width: 100%;
    height: clamp(8px, 1.3vh, 12px);
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 80, 80, 0.5);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.7);
  }
  .boss-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff2d55, #ff6b35, #ffcc33);
    border-radius: inherit;
    transition: width 0.15s linear;
    box-shadow: 0 0 12px rgba(255, 80, 60, 0.8);
  }
  .boss-phase {
    font-size: clamp(9px, 1.4vh, 12px);
    color: #ff9f9f;
    text-align: right;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .start-screen {
    position: absolute; inset: 0;
    z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(24px, 5vh) 26px;
    text-align: center;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, rgba(0, 90, 170, 0.55), rgba(4, 8, 18, 0.97) 72%),
      linear-gradient(180deg, rgba(8, 14, 28, 0.96), rgba(2, 4, 10, 0.99));
    color: #fff;
    transition: opacity .4s ease, visibility .4s ease;
    overflow: hidden;
  }
  .start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .start-screen::before {
    content: '';
    position: absolute; inset: -50%;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(140, 220, 255, 0.9), transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, rgba(255, 255, 255, 0.7), transparent),
      radial-gradient(2px 2px at 45% 65%, rgba(160, 200, 255, 0.8), transparent),
      radial-gradient(1.5px 1.5px at 85% 55%, rgba(255, 255, 255, 0.6), transparent),
      radial-gradient(1.5px 1.5px at 12% 80%, rgba(180, 230, 255, 0.75), transparent),
      radial-gradient(2px 2px at 60% 88%, rgba(255, 255, 255, 0.55), transparent),
      radial-gradient(1.5px 1.5px at 35% 12%, rgba(150, 210, 255, 0.7), transparent);
    background-size: 100% 100%;
    animation: starDrift 22s linear infinite;
    opacity: 0.85;
    pointer-events: none;
  }
  @keyframes starDrift {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(6%) rotate(0.5deg); }
  }

  .start-inner {
    position: relative;
    z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    animation: startIn .7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes startIn {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .start-badge {
    font-size: clamp(10px, 1.5vh, 13px);
    letter-spacing: 4px;
    color: #5eead4;
    font-weight: 700;
    padding: 5px 16px;
    border: 1px solid rgba(94, 234, 212, 0.35);
    border-radius: 999px;
    background: rgba(20, 60, 70, 0.4);
    margin-bottom: clamp(14px, 2.4vh, 24px);
    text-transform: uppercase;
    box-shadow: 0 0 18px rgba(94, 234, 212, 0.15);
  }

  .start-title {
    font-size: clamp(30px, 6.4vh, 58px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-bottom: 10px;
    line-height: 1.15;
    background: linear-gradient(180deg, #b8f6ff 0%, #3ac9ff 48%, #1d6bff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(0, 180, 255, 0.6));
    padding-left: 5px;
  }

  .start-sub {
    font-size: clamp(13px, 1.95vh, 18px);
    color: #a5c8e8;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .start-features {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(6px, 1.2vh, 10px);
    margin: clamp(16px, 3vh, 28px) 0 4px;
  }
  .feature-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: clamp(11px, 1.6vh, 14px);
    font-weight: 700;
    color: #cfe9ff;
    background: rgba(30, 70, 120, 0.28);
    border: 1px solid rgba(90, 180, 255, 0.22);
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .feature-chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan);
    flex-shrink: 0;
  }

  .start-hint {
    font-size: clamp(10.5px, 1.5vh, 13px);
    color: #6f8fae;
    margin-top: clamp(14px, 2.4vh, 20px);
    letter-spacing: 0.8px;
    line-height: 1.7;
  }
  .start-hint b { color: #a9cfff; font-weight: 700; }

  .start-btn {
    position: relative;
    margin-top: clamp(24px, 4.2vh, 44px);
    padding: clamp(13px, 2vh, 17px) clamp(48px, 9vh, 74px);
    font-size: clamp(17px, 2.5vh, 24px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #03121f;
    background: linear-gradient(180deg, #9beeff 0%, #2ed3ff 40%, #0f8fe6 100%);
    border: none;
    border-radius: 999px;
    box-shadow:
      0 0 0 1px rgba(180, 240, 255, 0.55),
      0 8px 30px rgba(0, 180, 255, 0.5),
      0 0 60px rgba(0, 160, 255, 0.28),
      inset 0 -3px 0 rgba(0, 80, 140, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    cursor: pointer;
    font-family: inherit;
    overflow: hidden;
    transition: transform .13s ease, box-shadow .25s ease;
    animation: btnPulse 2.6s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(180, 240, 255, 0.55), 0 8px 30px rgba(0, 180, 255, 0.45), 0 0 60px rgba(0, 160, 255, 0.22), inset 0 -3px 0 rgba(0, 80, 140, 0.35), inset 0 1px 0 rgba(255,255,255,0.8); }
    50% { box-shadow: 0 0 0 1px rgba(180, 240, 255, 0.7), 0 10px 38px rgba(0, 190, 255, 0.62), 0 0 80px rgba(0, 170, 255, 0.4), inset 0 -3px 0 rgba(0, 80, 140, 0.35), inset 0 1px 0 rgba(255,255,255,0.85); }
  }
  .start-btn::after {
    content: '';
    position: absolute; top: 0; left: -120%;
    width: 70%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.7), transparent);
    transform: skewX(-22deg);
    animation: btnShine 3.2s ease-in-out infinite;
  }
  @keyframes btnShine {
    0%, 62% { left: -120%; }
    88%, 100% { left: 130%; }
  }
  .start-btn:hover { transform: translateY(-2px); }
  .start-btn:active { transform: translateY(1px) scale(0.97); }

  .paused-mask {
    position: absolute; inset: 0;
    background: rgba(4, 8, 16, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    color: #9ad8ff;
    font-size: clamp(18px, 3vh, 28px);
    font-weight: 800;
    letter-spacing: 6px;
    z-index: 35;
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .paused-mask.show { opacity: 1; visibility: visible; }

  @media (max-height: 500px) and (orientation: landscape) {
    .hud { top: calc(8px + var(--safe-top)); left: 10px; right: 10px; }
    .hud-item { padding: 5px 3px; border-radius: 9px; }
    .weapon-hud { bottom: calc(10px + var(--safe-bottom)); left: 10px; padding: 6px 11px; }
    .mute-btn { right: 10px; bottom: calc(8px + var(--safe-bottom)); }
    .boss-hud { top: calc(52px + var(--safe-top)); left: 10px; right: 10px; }
  }
</style>
</head>
<body>
<div id="game-container">
  <div class="hud">
    <div class="hud-item" id="hudScore">
      <span class="icon">💥</span><span class="val" id="score">0</span>
    </div>
    <div class="hud-item" id="hudLevel">
      <span class="icon">🏁</span><span class="val" id="levelDisplay">1/10</span>
    </div>
    <div class="hud-item" id="hudLives">
      <span class="icon">❤️</span><span class="val" id="lives">3</span>
    </div>
  </div>

  <div class="boss-hud" id="bossHud">
    <div class="boss-name" id="bossName">BOSS</div>
    <div class="boss-bar-bg"><div class="boss-bar-fill" id="bossBarFill"></div></div>
    <div class="boss-phase" id="bossPhase">阶段 1/1</div>
  </div>

  <div class="weapon-hud" id="weaponHud">
    <span id="weaponName">🔫 普通弹 Lv1</span>
    <div class="weapon-bar" id="weaponBar">
      <div class="weapon-bar-inner" id="weaponBarInner"></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="900" height="1600"></canvas>

  <button class="mute-btn" id="muteBtn" type="button" aria-label="音效开关">🔊</button>

  <div class="paused-mask" id="pausedMask">已 暂 停</div>

  <div class="start-screen" id="startScreen">
    <div class="start-inner">
      <div class="start-badge">STAR FIGHTER</div>
      <div class="start-title">飞机大战</div>
      <div class="start-sub">十关BOSS · 十种敌机 · 八种武器</div>

      <div class="start-features">
        <div class="feature-chip"><span class="dot"></span>十关BOSS</div>
        <div class="feature-chip"><span class="dot"></span>十种敌机</div>
        <div class="feature-chip"><span class="dot"></span>武器升级 Lv3</div>
        <div class="feature-chip"><span class="dot"></span>手机震动</div>
      </div>

      <button class="start-btn" id="startBtn" type="button">开 始 游 戏</button>

      <div class="start-hint">
        拖动屏幕控制战机 · 自动开火<br>
        <b>PC</b> 鼠标移动 · <b>R</b> 键重开 · <b>右下角</b> 切换音效
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  飞机大战 · 十关BOSS增强版
//  新增6种敌机 · 血量提升 · 每关BOSS · 手机震动
// ============================================================
'use strict';

/* ============================================================
   一、音效系统（Web Audio API 实时合成）
   ============================================================ */
const Sound = {
  ctx: null, master: null, noiseBuf: null, ready: false, enabled: true, _throttle: {},

  init() {
    if (this.ready) { this.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? 0.32 : 0;
      this.master.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.8);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.ready = true;
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.32 : 0;
    if (this.enabled) this.resume();
    return this.enabled;
  },
  ok(key, ms) {
    if (!this.ready || !this.enabled) return false;
    const t = (window.performance && performance.now) ? performance.now() : Date.now();
    if (this._throttle[key] !== undefined && t - this._throttle[key] < ms) return false;
    this._throttle[key] = t; return true;
  },
  _tone(o) {
    if (!this.ready || !this.enabled) return;
    try {
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.1;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(Math.max(1, o.f0), t0);
      if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, o.vol || 0.1), t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.master);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  },
  _noise(o) {
    if (!this.ready || !this.enabled || !this.noiseBuf) return;
    try {
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const dur = o.dur || 0.2;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf; src.loop = true;
      const filt = this.ctx.createBiquadFilter();
      filt.type = o.filter || 'lowpass';
      filt.frequency.setValueAtTime(o.f0 || 2000, t0);
      if (o.f1) filt.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
      filt.Q.value = o.q || 1;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(Math.max(0.0001, o.vol || 0.2), t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filt); filt.connect(g); g.connect(this.master);
      src.start(t0); src.stop(t0 + dur + 0.03);
    } catch (e) {}
  },
  shoot(w) {
    if (!this.ok('shoot', 55)) return;
    switch (w) {
      case 'red': this._noise({ f0: 3200, f1: 900, dur: 0.07, vol: 0.09, filter: 'highpass' }); break;
      case 'blue': this._tone({ f0: 1500, f1: 2600, dur: 0.06, type: 'sine', vol: 0.07 }); break;
      case 'green': this._tone({ f0: 700, f1: 1150, dur: 0.08, type: 'triangle', vol: 0.07 }); break;
      case 'purple': this._tone({ f0: 480, f1: 980, dur: 0.08, type: 'sawtooth', vol: 0.05 }); break;

function getNearestEnemy(x, y) {
  let minD = 999999, target = null;
  enemies.forEach(e => {
    if (e._dead) return;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < minD) { minD = d; target = e; }
  });
  return target;
}

  if (b.type === 'laser' || b.type === 'railgun') return 32;
  if (b.type === 'missile') return 30;

  return 25;
}

function pushEnemyBullet(b) {
  if (b.hits === undefined) {
    if (b.type === 'fast') b.hits = 1;
    else if (b.type === 'large') b.hits = Math.random() < 0.5 ? 2 : 3;
    else if (b.type === 'huge') b.hits = 3;
    else { const r = Math.random(); b.hits = r < 0.5 ? 1 : (r < 0.85 ? 2 : 3); }
  }
  b.maxHits = b.hits; b.life = 0; b.bounced = false;
  enemyBullets.push(b);
}

/* ---------- 敌机生成 ---------- */
function spawnEnemy() {
  const lv = getCurrentLevel();
  const waveCount = lv.waveSize[0] + Math.floor(Math.random() * (lv.waveSize[1] - lv.waveSize[0] + 1));
  const startX = Math.random() * (CW - 300) + 150;
  for (let i = 0; i < waveCount; i++) {
    const rand = Math.random();
    let type = 'normal', acc = 0;
    for (const [t, w] of Object.entries(lv.types)) { acc += w; if (rand <= acc) { type = t; break; } }
    let x = startX + (i - (waveCount - 1) / 2) * 80;
    let y = -80 - (Math.random() * 100);
    let speed = 3.0 + Math.random() * 1.5;
    let hp = getEnemyHp(type, currentLevelIndex);
    let fireTimerLocal = 60 + Math.random() * 50;
    let hasShieldFlag = false, shieldHp = 0;

    if (type === 'armored') { speed = 1.0; }
    else if (type === 'sniper') { speed = 2.5; }
    else if (type === 'bomber') { speed = 6.0; fireTimerLocal = 9999; }
    else if (type === 'shielder') { speed = 2.0; hasShieldFlag = true; shieldHp = Math.floor(hp * 0.5); }
    else if (type === 'splitter') { speed = 3.5; }
    else if (type === 'healer') { speed = 2.2; fireTimerLocal = 9999; }
    else if (type === 'laser') { speed = 1.8; fireTimerLocal = 90; }
    else if (type === 'orbiter') { speed = 2.0; }
    else if (type === 'elite') { speed = 2.5; hasShieldFlag = true; shieldHp = Math.floor(hp * 0.3); }

    enemies.push({
      x, y, baseX: x, width: 36, height: 36, speed,
      wobble: Math.random() * Math.PI * 2, wobbleSpeed: 0.02 + Math.random() * 0.05,
      fireTimer: fireTimerLocal + i * 20, stage: currentLevelIndex + 1,
      hitTimer: 0, hp, maxHp: hp, type,
      bulletSpeedMult: lv.bulletSpeedMult,
      hasShield: hasShieldFlag, shieldHp: shieldHp, maxShieldHp: shieldHp,
      laserCharge: 0, healTimer: 180, orbitAngle: Math.random() * Math.PI * 2, orbitRadius: 150 + Math.random() * 100
    });
  }
}

      { x: CW / 2 + 130, y: -120, hp: cfg.hp, maxHp: cfg.hp, phase: 1, maxPhase: cfg.phases, fireTimer: 90, hitTimer: 0, name: '双子·右', color: '#e67e22', w: cfg.w, h: cfg.h, targetY: 200, dead: false, pattern: 'twin', twinSide: 1, _type: 'boss' }
    ];
    boss = null;
    bossNameEl.textContent = '双子舰';
    bossBarFillEl.style.width = '100%';
    bossPhaseEl.textContent = '阶段 1/2';
    bossHudEl.classList.add('show');
  } else {
    boss = {
      x: CW / 2, y: -150, hp: cfg.hp, maxHp: cfg.hp,
      phase: 1, maxPhase: cfg.phases, fireTimer: 80, hitTimer: 0,
      name: cfg.name, color: cfg.color, w: cfg.w, h: cfg.h,
      targetY: 180, pattern: cfg.pattern, dead: false,
      laserCharge: 0, moveTimer: 0, moveDir: 1, healTimer: 120, _type: 'boss'
    };
    bossNameEl.textContent = cfg.name;
    bossBarFillEl.style.width = '100%';
    bossPhaseEl.textContent = `阶段 1/${cfg.phases}`;
    bossHudEl.classList.add('show');
  }
  Sound.bossWarn();
}

/* ---------- 伤害处理 ---------- */
function damageEnemy(enemy, damage) {
  if (enemy._dead) return;
  if (enemy.hasShield && enemy.shieldHp > 0) {
    enemy.shieldHp -= damage;
    enemy.hitTimer = 5;
    Sound.hit(); Vibration.hitEnemy();
    if (enemy.shieldHp <= 0) {
      enemy.hasShield = false;
      enemy.shieldHp = 0;
      createExplosion(enemy.x, enemy.y, false);
      Sound.shieldBreak();
      Vibration.killEnemy();
    }
    return;
  }
  enemy.hp -= damage;
  enemy.hitTimer = 5;
  Sound.hit(); Vibration.hitEnemy();
  if (enemy.hp <= 0) killEnemy(enemy);
}

function killEnemy(enemy) {
  if (enemy._dead) return;
  enemy._dead = true;
  createExplosion(enemy.x, enemy.y);
  Sound.explosion(false);
  Vibration.killEnemy();

  let points = 10;
  if (enemy.type === 'armored') points = 30;
  else if (enemy.type === 'sniper') points = 20;
  else if (enemy.type === 'bomber') points = 15;
  else if (enemy.type === 'shielder') points = 35;
  else if (enemy.type === 'splitter') points = 25;
  else if (enemy.type === 'healer') points = 30;
  else if (enemy.type === 'laser') points = 28;
  else if (enemy.type === 'orbiter') points = 32;
  else if (enemy.type === 'elite') points = 60;

  score += points;
  updateHUD();
  addFloatingText(enemy.x, enemy.y, `+${points}`, '#22e0ff');

  const isElite = (enemy.type === 'armored' || enemy.type === 'sniper' || enemy.type === 'elite' || enemy.type === 'shielder');
  if (Math.random() < (isElite ? 0.15 : 0.08)) {
    powerups.push({ x: enemy.x, y: enemy.y, speed: 5, time: Math.random() * 10, type: 'heart' });
  }
  if (Math.random() < (isElite ? 0.7 : 0.4)) spawnPowerup(enemy.x, enemy.y);

  // 分裂机死亡分裂
  if (enemy.type === 'splitter') {
    for (let s = 0; s < 2; s++) {
      enemies.push({
        x: enemy.x + (s === 0 ? -25 : 25), y: enemy.y, baseX: enemy.x + (s === 0 ? -25 : 25),
        width: 24, height: 24, speed: 3.5 + Math.random(),
        wobble: Math.random() * Math.PI * 2, wobbleSpeed: 0.04,
        fireTimer: 90, stage: enemy.stage, hitTimer: 0,
        hp: Math.max(1, Math.floor(enemy.maxHp * 0.3)), maxHp: Math.max(1, Math.floor(enemy.maxHp * 0.3)),
        type: 'normal', bulletSpeedMult: enemy.bulletSpeedMult,
        hasShield: false, shieldHp: 0, maxShieldHp: 0, laserCharge: 0, healTimer: 999, orbitAngle: 0, orbitRadius: 0
      });
    }
  }
}

function spawnPowerup(x, y, forceType = null) {
  let type = forceType;
  if (!type) {
    const rand = Math.random();
    if (rand < 0.08) type = 'shield';
    else { const pool = getWeaponPool(); type = pool[Math.floor(Math.random() * pool.length)]; }
  }
  powerups.push({ x, y, speed: 5, time: Math.random() * 10, type });
}

/* ---------- BOSS伤害 ---------- */
function damageBoss(target, damage) {
  if (!target || target.dead) return;
  target.hp -= damage;
  target.hitTimer = 5;
  Sound.hit(); Vibration.bossHit();
  if (target.hp <= 0) {
    target.hp = 0;
    target.dead = true;
    createExplosion(target.x, target.y, false, true);
    Sound.explosion(true);
    Vibration.bossKill();
  } else {
    // 阶段切换检测
    const hpRatio = target.hp / target.maxHp;
    let newPhase = target.phase;
    if (target.maxPhase === 2) newPhase = hpRatio <= 0.5 ? 2 : 1;
    else if (target.maxPhase === 3) newPhase = hpRatio <= 0.25 ? 3 : (hpRatio <= 0.5 ? 2 : 1);
    if (newPhase > target.phase) {
      target.phase = newPhase;
      target.fireTimer = 30;
      createExplosion(target.x, target.y, false);
      Sound.bossPhase();
      Vibration.bossPhase();
      if (currentLevelIndex === 8 && twinBosses) {
        bossPhaseEl.textContent = `阶段 ${newPhase}/2`;
      } else {
        bossPhaseEl.textContent = `阶段 ${newPhase}/${target.maxPhase}`;
      }
    }
  }
}

function updateBossHud() {
  if (currentLevelIndex === 8 && twinBosses) {
    const total = twinBosses.reduce((s, b) => s + Math.max(0, b.hp), 0);
    const maxTotal = twinBosses.reduce((s, b) => s + b.maxHp, 0);
    bossBarFillEl.style.width = `${(total / maxTotal) * 100}%`;
  } else if (boss) {
    bossBarFillEl.style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
  }
}

/* ============================================================
   四、主更新循环
   ============================================================ */
function checkLevelProgress() {
  const lv = getCurrentLevel();
  if (score >= lv.scoreThreshold && currentLevelIndex < LEVELS.length - 1) {
    currentLevelIndex++;
    levelTransitionTimer = 150;
    levelTransitionText = `第 ${currentLevelIndex + 1} 关：${LEVELS[currentLevelIndex].name}`;
    enemySpawnTimer = 60;
    enemies.length = 0;
    enemyBullets.length = 0;
    // 重置BOSS状态
    boss = null; twinBosses = null; bossSpawned = false; bossDefeated = false; bossKilledThisLevel = false; bossPending = false; bossWarningTimer = 0;
    bossHudEl.classList.remove('show');
    Sound.levelUp();
  }
}

function startBossWarning() {
  if (bossSpawned || bossPending) return;
  bossPending = true;
  bossWarningTimer = 180; // 3秒预警
  Sound.bossWarn();
}

function update() {
  if (!gameStarted || paused || isGameOver || isWin) return;
  gameFrame++;
  groundOffset = (groundOffset + GROUND_SPEED) % (CH * 2);

  checkLevelProgress();
  if (levelTransitionTimer > 0) levelTransitionTimer--;

  // BOSS触发逻辑：分数达到阈值后等待普通敌机清空，然后预警
  const lv = getCurrentLevel();
  if (!bossSpawned && !bossPending && !bossDefeated && currentLevelIndex < LEVELS.length) {
    // 当分数接近阈值或者已经打过一段时间后触发BOSS
    if (score >= lv.scoreThreshold * 0.7 && enemies.length === 0) {
      startBossWarning();
    }
  }

  if (bossWarningTimer > 0) {
    bossWarningTimer--;
    if (bossWarningTimer === 0 && bossPending) {
      bossPending = false;
      spawnBoss();
    }
  }

  // 武器计时
  if (weaponTimer > 0) {
    weaponTimer--;
    if (weaponTimer <= 0) {
      currentWeapon = 'normal';
      addFloatingText(player.x, player.y - 40, '武器失效', '#aaaaaa');
      updateHUD();
    }
    if (gameFrame % 10 === 0) updateHUD();
  }
  if (hasShield) { shieldTimer--; if (shieldTimer <= 0) hasShield = false; }

  // 玩家移动
  player.x += (targetX - player.x) * 0.6;
  player.y += (targetY - player.y) * 0.6;

  // 玩家开火
  if (fireTimer > 0) fireTimer--;
  if (fireTimer <= 0) {
    const cfg = getWeaponCfg(currentWeapon);
    const sp = -18;
    if (currentWeapon === 'normal') {
      for (let i = 0; i < cfg.count; i++) {
        const offset = i - (cfg.count - 1) / 2;
        bullets.push({ x: player.x + offset * 15, y: player.y - 20, vx: 0, vy: sp, color: '#ffffff', type: 'normal', damage: cfg.damage });
      }
    } else if (currentWeapon === 'red') {
      for (let i = 0; i < cfg.count; i++) {
        const angle = (i - (cfg.count - 1) / 2) * 0.12;
        bullets.push({ x: player.x, y: player.y - 20, vx: Math.sin(angle) * cfg.spread * 3, vy: Math.cos(angle) * sp, color: cfg.color, type: 'normal', damage: cfg.damage });
      }
    } else if (currentWeapon === 'blue') {
      for (let i = 0; i < cfg.count; i++) {
        bullets.push({ x: player.x + (i - (cfg.count - 1) / 2) * 30, y: player.y - 20, vx: 0, vy: sp * 1.5, color: cfg.color, type: 'laser', damage: cfg.damage });
      }
    } else if (currentWeapon === 'green') {
      for (let i = 0; i < cfg.count; i++) {
        bullets.push({ x: player.x + (i - (cfg.count - 1) / 2) * 25, y: player.y - 20, vx: 0, vy: sp, color: cfg.color, type: 'homing', speed: cfg.speed, damage: cfg.damage });
      }
    } else if (currentWeapon === 'purple') {
      for (let i = 0; i < cfg.count; i++) {
        const a = (Math.PI * 2 / cfg.count) * i;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 12, vy: Math.sin(a) * 12, color: cfg.color, type: 'normal', damage: cfg.damage });
      }
    } else if (currentWeapon === 'missile') {
      for (let i = 0; i < cfg.count; i++) {
        bullets.push({ x: player.x + (i - (cfg.count - 1) / 2) * 30, y: player.y - 20, vx: 0, vy: sp * 0.7, color: cfg.color, type: 'missile', speed: cfg.speed, damage: cfg.damage, explodeDamage: cfg.explodeDamage, explodeRadius: cfg.explodeRadius });
      }
    } else if (currentWeapon === 'flame') {
      for (let i = 0; i < cfg.count; i++) {
        const offset = i - (cfg.count - 1) / 2;
        bullets.push({ x: player.x + offset * 15, y: player.y - 15, vx: offset * 1.5, vy: sp * 0.85, color: cfg.color, type: 'flame', damage: cfg.damage, life: 0 });
      }
    } else if (currentWeapon === 'railgun') {
      for (let i = 0; i < cfg.count; i++) {
        bullets.push({ x: player.x + (i - (cfg.count - 1) / 2) * 40, y: player.y - 20, vx: 0, vy: sp * 2.0, color: cfg.color, type: 'railgun', damage: cfg.damage });
      }
    }
    Sound.shoot(currentWeapon);
    fireTimer = cfg.fireInterval;
  }

  // 玩家子弹更新
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.type === 'homing' || b.type === 'missile') {
      const target = getNearestEnemy(b.x, b.y);
      if (target) {
        const dx = target.x - b.x, dy = target.y - b.y;
        const angle = Math.atan2(dy, dx);
        const spd = b.speed || 15;
        b.vx = Math.cos(angle) * spd; b.vy = Math.sin(angle) * spd;
      }
    }
    b.x += b.vx; b.y += b.vy;
    if (b.type === 'flame') {
      b.life = (b.life || 0) + 1;
      if (b.life > 15) { bullets.splice(i, 1); continue; }
    }
    if (b.y < -50 || b.y > CH + 50 || b.x < -50 || b.x > CW + 50) bullets.splice(i, 1);
  }

  // 普通敌机生成（BOSS存在时停止）
  if (levelTransitionTimer <= 0 && !bossSpawned && !bossPending && !bossDefeated) {
    if (enemySpawnTimer > 0) enemySpawnTimer--;
    if (enemySpawnTimer <= 0) {
      spawnEnemy();
      enemySpawnTimer = getCurrentLevel().spawnInterval;
    }
  }

  // 普通敌机更新
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e._dead) { enemies.splice(i, 1); continue; }

    // 移动
    if (e.type === 'sniper') {
      if (e.y < 200) e.y += e.speed;
      e.x += Math.sin(gameFrame * 0.02) * 2;
    } else if (e.type === 'orbiter') {
      e.orbitAngle += 0.02;
      e.x = CW / 2 + Math.cos(e.orbitAngle) * e.orbitRadius;
      e.y += e.speed * 0.5;
    } else {
      e.y += e.speed;
      e.wobble += e.wobbleSpeed;
      e.x = e.baseX + Math.sin(e.wobble) * 20;
    }
    if (e.hitTimer > 0) e.hitTimer--;

    // 治疗机治疗周围
    if (e.type === 'healer') {
      e.healTimer--;
      if (e.healTimer <= 0) {
        e.healTimer = 240;
        enemies.forEach(other => {
          if (other !== e && !other._dead && Math.hypot(other.x - e.x, other.y - e.y) < 180) {
            other.hp = Math.min(other.maxHp, other.hp + Math.floor(other.maxHp * 0.3));
            createExplosion(other.x, other.y, false);
          }
        });
        addFloatingText(e.x, e.y - 30, '治疗', '#4dff4d');
      }
    }

    // 开火
    if (e.y > 0 && e.y < CH - 150 && e.type !== 'bomber' && e.type !== 'healer') {
      e.fireTimer--;
      if (e.fireTimer <= 0) {
        const bsm = e.bulletSpeedMult || 1;
        const bs = (6 + e.stage) * bsm;
        if (e.type === 'armored') {
          for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
            pushEnemyBullet({ x: e.x, y: e.y, vx: Math.cos(angle) * 3 * bsm, vy: Math.sin(angle) * 3 * bsm + 2, radius: 15, color: '#f39c12', type: 'large' });
          }
          e.fireTimer = 120;
        } else if (e.type === 'sniper') {
          const dx = player.x - e.x, dy = player.y - e.y;
          const angle = Math.atan2(dy, dx);
          pushEnemyBullet({ x: e.x, y: e.y, vx: Math.cos(angle) * 12 * bsm, vy: Math.sin(angle) * 12 * bsm, radius: 5, color: '#ff0000', type: 'fast' });
          e.fireTimer = 90;
        } else if (e.type === 'shielder') {
          for (let a = -1; a <= 1; a++) pushEnemyBullet({ x: e.x, y: e.y + 15, vx: a * 3.5 * bsm, vy: bs, radius: 7, color: '#00e5ff', type: 'normal' });
          e.fireTimer = 100;
        } else if (e.type === 'laser') {
          e.laserCharge += 10;
          if (e.laserCharge >= 60) {
            e.laserCharge = 0;
            const dx = player.x - e.x, dy = player.y - e.y;
            const angle = Math.atan2(dy, dx);
            for (let l = 0; l < 3; l++) {
              pushEnemyBullet({ x: e.x, y: e.y, vx: Math.cos(angle + (l - 1) * 0.1) * 10 * bsm, vy: Math.sin(angle + (l - 1) * 0.1) * 10 * bsm, radius: 6, color: '#ff00ff', type: 'fast' });
            }
          }
          e.fireTimer = 20;
        } else if (e.type === 'orbiter') {
          pushEnemyBullet({ x: e.x, y: e.y, vx: 0, vy: 5 * bsm, radius: 7, color: '#e91e63', type: 'normal' });
          e.fireTimer = 70;
        } else if (e.type === 'elite') {
          if (e.stage % 2 === 0) {
            for (let a = -1; a <= 1; a++) pushEnemyBullet({ x: e.x, y: e.y + 15, vx: a * 3 * bsm, vy: bs, radius: 8, color: '#9b59b6', type: 'normal' });
          } else {
            const dx = player.x - e.x, dy = player.y - e.y;
            const angle = Math.atan2(dy, dx);
            pushEnemyBullet({ x: e.x, y: e.y, vx: Math.cos(angle) * 9 * bsm, vy: Math.sin(angle) * 9 * bsm, radius: 8, color: '#ff0055', type: 'fast' });
          }
          e.fireTimer = 70;
        } else {
          if (e.stage === 1) {
            pushEnemyBullet({ x: e.x, y: e.y + 15, vx: -2 * bsm, vy: bs, radius: 5, color: '#ff4d4d', type: 'normal' });
            pushEnemyBullet({ x: e.x, y: e.y + 15, vx: 2 * bsm, vy: bs, radius: 5, color: '#ff4d4d', type: 'normal' });
          } else if (e.stage === 2) {
            for (let a = -1; a <= 1; a++) pushEnemyBullet({ x: e.x, y: e.y + 15, vx: a * 3 * bsm, vy: bs - 2 * bsm, radius: 7, color: '#f39c12', type: 'normal' });
          } else {
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
              pushEnemyBullet({ x: e.x, y: e.y, vx: Math.cos(angle) * 4 * bsm, vy: Math.sin(angle) * 4 * bsm, radius: 6, color: '#d500f9', type: 'normal' });
            }
          }
          e.fireTimer = 80 + Math.random() * 40;
        }
      }
    }

    // 激光机充能视觉
    if (e.type === 'laser') e.laserCharge = Math.min(60, e.laserCharge + 1);

    if (e.y > CH + 80) { enemies.splice(i, 1); continue; }

    // 撞机
    if (player.invincible <= 0 && Math.abs(e.x - player.x) < 40 && Math.abs(e.y - player.y) < 40) {
      enemies.splice(i, 1); playerHit(); continue;
    }

    // 玩家子弹命中敌机
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      const hitW = getBulletHitWidth(b);
      if (Math.abs(b.x - e.x) < hitW && Math.abs(b.y - e.y) < hitW) {
        if (b.type === 'missile') {
          damageEnemy(e, b.damage);
          for (let k = enemies.length - 1; k >= 0; k--) {
            const other = enemies[k];
            if (other !== e && !other._dead && Math.hypot(other.x - e.x, other.y - e.y) < b.explodeRadius) damageEnemy(other, b.explodeDamage);
          }
          createExplosion(e.x, e.y);
          Sound.explosion(false);
          bullets.splice(j, 1);
        } else if (b.type === 'laser') {
          damageEnemy(e, b.damage);
        } else {
          damageEnemy(e, b.damage);
          bullets.splice(j, 1);
        }
        if (e._dead) break;
      }
    }
    if (e._dead) { enemies.splice(i, 1); continue; }
  }

  /* ---------- BOSS更新 ---------- */
  if (bossSpawned && !bossDefeated) {
    if (currentLevelIndex === 8 && twinBosses) {
      // 双子BOSS
      twinBosses.forEach(tb => {
        if (tb.dead) return;
        if (tb.y < tb.targetY) { tb.y += 2; }
        else {
          tb.x += Math.sin(gameFrame * 0.02 + (tb.twinSide === -1 ? 0 : Math.PI)) * 2;
        }
        if (tb.hitTimer > 0) tb.hitTimer--;
        tb.fireTimer--;
        if (tb.fireTimer <= 0 && tb.y >= tb.targetY - 10) {
          const phase = tb.phase;
          // 交叉弹幕
          for (let a = -2; a <= 2; a++) {
            const ang = Math.PI / 2 + (tb.twinSide * a * 0.25);
            pushEnemyBullet({ x: tb.x, y: tb.y + 40, vx: Math.cos(ang) * 6, vy: Math.sin(ang) * 6, radius: 8, color: '#ffcc33', type: 'normal' });
          }
          if (phase >= 2) {
            const dx = player.x - tb.x, dy = player.y - tb.y;
            const aimAng = Math.atan2(dy, dx);
            pushEnemyBullet({ x: tb.x, y: tb.y, vx: Math.cos(aimAng) * 10, vy: Math.sin(aimAng) * 10, radius: 6, color: '#ff0000', type: 'fast' });
          }
          tb.fireTimer = phase >= 2 ? 55 : 75;
        }

        // 玩家子弹命中
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hitW = getBulletHitWidth(b);
          if (Math.abs(b.x - tb.x) < tb.w / 2 && Math.abs(b.y - tb.y) < tb.h / 2) {
            if (b.type === 'missile') {
              damageBoss(tb, b.damage);
              bullets.splice(j, 1);
            } else if (b.type === 'laser') {
              damageBoss(tb, b.damage);
            } else {
              damageBoss(tb, b.damage);
              bullets.splice(j, 1);
            }
          }
        }

        // 碰撞玩家
        if (player.invincible <= 0 && Math.abs(tb.x - player.x) < 50 && Math.abs(tb.y - player.y) < 50) {
          playerHit();
        }
      });

      updateBossHud();

      if (twinBosses.every(b => b.dead)) {
        bossDefeated = true;
        bossKilledThisLevel = true;
        createExplosion(CW / 2, 300, false, true);
        Sound.explosion(true);
        Vibration.bossKill();
        // 掉落多个道具
        for (let k = 0; k < 4; k++) spawnPowerup(CW / 2 + (Math.random() - 0.5) * 300, 300 + Math.random() * 100);
        score += 500;
        updateHUD();
        bossHudEl.classList.remove('show');
        if (currentLevelIndex === LEVELS.length - 1) {
          isWin = true; Sound.win(); Vibration.win();
        }
      }
    } else if (boss) {
      // 单个BOSS
      if (boss.y < boss.targetY) {
        boss.y += 2;
      } else {
        // 左右移动
        boss.moveTimer++;
        if (boss.moveTimer > 120) { boss.moveTimer = 0; boss.moveDir *= -1; }
        boss.x += boss.moveDir * 1.2;
        if (boss.x < 150) boss.x = 150;
        if (boss.x > CW - 150) boss.x = CW - 150;
      }
      if (boss.hitTimer > 0) boss.hitTimer--;

      boss.fireTimer--;
      if (boss.fireTimer <= 0 && boss.y >= boss.targetY - 10) {
        const bsm = 1.2;
        const phase = boss.phase;

        switch (boss.pattern) {
          case 'spread3':
            for (let a = -1; a <= 1; a++) pushEnemyBullet({ x: boss.x, y: boss.y + 50, vx: a * 4, vy: 6, radius: 8, color: '#ff6b6b', type: 'normal' });
            boss.fireTimer = 90;
            break;
          case 'ring8':
            if (phase === 1) {
              for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, radius: 8, color: '#e67e22', type: 'normal' });
              }
              boss.fireTimer = 100;
            } else {
              for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 8) {
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, radius: 9, color: '#e67e22', type: 'large' });
              }
              boss.fireTimer = 80;
            }
            break;
          case 'aim3':
            if (phase === 1) {
              const dx = player.x - boss.x, dy = player.y - boss.y;
              const ang = Math.atan2(dy, dx);
              for (let a = -1; a <= 1; a++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang + a * 0.15) * 9, vy: Math.sin(ang + a * 0.15) * 9, radius: 6, color: '#ff0000', type: 'fast' });
              boss.fireTimer = 70;
            } else {
              boss.laserCharge++;
              if (boss.laserCharge >= 80) {
                boss.laserCharge = 0;
                const dx = player.x - boss.x, dy = player.y - boss.y;
                const ang = Math.atan2(dy, dx);
                for (let l = 0; l < 5; l++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang + (l - 2) * 0.08) * 11, vy: Math.sin(ang + (l - 2) * 0.08) * 11, radius: 6, color: '#ff00ff', type: 'fast' });
              }
              boss.fireTimer = 15;
            }
            break;
          case 'spore':
            if (phase === 1) {
              for (let a = 0; a < 6; a++) {
                const ang = (gameFrame * 0.03) + a * Math.PI / 3;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4 + 1, radius: 8, color: '#27ae60', type: 'normal' });
              }
              boss.fireTimer = 85;
            } else {
              for (let a = 0; a < 10; a++) {
                const ang = (gameFrame * 0.04) + a * Math.PI / 5;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5 + 1, radius: 8, color: '#2ecc71', type: 'large' });
              }
              boss.fireTimer = 70;
            }
            break;
          case 'laser':
            boss.laserCharge++;
            if (boss.laserCharge >= 100) {
              boss.laserCharge = 0;
              if (phase === 1) {
                const ang = Math.PI / 2;
                for (let l = -1; l <= 1; l++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang + l * 0.05) * 13, vy: Math.sin(ang + l * 0.05) * 13, radius: 6, color: '#3498db', type: 'fast' });
              } else if (phase === 2) {
                for (let s = -1; s <= 1; s += 2) {
                  const ang = Math.PI / 2 + s * 0.25;
                  for (let l = -1; l <= 1; l++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang + l * 0.03) * 13, vy: Math.sin(ang + l * 0.03) * 13, radius: 6, color: '#3498db', type: 'fast' });
                }
              } else {
                for (let k = 0; k < 8; k++) {
                  const ang = (gameFrame * 0.05) + k * Math.PI / 4;
                  pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 9, vy: Math.sin(ang) * 9, radius: 6, color: '#2980b9', type: 'fast' });
                }
              }
            }
            boss.fireTimer = 12;
            break;
          case 'orbit':
            if (phase === 1) {
              for (let a = 0; a < 8; a++) {
                const ang = (gameFrame * 0.04) + a * Math.PI / 4;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, radius: 8, color: '#e91e63', type: 'normal' });
              }
              boss.fireTimer = 95;
            } else {
              for (let a = 0; a < 12; a++) {
                const ang = (gameFrame * 0.05) + a * Math.PI / 6;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5, radius: 8, color: '#ff69b4', type: 'large' });
              }
              boss.fireTimer = 75;
            }
            break;
          case 'heal':
            boss.healTimer--;
            if (boss.healTimer <= 0) {
              boss.healTimer = 180;
              enemies.forEach(other => {
                if (!other._dead) {
                  other.hp = Math.min(other.maxHp, other.hp + Math.floor(other.maxHp * 0.4));
                }
              });
            }
            if (phase === 1) {
              for (let a = -2; a <= 2; a++) pushEnemyBullet({ x: boss.x, y: boss.y + 40, vx: a * 3, vy: 6, radius: 8, color: '#ecf0f1', type: 'normal' });
              boss.fireTimer = 100;
            } else if (phase === 2) {
              for (let a = 0; a < 6; a++) {
                const ang = (gameFrame * 0.04) + a * Math.PI / 3;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5, radius: 9, color: '#ecf0f1', type: 'large' });
              }
              boss.fireTimer = 85;
            } else {
              for (let a = 0; a < 14; a++) {
                const ang = (gameFrame * 0.06) + a * Math.PI / 7;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 6, vy: Math.sin(ang) * 6, radius: 8, color: '#bdc3c7', type: 'normal' });
              }
              const dx = player.x - boss.x, dy = player.y - boss.y;
              const aimAng = Math.atan2(dy, dx);
              for (let l = -1; l <= 1; l++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(aimAng + l * 0.1) * 11, vy: Math.sin(aimAng + l * 0.1) * 11, radius: 6, color: '#ffffff', type: 'fast' });
              boss.fireTimer = 65;
            }
            break;
          case 'dragon':
            if (phase === 1) {
              for (let a = -2; a <= 2; a++) pushEnemyBullet({ x: boss.x, y: boss.y + 50, vx: a * 3.5, vy: 6, radius: 8, color: '#9b59b6', type: 'normal' });
              boss.fireTimer = 90;
            } else if (phase === 2) {
              for (let a = 0; a < 8; a++) {
                const ang = (gameFrame * 0.05) + a * Math.PI / 4;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5, radius: 9, color: '#8e44ad', type: 'large' });
              }
              const dx = player.x - boss.x, dy = player.y - boss.y;
              const ang = Math.atan2(dy, dx);
              for (let l = -1; l <= 1; l++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang + l * 0.12) * 10, vy: Math.sin(ang + l * 0.12) * 10, radius: 6, color: '#ff0000', type: 'fast' });
              boss.fireTimer = 70;
            } else {
              for (let a = 0; a < 16; a++) {
                const ang = (gameFrame * 0.07) + a * Math.PI / 8;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 6.5, vy: Math.sin(ang) * 6.5, radius: 8, color: '#1a1a2e', type: 'large' });
              }
              boss.fireTimer = 55;
            }
            break;
          case 'apocalypse':
            if (phase === 1) {
              for (let a = 0; a < 20; a++) {
                const ang = (gameFrame * 0.08) + a * Math.PI / 10;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5, radius: 8, color: '#c0392b', type: 'normal' });
              }
              boss.fireTimer = 55;
            } else if (phase === 2) {
              for (let a = 0; a < 6; a++) {
                const ang = (gameFrame * 0.06) + a * Math.PI / 3;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * 6.5, vy: Math.sin(ang) * 6.5, radius: 9, color: '#e74c3c', type: 'large' });
              }
              const dx = player.x - boss.x, dy = player.y - boss.y;
              const ang = Math.atan2(dy, dx);
              for (let l = -2; l <= 2; l++) pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang + l * 0.1) * 12, vy: Math.sin(ang + l * 0.1) * 12, radius: 6, color: '#ffcc33', type: 'fast' });
              boss.fireTimer = 45;
            } else {
              for (let a = 0; a < 24; a++) {
                const ang = (gameFrame * 0.1) + a * Math.PI / 12;
                pushEnemyBullet({ x: boss.x, y: boss.y, vx: Math.cos(ang) * (5 + Math.sin(gameFrame * 0.05) * 2), vy: Math.sin(ang) * (5 + Math.sin(gameFrame * 0.05) * 2), radius: 8, color: '#ff0000', type: 'large' });
              }
              boss.fireTimer = 40;
            }
            break;
        }
      }

      // BOSS碰撞玩家
      if (player.invincible <= 0 && Math.abs(boss.x - player.x) < (boss.w / 2 + 10) && Math.abs(boss.y - player.y) < (boss.h / 2 + 10)) {
        playerHit();
      }

      // 玩家子弹命中BOSS
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const hitW = getBulletHitWidth(b);
        if (Math.abs(b.x - boss.x) < (boss.w / 2 + hitW) && Math.abs(b.y - boss.y) < (boss.h / 2 + hitW)) {
          if (b.type === 'missile') {
            damageBoss(boss, b.damage);
            bullets.splice(j, 1);
          } else if (b.type === 'laser') {
            damageBoss(boss, b.damage);
          } else {
            damageBoss(boss, b.damage);
            bullets.splice(j, 1);
          }
        }
      }

      updateBossHud();

      if (boss.dead) {
        bossDefeated = true;
        bossKilledThisLevel = true;
        createExplosion(boss.x, boss.y, false, true);
        Sound.explosion(true);
        Vibration.bossKill();
        for (let k = 0; k < 4; k++) spawnPowerup(boss.x + (Math.random() - 0.5) * 200, boss.y + Math.random() * 80);
        score += 300 + currentLevelIndex * 100;
        updateHUD();
        bossHudEl.classList.remove('show');
        boss = null;

        if (currentLevelIndex === LEVELS.length - 1) {
          isWin = true; Sound.win(); Vibration.win();
        }
      }
    }
  }

  // BOSS预警绘制计时递减已在上方处理

  // 拾取掉落物
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.speed; p.time += 0.1;
    if (p.y > CH + 30) { powerups.splice(i, 1); continue; }
    if (Math.abs(p.x - player.x) < 50 && Math.abs(p.y - player.y) < 50) {
      if (p.type === 'shield') {
        hasShield = true; shieldTimer = SHIELD_DURATION;
        addFloatingText(p.x, p.y, '护盾激活', '#22e0ff');
        Sound.pickup(); Vibration.pickup();
      } else if (p.type === 'heart') {
        lives++;
        addFloatingText(p.x, p.y, '❤️ 生命 +1', '#ff2d78');
        Sound.pickup(); Vibration.pickup();
      } else {
        const cfg = WEAPON_CONFIG[p.type];
        if (currentWeapon === p.type && getEffectiveLevel(p.type) < 3) {
          weaponLevels[p.type] = Math.min(3, (weaponLevels[p.type] || 1) + 1);
          weaponTimer = MAX_WEAPON_TIME;
          addFloatingText(p.x, p.y, `${cfg.name} 升级 Lv${weaponLevels[p.type]}!`, '#ffcc33');
          Sound.upgrade(); Vibration.pickup();
        } else {
          currentWeapon = p.type;
          weaponTimer = MAX_WEAPON_TIME;
          addFloatingText(p.x, p.y, `${cfg.icon} ${cfg.name} Lv${getEffectiveLevel(p.type)}`, cfg.color);
          Sound.pickup(); Vibration.pickup();
        }
      }
      powerups.splice(i, 1);
      createExplosion(player.x, player.y - 20, true);
      updateHUD();
    }
  }

  // 敌方子弹更新
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.life = (eb.life || 0) + 1;
    if (eb.bounced && eb.hits > 0) {
      const dx = player.x - eb.x, dy = player.y - eb.y;
      const dist = Math.hypot(dx, dy) || 1;
      const spd = Math.hypot(eb.vx, eb.vy) || 1;
      const turn = 0.042;
      eb.vx += (dx / dist) * spd * turn;
      eb.vy += (dy / dist) * spd * turn;
      const ns = Math.hypot(eb.vx, eb.vy) || 1;
      const cap = 6.2;
      if (ns > cap) { eb.vx = eb.vx / ns * cap; eb.vy = eb.vy / ns * cap; }
      if (eb.life > 240) { enemyBullets.splice(i, 1); continue; }
    }
    eb.x += eb.vx; eb.y += eb.vy;
    if (eb.y > CH + 30 || eb.x < -30 || eb.x > CW + 30 || eb.y < -30) { enemyBullets.splice(i, 1); continue; }

    const hitRadius = eb.radius * 0.65;
    if (player.invincible <= 0 &&
        Math.abs(eb.x - player.x) < (18 + hitRadius) &&
        Math.abs(eb.y - player.y) < (22 + hitRadius)) {
      eb.hits--;
      if (eb.hits <= 0) enemyBullets.splice(i, 1);
      else {
        const spd = Math.hypot(eb.vx, eb.vy) || 5;
        const ang = Math.atan2(eb.vy, eb.vx);
        const na = ang + Math.PI + (Math.random() - 0.5) * 0.9;
        eb.vx = Math.cos(na) * spd * 0.62;
        eb.vy = Math.sin(na) * spd * 0.62;
        eb.y -= 26; eb.bounced = true;
      }
      playerHit();
      continue;
    }
  }

  if (player.invincible > 0) player.invincible--;

  // 粒子
  for (let i = explosions.length - 1; i >= 0; i--) {
    const exp = explosions[i];
    exp.x += exp.vx; exp.y += exp.vy; exp.vx *= 0.94; exp.vy *= 0.94;
    exp.life -= exp.decay;
    if (exp.life <= 0) explosions.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 2.5; ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  clouds.forEach(c => { c.y += c.speed; if (c.y > CH + 200) { c.y = -200; c.x = Math.random() * CW; } });
  groundFogs.forEach(f => { f.y += f.speed; if (f.y - f.radius > CH) { f.y = -f.radius; f.x = Math.random() * CW; } });
}

function playerHit() {
  if (player.invincible > 0) return;
  Vibration.playerHit();
  if (hasShield) {
    hasShield = false; shieldTimer = 0; player.invincible = 50;
    createExplosion(player.x, player.y, true);
    addFloatingText(player.x, player.y - 30, '护盾破碎', '#22e0ff');
    Sound.shieldBreak();
    return;
  }
  lives--; updateHUD(); createExplosion(player.x, player.y, true);
  Sound.hurt();
  currentWeapon = 'normal'; weaponTimer = 0;
  addFloatingText(player.x, player.y - 30, '受伤！', '#ff2d78');
  if (lives <= 0) gameOver();
  else player.invincible = 100;
}

function gameOver() {
  isGameOver = true;
  createExplosion(player.x, player.y, true);
  Sound.explosion(true);
  Sound.gameOver();
  Vibration.gameOver();
}

/* ============================================================
   五、绘制部分
   ============================================================ */
let targetX = CW / 2, targetY = CH - 250;

function updatePlayerPos(clientX, clientY, isTouch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let tx = (clientX - rect.left) * scaleX;
  let ty = (clientY - rect.top) * scaleY;
  if (isTouch) ty -= 100;
  targetX = Math.max(40, Math.min(CW - 40, tx));
  targetY = Math.max(100, Math.min(CH - 60, ty));
}

function drawAdvancedGround() {
  const baseGradient = ctx.createLinearGradient(0, 0, 0, CH);
  baseGradient.addColorStop(0, '#141f10');
  baseGradient.addColorStop(0.5, '#16200f');
  baseGradient.addColorStop(1, '#0e150b');
  ctx.fillStyle = baseGradient; ctx.fillRect(0, 0, CW, CH);
  const drawPass = (offsetY) => {
    groundElements.forEach(el => {
      const y = el.y + offsetY;
      if (y < -300 || y > CH + 300) return;
      if (el.type === 'mountain') {
        ctx.fillStyle = 'rgba(8, 15, 4, 0.5)';
        ctx.beginPath(); ctx.ellipse(el.x, y, el.size, el.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      } else if (el.type === 'forest') {
        ctx.fillStyle = 'rgba(12, 25, 8, 0.7)';
        ctx.beginPath(); ctx.arc(el.x + 8, y + 8, el.size * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(25, 45, 15, 0.9)';
        ctx.beginPath(); ctx.arc(el.x, y, el.size * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(50, 80, 30, 0.4)';
        ctx.beginPath(); ctx.arc(el.x - el.size * 0.1, y - el.size * 0.1, el.size * 0.3, 0, Math.PI * 2); ctx.fill();
      } else if (el.type === 'farm') {
        const farmColors = ['#344e23', '#4e5a19', '#5c4c18'];
        ctx.fillStyle = farmColors[el.colorIndex]; ctx.fillRect(el.x - el.w / 2, y - el.h / 2, el.w, el.h);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)'; ctx.lineWidth = 2;
        ctx.beginPath();
        if (el.isHorizontal) { for (let i = 0; i < el.w; i += 10) { ctx.moveTo(el.x - el.w / 2 + i, y - el.h / 2); ctx.lineTo(el.x - el.w / 2 + i, y + el.h / 2); } }
        else { for (let i = 0; i < el.h; i += 10) { ctx.moveTo(el.x - el.w / 2, y - el.h / 2 + i); ctx.lineTo(el.x + el.w / 2, y - el.h / 2 + i); } }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(15, 25, 8, 0.7)'; ctx.lineWidth = 3; ctx.strokeRect(el.x - el.w / 2, y - el.h / 2, el.w, el.h);
      } else if (el.type === 'building') {
        ctx.fillStyle = 'rgba(120, 115, 105, 0.8)'; ctx.fillRect(el.x - el.w / 2, y - el.h / 2, el.w, el.h);
        ctx.fillStyle = 'rgba(20, 20, 20, 0.7)';
        ctx.fillRect(el.x + el.w / 2 - 3, y - el.h / 2 + 3, 3, el.h);
        ctx.fillRect(el.x - el.w / 2 + 3, y + el.h / 2 - 3, el.w - 3, 3);
      }
    });
  };
  drawPass(groundOffset); drawPass(groundOffset - CH * 2);
  const drawRiver = (offsetY) => {
    ctx.save(); ctx.translate(0, offsetY);
    ctx.beginPath(); ctx.moveTo(-200, -100); ctx.bezierCurveTo(300, 400, 700, 800, -100, CH + 200);
    ctx.strokeStyle = 'rgba(30, 60, 85, 0.9)'; ctx.lineWidth = 100; ctx.stroke();
    ctx.strokeStyle = 'rgba(100, 160, 200, 0.25)'; ctx.lineWidth = 30; ctx.stroke();
    ctx.restore();
  };
  drawRiver(groundOffset); drawRiver(groundOffset - CH * 2);
}

function drawCloud(x, y, scale, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(140, 160, 180, 0.4)';
  ctx.beginPath(); ctx.arc(8, 10, 40, 0, Math.PI * 2); ctx.arc(35, -5, 50, 0, Math.PI * 2); ctx.arc(70, 12, 42, 0, Math.PI * 2); ctx.arc(40, 25, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.arc(30, -15, 50, 0, Math.PI * 2); ctx.arc(65, 2, 42, 0, Math.PI * 2); ctx.arc(32, 15, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath(); ctx.arc(25, -20, 40, 0, Math.PI * 2); ctx.arc(50, -5, 30, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGroundFog() {
  ctx.save();
  groundFogs.forEach(f => {
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    grad.addColorStop(0, `rgba(220, 235, 245, ${f.alpha})`);
    grad.addColorStop(0.5, `rgba(220, 235, 245, ${f.alpha * 0.5})`);
    grad.addColorStop(1, 'rgba(220, 235, 245, 0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

function drawPlayer() {
  if (isGameOver || isWin || lives <= 0) return;
  if (player.invincible > 0 && Math.floor(gameFrame / 4) % 2 === 0) return;
  ctx.save(); ctx.translate(player.x, player.y);
  if (gameFrame % 4 < 2) {
    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
    ctx.beginPath(); ctx.moveTo(-8, 20); ctx.lineTo(0, 35 + Math.random() * 15); ctx.lineTo(8, 20); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-4, 20); ctx.lineTo(0, 30 + Math.random() * 8); ctx.lineTo(4, 20); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.beginPath(); ctx.ellipse(5, 5, 18, 25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#922b21';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-35, 15); ctx.lineTo(-25, 25); ctx.lineTo(-10, 15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(35, 15); ctx.lineTo(25, 25); ctx.lineTo(10, 15); ctx.fill();
  const bodyGradient = ctx.createLinearGradient(-15, 0, 15, 0);
  bodyGradient.addColorStop(0, '#e74c3c'); bodyGradient.addColorStop(0.5, '#f1948a'); bodyGradient.addColorStop(1, '#e74c3c');
  ctx.fillStyle = bodyGradient;
  ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(12, 10); ctx.lineTo(8, 20); ctx.lineTo(-8, 20); ctx.lineTo(-12, 10); ctx.fill();
  ctx.fillStyle = '#17202a'; ctx.beginPath(); ctx.ellipse(0, -5, 6, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.ellipse(-2, -8, 2, 5, 0, 0, Math.PI * 2); ctx.fill();
  if (hasShield) {
    const isBlinking = shieldTimer < 120 && Math.floor(gameFrame / 4) % 2 === 0;
    if (!isBlinking) {
      ctx.shadowColor = '#22e0ff'; ctx.shadowBlur = 20;
      const radius = 40 + Math.sin(gameFrame * 0.1) * 4;
      ctx.strokeStyle = 'rgba(34, 224, 255, 0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(34, 224, 255, 0.15)'; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const isHit = e.hitTimer > 0;
  let mainColor, wingColor, cockpitColor, sizeMult = 1;
  switch (e.type) {
    case 'armored': mainColor = '#2c3e50'; wingColor = '#1a252f'; cockpitColor = '#e74c3c'; sizeMult = 1.4; break;
    case 'bomber': mainColor = '#d35400'; wingColor = '#873600'; cockpitColor = '#f1c40f'; sizeMult = 0.8; break;
    case 'sniper': mainColor = '#8e44ad'; wingColor = '#4a148c'; cockpitColor = '#00ffff'; sizeMult = 1.1; break;
    case 'shielder': mainColor = '#00bcd4'; wingColor = '#006064'; cockpitColor = '#00e5ff'; sizeMult = 1.2; break;
    case 'splitter': mainColor = '#27ae60'; wingColor = '#145a32'; cockpitColor = '#2ecc71'; sizeMult = 1.1; break;
    case 'healer': mainColor = '#ecf0f1'; wingColor = '#bdc3c7'; cockpitColor = '#2ecc71'; sizeMult = 1.15; break;
    case 'laser': mainColor = '#e91e63'; wingColor = '#880e4f'; cockpitColor = '#ff4081'; sizeMult = 1.1; break;
    case 'orbiter': mainColor = '#ff9800'; wingColor = '#e65100'; cockpitColor = '#ffc107'; sizeMult = 1.15; break;
    case 'elite': mainColor = '#1a1a2e'; wingColor = '#0f0f1a'; cockpitColor = '#ff0055'; sizeMult = 1.5; break;
    default:
      if (e.stage === 1) { mainColor = '#c0392b'; wingColor = '#7b241c'; cockpitColor = '#f39c12'; }
      else if (e.stage === 2) { mainColor = '#e67e22'; wingColor = '#a04000'; cockpitColor = '#f1c40f'; }
      else { mainColor = '#16a085'; wingColor = '#0e6655'; cockpitColor = '#ffffff'; }
  }
  if (isHit) { mainColor = '#ffffff'; wingColor = '#ffffff'; cockpitColor = '#ffffff'; }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.beginPath(); ctx.ellipse(6, 6, 22 * sizeMult, 20 * sizeMult, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = wingColor;
  ctx.beginPath(); ctx.moveTo(-10 * sizeMult, 0); ctx.lineTo(-35 * sizeMult, -15); ctx.lineTo(-15 * sizeMult, 5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10 * sizeMult, 0); ctx.lineTo(35 * sizeMult, -15); ctx.lineTo(15 * sizeMult, 5); ctx.fill();
  ctx.fillStyle = mainColor;
  ctx.beginPath(); ctx.ellipse(0, 0, 14 * sizeMult, 22 * sizeMult, 0, 0, Math.PI * 2); ctx.fill();
  // 护盾视觉
  if (e.hasShield && e.shieldHp > 0) {
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.8)'; ctx.lineWidth = 3;
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(0, 0, 26 * sizeMult, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // 激光机充能
  if (e.type === 'laser' && e.laserCharge > 20) {
    ctx.fillStyle = `rgba(255, 0, 255, ${e.laserCharge / 60 * 0.6})`;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = cockpitColor;
  if (e.type !== 'normal' || e.stage >= 3) {
    ctx.shadowColor = cockpitColor; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, 6, 5 * sizeMult, 7 * sizeMult, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.beginPath(); ctx.ellipse(0, 6, 7 * sizeMult, 9 * sizeMult, 0, 0, Math.PI * 2); ctx.fill();
  }
  // HP条（非普通敌机）
  if (e.hp < e.maxHp && e.maxHp > 0) {
    const bw = 30 * sizeMult;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-bw/2, -30 * sizeMult, bw, 4);
    ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#2ecc71' : (e.hp / e.maxHp > 0.25 ? '#f39c12' : '#e74c3c');
    ctx.fillRect(-bw/2, -30 * sizeMult, bw * Math.max(0, e.hp / e.maxHp), 4);
  }
  ctx.restore();
}

function drawBoss() {
  if (!bossSpawned) return;
  const drawOne = (b) => {
    if (!b || b.dead) return;
    ctx.save(); ctx.translate(b.x, b.y);
    const isHit = b.hitTimer > 0;
    const w = b.w, h = b.h;
    // 光环
    ctx.shadowColor = b.color; ctx.shadowBlur = 25;
    ctx.fillStyle = isHit ? '#ffffff' : b.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 内核
    ctx.fillStyle = isHit ? '#ffffff' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 0, w / 3, h / 3, 0, 0, Math.PI * 2); ctx.fill();
    // 炮口
    ctx.fillStyle = isHit ? '#ffffff' : '#ffcc33';
    for (let a = -1; a <= 1; a += 2) {
      ctx.beginPath(); ctx.ellipse(a * w / 4, h / 4, 10, 14, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 眼睛
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-w / 6, -h / 6, 6, 0, Math.PI * 2); ctx.arc(w / 6, -h / 6, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(-w / 6, -h / 6, 3, 0, Math.PI * 2); ctx.arc(w / 6, -h / 6, 3, 0, Math.PI * 2); ctx.fill();
    // 阶段标识
    if (b.maxPhase > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`P${b.phase}`, 0, h / 2 + 20);
    }
    ctx.restore();
  };

  if (currentLevelIndex === 8 && twinBosses) {
    twinBosses.forEach(tb => drawOne(tb));
  } else if (boss) {
    drawOne(boss);
  }
}

function drawPowerups() {
  powerups.forEach(p => {
    ctx.save(); ctx.translate(p.x, p.y);
    const scale = 1.2 + Math.sin(p.time) * 0.2;
    ctx.scale(scale, scale);
    let color = '', letter = '';
    if (p.type === 'shield') { color = '#ffd700'; letter = 'S'; }
    if (p.type === 'heart') { color = '#ff2d78'; letter = '❤'; }
    if (p.type === 'red') { color = '#ff4d4d'; letter = 'R'; }
    if (p.type === 'blue') { color = '#4dffff'; letter = 'B'; }
    if (p.type === 'green') { color = '#4dff4d'; letter = 'G'; }
    if (p.type === 'purple') { color = '#d500f9'; letter = 'P'; }
    if (p.type === 'missile') { color = '#ff66cc'; letter = 'M'; }
    if (p.type === 'flame') { color = '#ff6600'; letter = 'F'; }
    if (p.type === 'railgun') { color = '#66ffff'; letter = 'E'; }
    const sameWeapon = (currentWeapon === p.type);
    const canUpgrade = sameWeapon && getEffectiveLevel(p.type) < 3;
    ctx.shadowColor = color; ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(letter, 0, 1);
    if (canUpgrade) {
      ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ffcc33';
      ctx.font = 'bold 10px "Microsoft YaHei"';
      ctx.fillText('↑', 0, -22);
    }
    ctx.restore();
  });
}

function draw() {
  drawAdvancedGround();
  drawGroundFog();
  clouds.forEach(c => { if (c.layer === 'far') drawCloud(c.x, c.y, c.scale, c.alpha); });

  ctx.globalCompositeOperation = 'lighter';
  explosions.forEach(exp => {
    ctx.globalAlpha = exp.life;
    ctx.fillStyle = exp.color;
    ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.size * exp.life, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1.0;

  // 玩家子弹
  bullets.forEach(b => {
    ctx.shadowColor = b.color; ctx.shadowBlur = 15; ctx.fillStyle = b.color;
    if (b.type === 'laser') {
      ctx.fillRect(b.x - 4, b.y - 30, 8, 60);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x - 2, b.y - 30, 4, 60);
    } else if (b.type === 'railgun') {
      ctx.fillRect(b.x - 6, b.y - 40, 12, 80);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x - 3, b.y - 40, 6, 80);
    } else if (b.type === 'homing') {
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
    } else if (b.type === 'missile') {
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 6, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255, 220, 100, 0.8)';
      ctx.beginPath(); ctx.ellipse(b.x, b.y + 12, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
    } else if (b.type === 'flame') {
      const alpha = Math.max(0, 1 - (b.life || 0) / 15);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff6600';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffcc00'; ctx.globalAlpha = alpha * 0.7;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 4, 15, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  });

  // 敌方子弹
  enemyBullets.forEach(eb => {
    ctx.save(); ctx.translate(eb.x, eb.y);
    if (eb.bounced) {
      ctx.globalAlpha = 0.25 + Math.abs(Math.sin(gameFrame * 0.15)) * 0.28;
      ctx.fillStyle = '#ff2d78';
      ctx.beginPath(); ctx.arc(0, 0, eb.radius + 12, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (eb.type === 'huge') {
      ctx.rotate(gameFrame * 0.05);
      ctx.shadowColor = eb.color; ctx.shadowBlur = 30;
      ctx.fillStyle = eb.color; ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius * 1.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1.0; ctx.beginPath(); ctx.arc(0, 0, eb.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, eb.radius * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-eb.radius * 1.6, 0); ctx.lineTo(eb.radius * 1.6, 0); ctx.moveTo(0, -eb.radius * 1.6); ctx.lineTo(0, eb.radius * 1.6); ctx.stroke();
    } else if (eb.type === 'large') {
      ctx.shadowColor = eb.color; ctx.shadowBlur = 20; ctx.fillStyle = eb.color;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
    } else if (eb.type === 'fast') {
      ctx.shadowColor = eb.color; ctx.shadowBlur = 15; ctx.fillStyle = eb.color;
      ctx.rotate(Math.atan2(eb.vy, eb.vx) - Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, -eb.radius * 2.5); ctx.lineTo(eb.radius * 1.2, 0); ctx.lineTo(0, eb.radius * 2); ctx.lineTo(-eb.radius * 1.2, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, eb.radius * 0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.shadowColor = eb.color; ctx.shadowBlur = 15; ctx.fillStyle = eb.color;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(-eb.radius * 0.3, -eb.radius * 0.3, eb.radius * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    if ((eb.hits || 1) > 1) {
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = eb.bounced ? 'rgba(255,120,140,0.95)' : 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  });

  enemies.forEach(e => drawEnemy(e));
  drawBoss();
  drawPowerups();
  drawPlayer();

  floatingTexts.forEach(ft => {
    ctx.globalAlpha = ft.life / ft.maxLife; ctx.fillStyle = ft.color; ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = '#000'; ctx.shadowBlur = 5;
    ctx.fillText(ft.text, ft.x, ft.y); ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1.0;

  clouds.forEach(c => { if (c.layer === 'near') drawCloud(c.x, c.y, c.scale, c.alpha); });

  const fogGradient = ctx.createLinearGradient(0, 0, 0, CH * 0.4);
  fogGradient.addColorStop(0, 'rgba(200, 220, 240, 0.3)');
  fogGradient.addColorStop(1, 'rgba(200, 220, 240, 0.0)');
  ctx.fillStyle = fogGradient; ctx.fillRect(0, 0, CW, CH);

  const vignette = ctx.createRadialGradient(CW / 2, CH / 2, CH / 3, CW / 2, CH / 2, CH * 0.8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, CW, CH);

  // BOSS预警
  if (bossPending && bossWarningTimer > 0) {
    if (Math.floor(bossWarningTimer / 10) % 2 === 0) { ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; ctx.fillRect(0, 0, CW, CH); }
    ctx.fillStyle = '#ff1744'; ctx.font = 'bold 56px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 25;
    ctx.fillText('⚠ BOSS 来袭 ⚠', CW / 2, CH / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px "Microsoft YaHei"';
    ctx.fillText(`${BOSS_CONFIG[currentLevelIndex] ? BOSS_CONFIG[currentLevelIndex].name : 'BOSS'}`, CW / 2, CH / 2 + 30);
  }

  if (levelTransitionTimer > 0) {
    const alpha = Math.min(1, levelTransitionTimer / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, CH / 2 - 100, CW, 200);
    ctx.fillStyle = '#ffcc33';
    ctx.font = 'bold 48px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 20;
    ctx.fillText(levelTransitionText, CW / 2, CH / 2 - 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = '24px "Microsoft YaHei"';
    ctx.fillText('准备迎战', CW / 2, CH / 2 + 40);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1.0;
  }

  if (isGameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#ff3333'; ctx.font = 'bold 70px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20; ctx.fillText('游戏结束', CW / 2, CH / 2 - 30); ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff'; ctx.font = '30px "Microsoft YaHei"';
    ctx.fillText(`到达第 ${currentLevelIndex + 1} 关 · 得分 ${score}`, CW / 2, CH / 2 + 40);
    ctx.fillText('点击屏幕 或 按 [R] 重新开始', CW / 2, CH / 2 + 100);
  }

  if (isWin) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#00ff88'; ctx.font = 'bold 70px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20; ctx.fillText('全部通关！', CW / 2, CH / 2 - 30); ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff'; ctx.font = '30px "Microsoft YaHei"';
    ctx.fillText(`最终得分 ${score}`, CW / 2, CH / 2 + 40);
    ctx.fillText('点击屏幕 或 按 [R] 重新开始', CW / 2, CH / 2 + 100);
  }
}

/* ============================================================
   六、主循环 & 启动
   ============================================================ */
function gameLoop() {
  if (gameStarted) update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  ensureAudio();
  if (!gameStarted) { gameStarted = true; resetGame(); }
  startScreen.classList.add('hidden');
}

startBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); startGame(); });
startScreen.addEventListener('click', () => startGame());
startScreen.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, { passive: false });

muteBtn.addEventListener('click', (e) => {
  e.preventDefault(); e.stopPropagation(); ensureAudio();
  const on = Sound.toggle();
  muteBtn.textContent = on ? '🔊' : '🔇';
  muteBtn.style.opacity = on ? '1' : '0.55';
});
muteBtn.addEventListener('touchstart', (e) => {
  e.preventDefault(); e.stopPropagation(); ensureAudio();
  const on = Sound.toggle();
  muteBtn.textContent = on ? '🔊' : '🔇';
  muteBtn.style.opacity = on ? '1' : '0.55';
}, { passive: false });

/* ---------- 输入事件 ---------- */
canvas.addEventListener('mousemove', (e) => updatePlayerPos(e.clientX, e.clientY, false));
canvas.addEventListener('mousedown', (e) => { ensureAudio(); updatePlayerPos(e.clientX, e.clientY, false); });
canvas.addEventListener('click', () => { if (isGameOver || isWin) resetGame(); });
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); ensureAudio();
  if (e.touches.length > 0) updatePlayerPos(e.touches[0].clientX, e.touches[0].clientY, true);
  if (isGameOver || isWin) resetGame();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length > 0) updatePlayerPos(e.touches[0].clientX, e.touches[0].clientY, true);
}, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') resetGame();
  if ((isGameOver || isWin) && e.key === ' ') { e.preventDefault(); resetGame(); }
});

document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let _lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - _lastTouchEnd <= 320) e.preventDefault();
  _lastTouchEnd = now;
}, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) pausedMask.classList.add('show');
  else { pausedMask.classList.remove('show'); Sound.resume(); }
});

/* ---- 初始化 ---- */
initEnvironment();
resetGame();
gameLoop();
</script>
