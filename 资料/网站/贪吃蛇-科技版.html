<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#050a18" />
<title>赛博贪吃蛇</title>
<style>
  :root {
    --bg-0: #050a18;
    --cyan: #00f0ff;
    --cyan-soft: #6ff7ff;
    --magenta: #ff2d95;
    --violet: #7b5cff;
    --gold: #ffd54a;
    --gold-soft: #ffe98a;
    --gold-deep: #ff9d00;
    --text: #d6ecff;
    --text-dim: #6b8ab0;
    --panel: rgba(8, 18, 38, .86);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% 0%, #10224a 0%, var(--bg-0) 55%, #02040a 100%);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "SF Mono", Consolas, monospace;
    color: var(--text);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, .045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse at center, #000 28%, transparent 74%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 28%, transparent 74%);
    pointer-events: none;
    animation: gridDrift 26s linear infinite;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0px, rgba(0,0,0,.20) 1px, transparent 1px, transparent 3px);
    pointer-events: none; opacity: .45;
  }
  @keyframes gridDrift {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 46px, 46px 0; }
  }

  #wrap {
    position: relative;
    padding: 18px 18px 14px;
    border-radius: 16px;
    background:
      linear-gradient(160deg, rgba(14, 30, 60, .94), rgba(4, 8, 20, .97));
    border: 1px solid rgba(0, 240, 255, .30);
    box-shadow:
      0 0 0 1px rgba(0, 240, 255, .07) inset,
      0 0 28px rgba(0, 240, 255, .14),
      0 0 100px rgba(123, 92, 255, .12),
      0 26px 76px rgba(0, 0, 0, .78);
    clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  }
  #wrap::before, #wrap::after {
    content: ""; position: absolute; width: 24px; height: 24px;
    border-color: var(--cyan); pointer-events: none;
    filter: drop-shadow(0 0 5px var(--cyan)); opacity: .85;
  }
  #wrap::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; border-top-left-radius: 4px; }
  #wrap::after  { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; border-bottom-right-radius: 4px; }

  #hud {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 0 4px 12px;
    font-size: 12px; letter-spacing: .14em;
    color: var(--text-dim);
  }
  #hud .brand {
    color: var(--cyan); font-weight: 700; letter-spacing: .2em;
    text-shadow: 0 0 10px rgba(0,240,255,.85);
  }
  #hud .brand span { color: var(--gold); text-shadow: 0 0 10px rgba(255,213,74,.85); }
  #hud .stats { display: flex; gap: 18px; }
  #hud .stats span { display: flex; align-items: center; gap: 6px; }
  #hud .stats b {
    color: #fff; font-weight: 700; font-size: 14px;
    text-shadow: 0 0 10px rgba(0,240,255,.7);
    font-variant-numeric: tabular-nums;
  }

  #game-frame {
    position: relative;
    border-radius: 8px;
    padding: 2px;
    background: linear-gradient(135deg, rgba(0,240,255,.55), rgba(123,92,255,.35), rgba(255,213,74,.35));
    box-shadow: 0 0 24px rgba(0,240,255,.18), 0 0 60px rgba(123,92,255,.12);
  }
  canvas {
    display: block; border-radius: 6px; background: #030814;
    touch-action: none;
    box-shadow: 0 0 22px rgba(0,240,255,.10) inset;
  }

  #overlay {
    position: absolute; inset: 18px 18px 14px;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    text-align: center; border-radius: 10px;
    background: radial-gradient(ellipse at center, rgba(4,10,24,.86), rgba(2,4,10,.96));
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 20;
  }
  #overlay.show { display: flex; animation: fadeIn .28s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: scale(1); } }

  #overlay h2 {
    margin: 0; font-size: clamp(22px, 5.4vw, 32px); letter-spacing: .16em; color: #fff;
    text-shadow: 0 0 12px var(--cyan), 0 0 34px rgba(0,240,255,.55), 0 0 64px rgba(123,92,255,.4);
  }
  #overlay h2 .accent { color: var(--gold); text-shadow: 0 0 16px var(--gold-deep), 0 0 40px rgba(255,157,0,.5); }
  #overlay p { margin: 0; max-width: 320px; font-size: 12.5px; line-height: 1.8; letter-spacing: .05em; color: var(--text-dim); }
  #overlay p b { color: var(--cyan-soft); font-weight: 600; }

  #overlay button {
    margin-top: 12px; padding: 13px 38px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: .24em; color: #021018;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold) 45%, var(--gold-deep));
    border: none; border-radius: 5px; cursor: pointer;
    box-shadow: 0 0 16px rgba(255,213,74,.6), 0 0 48px rgba(255,213,74,.25);
    transition: transform .15s, box-shadow .22s, filter .22s;
    clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
  }
  #overlay button:hover { filter: brightness(1.14); box-shadow: 0 0 22px rgba(255,213,74,.9), 0 0 70px rgba(255,213,74,.4); }
  #overlay button:active { transform: scale(.97); }

  .touch-hint { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .touch-hint { display: block; }
    .pc-hint { display: none; }
  }

  /* ===== 触屏控件层：左摇杆 + 右加速 ===== */
  #controls {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 30;
    display: none;
  }
  @media (hover: none) and (pointer: coarse) {
    #controls { display: block; }
  }

  /* 左下角摇杆 */
  #joystick {
    position: absolute;
    left: max(20px, env(safe-area-inset-left));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 138px; height: 138px;
    pointer-events: auto;
    touch-action: none;
  }
  #joystick .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,240,255,.12), rgba(4,10,24,.6) 68%);
    border: 1px solid rgba(0,240,255,.4);
    box-shadow:
      0 0 22px rgba(0,240,255,.22),
      0 0 0 7px rgba(0,240,255,.045) inset,
      0 0 0 1px rgba(0,240,255,.08);
  }
  /* 环形刻度 */
  #joystick .ring::before {
    content: ""; position: absolute; inset: 12px;
    border-radius: 50%;
    border: 1px dashed rgba(0,240,255,.20);
  }
  #joystick .arrow {
    position: absolute; width: 0; height: 0;
    border: 6px solid transparent;
    opacity: .55;
    filter: drop-shadow(0 0 4px rgba(0,240,255,.7));
  }
  #joystick .arrow.up    { top: 4px;  left: 50%; transform: translateX(-50%); border-bottom-color: var(--cyan); }
  #joystick .arrow.down  { bottom: 4px; left: 50%; transform: translateX(-50%); border-top-color: var(--cyan); }
  #joystick .arrow.left  { left: 4px; top: 50%; transform: translateY(-50%); border-right-color: var(--cyan); }
  #joystick .arrow.right { right: 4px; top: 50%; transform: translateY(-50%); border-left-color: var(--cyan); }

  #joystick .knob {
    position: absolute; left: 50%; top: 50%;
    width: 62px; height: 62px; margin: -31px 0 0 -31px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #b6fdff, var(--cyan) 42%, #086a83 100%);
    border: 1px solid rgba(255,255,255,.55);
    box-shadow: 0 0 22px rgba(0,240,255,.85), 0 0 52px rgba(0,240,255,.4);
    transition: transform .05s linear;
    will-change: transform;
  }
  #joystick .knob::after {
    content: ""; position: absolute; inset: 15px;
    border-radius: 50%;
    border: 1px dashed rgba(2,16,24,.5);
  }
  #joystick .caption {
    position: absolute; left: 50%; bottom: -22px;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: .3em;
    color: rgba(0,240,255,.6); white-space: nowrap;
  }

  /* 右下角加速按钮 */
  #boost {
    position: absolute;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(34px, env(safe-area-inset-bottom));
    width: 104px; height: 104px;
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 45%, rgba(255,213,74,.22), rgba(20,10,4,.75) 70%);
    border: 1px solid rgba(255,213,74,.55);
    box-shadow:
      0 0 24px rgba(255,213,74,.28),
      0 0 0 7px rgba(255,213,74,.05) inset;
    color: var(--gold-soft);
    font-size: 13px; font-weight: 700; letter-spacing: .2em;
    text-shadow: 0 0 12px rgba(255,213,74,.9);
    transition: transform .08s, box-shadow .15s, background .15s;
    user-select: none;
  }
  #boost::before {
    content: ""; position: absolute; inset: 10px;
    border-radius: 50%;
    border: 1px dashed rgba(255,213,74,.28);
  }
  #boost .txt { position: relative; z-index: 1; }
  #boost.active {
    transform: scale(.94);
    background: radial-gradient(circle at 50% 45%, rgba(255,213,74,.55), rgba(60,30,4,.9) 72%);
    box-shadow:
      0 0 34px rgba(255,213,74,.8),
      0 0 80px rgba(255,157,0,.4),
      0 0 0 8px rgba(255,213,74,.12) inset;
    color: #fff;
  }

  @media (max-width: 420px) {
    #wrap { padding: 12px 12px 10px; border-radius: 12px; }
    #overlay { inset: 12px 12px 10px; }
    #hud { font-size: 10.5px; gap: 8px; }
    #hud .stats { gap: 12px; }
    #joystick { width: 122px; height: 122px; }
    #joystick .knob { width: 54px; height: 54px; margin: -27px 0 0 -27px; }
    #boost { width: 92px; height: 92px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    #overlay.show { animation: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="brand"><span>金币蛇</span></div>
    <div class="stats">
      <span>金币 <b id="score">0</b></span>
      <span>最高 <b id="best">0</b></span>
    </div>
  </div>

  <div id="game-frame">
    <canvas id="game"></canvas>
  </div>

  <div id="overlay" class="show">
    <h2 id="ov-title"><span class="accent">金币蛇</span></h2>
    <p id="ov-desc">
      <span class="pc-hint">方向键 / WASD 控制转向 · 按住空格加速</span>
      <span class="touch-hint"><b>左手</b>拖动左下摇杆控制方向 · <b>右手</b>按住右下按钮加速</span>
    </p>
    <button id="ov-btn">开始挖金</button>
  </div>
</div>

<!-- 触屏双手控件：左摇杆 + 右加速 -->
<div id="controls" aria-hidden="true">
  <div id="joystick">
    <div class="ring"></div>
    <div class="arrow up"></div>
    <div class="arrow down"></div>
    <div class="arrow left"></div>
    <div class="arrow right"></div>
    <div class="knob" id="joystick-knob"></div>
    <div class="caption">方向</div>
  </div>
  <div id="boost"><span class="txt">加速</span></div>
</div>

<script>
(function () {
  'use strict';

  // ===================== 配置 =====================
  const COLS = 20;
  const ROWS = 20;
  const TICK_NORMAL = 220;   // 常速：220ms 一步
  const TICK_BOOST  = 110;   // 加速：110ms 一步

  const COLORS = {
    grid:      'rgba(0, 240, 255, 0.06)',
    gridMajor: 'rgba(0, 240, 255, 0.11)',
    head:      '#7bfff6',
    gold:      '#ffd54a',
    goldDeep:  '#ff9d00',
    scan:      'rgba(0, 240, 255, 0.05)',
  };

  // ===================== 逻辑层 =====================
  const Game = {
    snake: [],
    dir: { x: 1, y: 0 },
    dirQueue: [],
    coin: null,
    score: 0,
    state: 'idle',
    timer: null,
    tickMs: TICK_NORMAL,
    boosting: false,

    reset() {
      const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
      this.snake = [
        { x: cx,     y: cy },
        { x: cx - 1, y: cy },
        { x: cx - 2, y: cy },
      ];
      this.dir = { x: 1, y: 0 };
      this.dirQueue = [];
      this.score = 0;
      this.state = 'running';
      this.boosting = false;
      this.coin = this.spawnCoin();
    },

    isOpposite(a, b) { return a.x + b.x === 0 && a.y + b.y === 0; },

    enqueueDir(next) {
      if (!next) return;
      const last = this.dirQueue.length ? this.dirQueue[this.dirQueue.length - 1] : this.dir;
      if (this.isOpposite(next, last)) return;
      if (next.x === last.x && next.y === last.y) return;
      if (this.dirQueue.length < 2) this.dirQueue.push(next);
    },

    consumeDir() {
      if (this.dirQueue.length) this.dir = this.dirQueue.shift();
    },

    hitWall(p) { return p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= ROWS; },

    hitSelf(newHead, willEat) {
      const body = willEat ? this.snake : this.snake.slice(0, -1);
      return body.some(s => s.x === newHead.x && s.y === newHead.y);
    },

    spawnCoin() {
      const occupied = new Set(this.snake.map(s => s.x + ',' + s.y));
      const free = [];
      for (let y = 0; y < ROWS; y++)
        for (let x = 0; x < COLS; x++)
          if (!occupied.has(x + ',' + y)) free.push({ x, y });
      if (free.length === 0) return null;
      return free[(Math.random() * free.length) | 0];
    },

    step() {
      this.consumeDir();
      const head = this.snake[0];
      const newHead = { x: head.x + this.dir.x, y: head.y + this.dir.y };
      const willEat = this.coin && newHead.x === this.coin.x && newHead.y === this.coin.y;

      if (this.hitWall(newHead) || this.hitSelf(newHead, willEat)) {
        this.gameOver();
        return;
      }

      if (!willEat) this.snake.pop();
      this.snake.unshift(newHead);

      if (willEat) {
        this.score += 10;
        this.coin = this.spawnCoin();
        if (!this.coin) { this.win(); return; }
        burst(newHead);
      }
    },

    start() {
      this.reset();
      hideOverlay();
      this.applySpeed();
      render(performance.now());
    },

    stop() {
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
    },

    // 根据是否加速切换定时器
    applySpeed() {
      this.stop();
      if (this.state !== 'running') return;
      this.tickMs = this.boosting ? TICK_BOOST : TICK_NORMAL;
      this.timer = setInterval(() => this.step(), this.tickMs);
    },

    setBoost(on) {
      if (this.state !== 'running') return;
      if (this.boosting === on) return;
      this.boosting = on;
      this.applySpeed();
    },

    gameOver() {
      this.state = 'over';
      this.boosting = false;
      this.stop();
      showOverlay('信号<span class="accent">中断</span>', '本局金币 ' + this.score + ' 枚', '重新接入');
    },

    win() {
      this.state = 'win';
      this.boosting = false;
      this.stop();
      showOverlay('系统<span class="accent">清空</span>', '棋盘已填满 · 金币 ' + this.score + ' 枚', '再次运行');
    },
  };

  // ===================== 渲染层 =====================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let cellSize = 24;
  let particles = [];

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    const reserveBottom = isTouch ? 190 : 60;
    const maxW = Math.min(vw - 56, vh - 150 - reserveBottom + 60, 640);
    cellSize = Math.max(10, Math.floor(maxW / COLS));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = cellSize * COLS, cssH = cellSize * ROWS;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render(performance.now());
  }

  function drawGrid(w, h) {
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.strokeStyle = i % 5 === 0 ? COLORS.gridMajor : COLORS.grid;
      ctx.beginPath();
      ctx.moveTo(Math.round(i * cellSize) + .5, 0);
      ctx.lineTo(Math.round(i * cellSize) + .5, h);
      ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.strokeStyle = j % 5 === 0 ? COLORS.gridMajor : COLORS.grid;
      ctx.beginPath();
      ctx.moveTo(0, Math.round(j * cellSize) + .5);
      ctx.lineTo(w, Math.round(j * cellSize) + .5);
      ctx.stroke();
    }
  }

  function drawCoin(t) {
    if (!Game.coin) return;
    const c = Game.coin;
    const cx = c.x * cellSize + cellSize / 2;
    const cy = c.y * cellSize + cellSize / 2;
    const r = cellSize * 0.34;
    const pulse = 0.5 + 0.5 * Math.sin(t / 260);
    const spin = Math.cos(t / 320);
    const rx = r * (0.35 + 0.65 * Math.abs(spin));

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3.2);
    glow.addColorStop(0, 'rgba(255, 213, 74, ' + (0.45 + pulse * 0.3) + ')');
    glow.addColorStop(1, 'rgba(255, 213, 74, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 3.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx / r, 1);
    const grad = ctx.createLinearGradient(-r, -r, r, r);
    grad.addColorStop(0, '#fff3b0');
    grad.addColorStop(0.45, COLORS.gold);
    grad.addColorStop(1, COLORS.goldDeep);
    ctx.fillStyle = grad;
    ctx.shadowColor = COLORS.goldDeep;
    ctx.shadowBlur = 14 + pulse * 8;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx / r, 1);
    ctx.strokeStyle = 'rgba(120, 70, 0, 0.55)';
    ctx.lineWidth = Math.max(1, cellSize * 0.05);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2);
    ctx.stroke();
    if (Math.abs(spin) > 0.35) {
      ctx.fillStyle = 'rgba(120, 70, 0, ' + (0.5 * Math.abs(spin)) + ')';
      ctx.font = 'bold ' + (r * 1.0) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', 0, r * 0.06);
    }
    ctx.restore();
    ctx.shadowBlur = 0;

    if (Math.abs(spin) > 0.15) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.55 * Math.abs(spin)) + ')';
      ctx.beginPath();
      ctx.ellipse(cx - rx * 0.35, cy - r * 0.35, Math.max(1, rx * 0.18), Math.max(1, r * 0.12), -0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    const flash = (Math.sin(t / 180) + 1) / 2;
    if (flash > 0.85) {
      ctx.strokeStyle = 'rgba(255, 240, 180, ' + ((flash - 0.85) * 4) + ')';
      ctx.lineWidth = 1;
      const arm = r * 2.2;
      ctx.beginPath();
      ctx.moveTo(cx - arm, cy); ctx.lineTo(cx - r, cy);
      ctx.moveTo(cx + r, cy);   ctx.lineTo(cx + arm, cy);
      ctx.moveTo(cx, cy - arm);  ctx.lineTo(cx, cy - r);
      ctx.moveTo(cx, cy + r);    ctx.lineTo(cx, cy + arm);
      ctx.stroke();
    }
  }

  function drawSnake() {
    const n = Game.snake.length;
    if (!n) return;
    const boostGlow = Game.boosting ? 1.6 : 1;
    for (let i = n - 1; i >= 0; i--) {
      const s = Game.snake[i];
      const ratio = i / Math.max(1, n - 1);
      const r = Math.round(0   + (42  - 0)   * ratio);
      const g = Math.round(240 + (92  - 240) * ratio);
      const b = 255;
      const color = 'rgb(' + r + ',' + g + ',' + b + ')';
      const pad = i === 0 ? 1 : 2;
      const x = s.x * cellSize + pad;
      const y = s.y * cellSize + pad;
      const size = cellSize - pad * 2;

      if (i === 0) {
        ctx.shadowColor = Game.boosting ? COLORS.gold : '#00f0ff';
        ctx.shadowBlur = 18 * boostGlow;
        ctx.fillStyle = Game.boosting ? '#ffe98a' : COLORS.head;
        roundRect(x, y, size, size, Math.min(5, size * 0.22));
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        const d = Game.dir;
        const hx = x + size / 2 + d.x * size * 0.2;
        const hy = y + size / 2 + d.y * size * 0.2;
        ctx.beginPath();
        ctx.arc(hx, hy, Math.max(1.5, size * 0.12), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.shadowColor = Game.boosting ? 'rgba(255,213,74,0.4)' : 'rgba(0, 240, 255, 0.35)';
        ctx.shadowBlur = 6 * boostGlow;
        const grd = ctx.createLinearGradient(x, y, x + size, y + size);
        grd.addColorStop(0, color);
        grd.addColorStop(1, Game.boosting
          ? 'rgba(255, 157, 0, ' + (0.8 - ratio * 0.2) + ')'
          : 'rgba(42, 92, 255, ' + (0.85 - ratio * 0.25) + ')');
        ctx.fillStyle = grd;
        roundRect(x, y, size, size, Math.min(4, size * 0.18));
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0, 240, 255, ' + (0.18 - ratio * 0.12) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const a = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = 'rgba(255, 213, 74, ' + a + ')';
      ctx.shadowColor = COLORS.gold;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function burst(gridPos) {
    const cx = gridPos.x * cellSize + cellSize / 2;
    const cy = gridPos.y * cellSize + cellSize / 2;
    for (let i = 0; i < 16; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 0.04 + Math.random() * 0.14;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd * cellSize,
        vy: Math.sin(ang) * spd * cellSize,
        r: 1 + Math.random() * 2.2,
        life: 420 + Math.random() * 260,
        maxLife: 680,
      });
    }
  }

  let lastT = 0;
  function render(t) {
    t = t || 0;
    const dt = lastT ? Math.min(t - lastT, 48) : 16;
    lastT = t;

    const w = cellSize * COLS;
    const h = cellSize * ROWS;
    ctx.clearRect(0, 0, w, h);

    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, Game.boosting ? '#0a0d1e' : '#04091a');
    bg.addColorStop(1, '#020510');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    drawGrid(w, h);
    drawCoin(t);
    drawSnake();
    drawParticles(dt);

    const scanY = ((t / 22) % (h + 60)) - 30;
    const scan = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
    scan.addColorStop(0, 'rgba(0,240,255,0)');
    scan.addColorStop(.5, Game.boosting ? 'rgba(255,213,74,0.08)' : COLORS.scan);
    scan.addColorStop(1, 'rgba(0,240,255,0)');
    ctx.fillStyle = scan;
    ctx.fillRect(0, scanY - 20, w, 40);

    if (Game.boosting) {
      const boostVig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .3, w / 2, h / 2, Math.max(w, h) * .75);
      boostVig.addColorStop(0, 'rgba(255,213,74,0)');
      boostVig.addColorStop(1, 'rgba(255,157,0,0.16)');
      ctx.fillStyle = boostVig;
      ctx.fillRect(0, 0, w, h);
    }

    const vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .25, w / 2, h / 2, Math.max(w, h) * .75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    document.getElementById('score').textContent = Game.score;
  }

  (function loop(t) {
    render(t);
    requestAnimationFrame(loop);
  })(0);

  // ===================== UI =====================
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovDesc  = document.getElementById('ov-desc');
  const ovBtn   = document.getElementById('ov-btn');

  function showOverlay(title, desc, btn) {
    ovTitle.innerHTML = title;
    ovDesc.innerHTML = desc;
    ovBtn.textContent = btn;
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  ovBtn.addEventListener('click', () => Game.start());

  // ===================== 键盘 =====================
  const KEY_MAP = {
    ArrowUp:    { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown:  { x: 0, y: 1 },  KeyS: { x: 0, y: 1 },
    ArrowLeft:  { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 },  KeyD: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (Game.state === 'over' || Game.state === 'win' || Game.state === 'idle') {
        Game.start();
      } else {
        Game.setBoost(true);
      }
      return;
    }
    const d = KEY_MAP[e.code];
    if (d) { e.preventDefault(); Game.enqueueDir(d); }
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'Space') Game.setBoost(false);
  });

  // ===================== 触屏滑动（辅助输入） =====================
  let touchStart = null;
  const SWIPE_THRESHOLD = 22;

  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.hypot(dx, dy) < SWIPE_THRESHOLD) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      Game.enqueueDir({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      Game.enqueueDir({ x: 0, y: dy > 0 ? 1 : -1 });
    }
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', () => { touchStart = null; }, { passive: true });

  // ===================== 左手摇杆 =====================
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('joystick-knob');
  const JOY_MAX = 44;
  const JOY_DEAD = 0.35;
  let joyActive = false;
  let joyId = null;
  let joyCenter = { x: 0, y: 0 };
  let joyLastDir = null;

  function joySetKnob(dx, dy) {
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  function joyReset() {
    knob.style.transform = 'translate(0,0)';
    joyActive = false;
    joyId = null;
    joyLastDir = null;
  }

  joystick.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joyActive) return;
    const t = e.changedTouches[0];
    const rect = joystick.getBoundingClientRect();
    joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    joyActive = true;
    joyId = t.identifier;
    // 首次按下即可响应，无需先移动
    handleJoyMove(t);
  }, { passive: false });

  function handleJoyMove(t) {
    let dx = t.clientX - joyCenter.x;
    let dy = t.clientY - joyCenter.y;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_MAX) {
      dx = dx / dist * JOY_MAX;
      dy = dy / dist * JOY_MAX;
    }
    joySetKnob(dx, dy);

    const nx = dx / JOY_MAX, ny = dy / JOY_MAX;
    if (Math.hypot(nx, ny) < JOY_DEAD) return;

    let dir;
    if (Math.abs(nx) > Math.abs(ny)) {
      dir = { x: nx > 0 ? 1 : -1, y: 0 };
    } else {
      dir = { x: 0, y: ny > 0 ? 1 : -1 };
    }
    if (!joyLastDir || joyLastDir.x !== dir.x || joyLastDir.y !== dir.y) {
      joyLastDir = dir;
      Game.enqueueDir(dir);
    }
  }

  joystick.addEventListener('touchmove', e => {
    if (!joyActive) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === joyId) handleJoyMove(t);
    }
  }, { passive: false });

  function joyEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) { joyReset(); break; }
    }
  }
  joystick.addEventListener('touchend', joyEnd, { passive: true });
  joystick.addEventListener('touchcancel', joyEnd, { passive: true });

  // ===================== 右手加速按钮 =====================
  const boostBtn = document.getElementById('boost');
  let boostTouchId = null;

  boostBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (boostTouchId !== null) return;
    boostTouchId = e.changedTouches[0].identifier;
    boostBtn.classList.add('active');
    Game.setBoost(true);
  }, { passive: false });

  function boostEnd(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === boostTouchId) {
        boostTouchId = null;
        boostBtn.classList.remove('active');
        Game.setBoost(false);
        break;
      }
    }
  }
  boostBtn.addEventListener('touchend', boostEnd, { passive: true });
  boostBtn.addEventListener('touchcancel', boostEnd, { passive: true });

  // ===================== 启动 =====================
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  resize();

  const bestEl = document.getElementById('best');
  let best = Number(localStorage.getItem('neon-gold-best') || 0);
  bestEl.textContent = best;

  function saveBest() {
    if (Game.score > best) {
      best = Game.score;
      localStorage.setItem('neon-gold-best', best);
      bestEl.textContent = best;
    }
  }
  const origOver = Game.gameOver.bind(Game);
  Game.gameOver = function () { saveBest(); origOver(); };
  const origWin = Game.win.bind(Game);
  Game.win = function () { saveBest(); origWin(); };

  window.Game = Game;
})();
</script>
