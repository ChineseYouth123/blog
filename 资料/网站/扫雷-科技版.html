<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✈️ 飞机大战 · 移动端兼容版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden;
      /* 禁用浏览器的触摸滚动和缩放 */
      touch-action: none; 
    }

    #game-container {
      position: relative;
      /* 通过宽高比自适应屏幕 */
      width: 100vw;
      height: 72.22vw; /* 650 / 900 */
      max-height: 100vh;
      max-width: 138.46vh; /* 900 / 650 */
      
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 150, 255, 0.2), 0 0 0 1px rgba(255,255,255,0.1);
      cursor: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 25px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(0, 200, 255, 0.5);
      letter-spacing: 1px;
      z-index: 10;
    }

    .weapon-lv {
      position: absolute;
      bottom: 25px;
      left: 30px;
      color: #ffd700;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 15px #ffd700;
      pointer-events: none;
      z-index: 10;
    }

    /* 移动端字号微调 */
    @media (max-width: 600px) {
      .hud { font-size: 16px; top: 15px; left: 15px; right: 15px; }
      .weapon-lv { font-size: 16px; bottom: 15px; left: 15px; }
    }
  </style>
</head>
<body>
<div id="game-container">
  <div class="hud">
    <div>💥 得分: <span id="score" style="color: #00ffff;">0</span></div>
    <div>❤️ 生命: <span id="lives" style="color: #ff3366;">3</span></div>
  </div>
  <div class="weapon-lv" id="weaponLv">🔫 火力: Lv.1</div>
  <canvas id="gameCanvas" width="900" height="650"></canvas>
</div>

<script>
// ============================================================
//  原生 Canvas 飞机大战 · 移动端兼容版
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const weaponLvEl = document.getElementById('weaponLv');

const CW = 900;
const CH = 650;

// 游戏状态
let score = 0;
let lives = 3;
let isGameOver = false;
let isWin = false;
let gameFrame = 0;
let weaponLevel = 1; 
let hasShield = false; 
let shieldTimer = 0; 
const SHIELD_DURATION = 600; 

// 阶段与警告
let currentStage = 1;
let warningTimer = 0;
let warningText = '';

// 玩家坐标
let mouseX = CW / 2;
let mouseY = CH - 100;

// ---------- 核心：坐标映射与触摸/鼠标事件 ----------
function updatePlayerPos(clientX, clientY, isTouch) {
  const rect = canvas.getBoundingClientRect();
  // 计算屏幕显示尺寸与内部逻辑尺寸的缩放比例
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  
  // 转换为内部逻辑坐标
  let targetX = (clientX - rect.left) * scaleX;
  let targetY = (clientY - rect.top) * scaleY;
  
  // 如果是手机触摸，让飞机悬浮在手指上方 40 像素，防止手指遮挡
  if (isTouch) {
    targetY -= 40;
  }
  
  // 边界限制
  mouseX = Math.max(30, Math.min(CW - 30, targetX));
  mouseY = Math.max(50, Math.min(CH - 40, targetY));
}

// 鼠标事件（PC端）
canvas.addEventListener('mousemove', (e) => {
  updatePlayerPos(e.clientX, e.clientY, false);
});

// 触摸事件（移动端）
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); // 阻止页面滚动
  if (e.touches.length > 0) {
    updatePlayerPos(e.touches[0].clientX, e.touches[0].clientY, true);
  }
  // 手机端触摸屏幕即可重开
  if (isGameOver || isWin) resetGame();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault(); // 阻止页面滚动
  if (e.touches.length > 0) {
    updatePlayerPos(e.touches[0].clientX, e.touches[0].clientY, true);
  }
}, { passive: false });

// 键盘事件（PC端重开）
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R' || ( (isGameOver || isWin) && e.key === ' ')) {
    resetGame();
  }
});

// ---------- 实体 ----------
const player = { x: CW / 2, y: CH - 100, width: 40, height: 50, invincible: 0 };
let bullets = [], enemyBullets = [], enemies = [], explosions = [], powerups = [], floatingTexts = [];
let clouds = [], groundFogs = [];

// 地面元素
let groundElements = []; 
let groundOffset = 0;
const GROUND_SPEED = 2.2; 

// 计时器
let fireTimer = 0;
const FIRE_COOLDOWN = 10;
let enemySpawnTimer = 0;
const BASE_ENEMY_SPAWN = 55;

// ---------- 阶段判断 ----------
function getStage(s) {
  if (s < 600) return 1;
  if (s < 1000) return 2;
  if (s < 1500) return 3;
  if (s < 2000) return 4;
  if (s < 2500) return 5;
  if (s < 3000) return 6;
  return 7; // 胜利
}

// ---------- 初始化环境 ----------
function initEnvironment() {
  clouds = [];
  for (let i = 0; i < 10; i++) clouds.push({ x: Math.random() * CW, y: Math.random() * CH, scale: 0.4 + Math.random() * 0.3, speed: 0.5 + Math.random() * 0.5, alpha: 0.2 + Math.random() * 0.2, layer: 'far' });
  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * CW, y: Math.random() * CH, scale: 1.0 + Math.random() * 0.5, speed: 1.5 + Math.random() * 1.0, alpha: 0.5 + Math.random() * 0.3, layer: 'mid' });
  for (let i = 0; i < 3; i++) clouds.push({ x: Math.random() * CW, y: Math.random() * CH, scale: 2.5 + Math.random() * 1.5, speed: 3.5 + Math.random() * 1.5, alpha: 0.7 + Math.random() * 0.2, layer: 'near' });

  groundFogs = [];
  for (let i = 0; i < 8; i++) {
    groundFogs.push({ x: Math.random() * CW, y: Math.random() * CH, radius: 150 + Math.random() * 250, speed: 0.2 + Math.random() * 0.5, alpha: 0.15 + Math.random() * 0.2 });
  }

  groundElements = [];
  for (let i = 0; i < 8; i++) groundElements.push({ type: 'mountain', x: Math.random() * CW, y: Math.random() * CH * 2, size: 150 + Math.random() * 200 });
  for (let i = 0; i < 30; i++) groundElements.push({ type: 'farm', x: Math.random() * CW, y: Math.random() * CH * 2, w: 60 + Math.random() * 80, h: 40 + Math.random() * 60, isHorizontal: Math.random() > 0.5, colorIndex: Math.floor(Math.random() * 3) });
  for (let i = 0; i < 18; i++) groundElements.push({ type: 'forest', x: Math.random() * CW, y: Math.random() * CH * 2, size: 60 + Math.random() * 100 });
  for (let i = 0; i < 6; i++) {
    const cityX = Math.random() * CW;
    const cityY = Math.random() * CH * 2;
    for (let j = 0; j < 20; j++) groundElements.push({ type: 'building', x: cityX + (Math.random() - 0.5) * 140, y: cityY + (Math.random() - 0.5) * 140, w: 8 + Math.random() * 12, h: 8 + Math.random() * 12 });
  }
}

// ---------- 重置游戏 ----------
function resetGame() {
  score = 0; lives = 3; isGameOver = false; isWin = false; gameFrame = 0; weaponLevel = 1;
  player.x = CW / 2; player.y = CH - 100; player.invincible = 0;
  hasShield = false; shieldTimer = 0;
  currentStage = 1; warningTimer = 0; warningText = '';
  mouseX = CW / 2; mouseY = CH - 100;
  bullets = []; enemyBullets = []; enemies = []; explosions = []; powerups = []; floatingTexts = [];
  fireTimer = 0; enemySpawnTimer = 0; groundOffset = 0;
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  weaponLvEl.textContent = `🔫 火力: Lv.${weaponLevel}`;
  if (weaponLevel >= 3) weaponLvEl.style.color = '#ff0055';
  else weaponLvEl.style.color = '#ffd700';
}

// ---------- 飘字特效 ----------
function addFloatingText(x, y, text, color = '#ffdd00') {
  floatingTexts.push({ x, y, text, color, life: 60, maxLife: 60 });
}

// ---------- 火花特效 ----------
function createSpark(x, y, color = '#ffffff') {
  for (let i = 0; i < 5; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    explosions.push({
      x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 0.5, decay: 0.05, color: color, size: Math.random() * 3 + 1
    });
  }
}

// ---------- 生成敌人 ----------
function spawnEnemy() {
  const x = Math.random() * (CW - 160) + 80;
  const stage = currentStage;
  
  let speed = 1.2 + Math.random() * 1.0;
  if (stage === 2) speed = 1.5 + Math.random() * 1.0;
  if (stage === 3) speed = 1.8 + Math.random() * 1.0;
  if (stage === 4) speed = 2.0 + Math.random() * 1.2;
  if (stage === 5) speed = 2.2 + Math.random() * 1.2;
  if (stage === 6) speed = 2.5 + Math.random() * 1.5;

  enemies.push({
    x: x, y: -60, width: 36, height: 36,
    speed: speed,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.02 + Math.random() * 0.04,
    fireTimer: 60 + Math.random() * 60,
    stage: stage, 
    hitTimer: 0,  
    maxHp: 1,
    hp: 1
  });
}

// ---------- 生成掉落装备 ----------
function spawnPowerup(x, y) {
  const isShield = Math.random() < 0.35; 
  powerups.push({
    x: x, y: y, speed: 2, time: Math.random() * 10,
    type: isShield ? 'shield' : 'power'
  });
}

// ---------- 爆炸特效 ----------
function createExplosion(x, y, isPlayer = false) {
  const count = isPlayer ? 40 : 20;
  const colors = isPlayer ? ['#ffd166', '#ff9f1c', '#ff5e5e', '#ffffff'] : ['#ff5e5e', '#ff9f1c', '#ffffff'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    explosions.push({
      x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1.0, decay: 0.015 + Math.random() * 0.02,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 6 + 2
    });
  }
}

// ---------- 更新逻辑 ----------
function update() {
  if (isGameOver || isWin) return;
  gameFrame++;
  groundOffset = (groundOffset + GROUND_SPEED) % (CH * 2);

  const newStage = getStage(score);
  if (newStage > currentStage && newStage <= 6) {
    currentStage = newStage;
    warningTimer = 150; 
    warningText = `警告：敌机火力升级！`;
  } else if (newStage === 7 && currentStage < 7) {
    currentStage = 7;
    isWin = true;
    enemies = []; enemyBullets = [];
    return;
  }

  if (warningTimer > 0) warningTimer--;

  if (hasShield) {
    shieldTimer--;
    if (shieldTimer <= 0) hasShield = false;
  }

  // 平滑跟随（手机端手指控制时略微紧一点）
  player.x += (mouseX - player.x) * 0.5;
  player.y += (mouseY - player.y) * 0.5;
  player.x = Math.max(30, Math.min(CW - 30, player.x));
  player.y = Math.max(50, Math.min(CH - 40, player.y));

  if (fireTimer > 0) fireTimer--;
  if (fireTimer <= 0) {
    const speed = -10;
    if (weaponLevel === 1) {
      bullets.push({ x: player.x - 15, y: player.y - 20, vx: 0, vy: speed });
      bullets.push({ x: player.x + 15, y: player.y - 20, vx: 0, vy: speed });
    } else if (weaponLevel === 2) {
      bullets.push({ x: player.x, y: player.y - 25, vx: 0, vy: speed - 1 });
      bullets.push({ x: player.x - 18, y: player.y - 15, vx: -1.5, vy: speed });
      bullets.push({ x: player.x + 18, y: player.y - 15, vx: 1.5, vy: speed });
    } else if (weaponLevel >= 3) {
      bullets.push({ x: player.x, y: player.y - 25, vx: 0, vy: speed - 2 });
      bullets.push({ x: player.x - 15, y: player.y - 15, vx: -1.5, vy: speed });
      bullets.push({ x: player.x + 15, y: player.y - 15, vx: 1.5, vy: speed });
      bullets.push({ x: player.x - 25, y: player.y - 5, vx: -3, vy: speed });
      bullets.push({ x: player.x + 25, y: player.y - 5, vx: 3, vy: speed });
    }
    fireTimer = FIRE_COOLDOWN;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    bullets[i].y += bullets[i].vy;
    if (bullets[i].y < -30 || bullets[i].x < -30 || bullets[i].x > CW + 30) bullets.splice(i, 1);
  }

  if (enemySpawnTimer > 0) enemySpawnTimer--;
  if (enemySpawnTimer <= 0) {
    spawnEnemy();
    enemySpawnTimer = BASE_ENEMY_SPAWN - (currentStage - 1) * 4;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;
    e.wobble += e.wobbleSpeed;
    const ex = e.x + Math.sin(e.wobble) * 3;

    if (e.hitTimer > 0) e.hitTimer--;

    if (e.y > 0 && e.y < CH - 100) {
      e.fireTimer--;
      if (e.fireTimer <= 0) {
        
        if (e.stage === 1) {
          enemyBullets.push({ x: ex, y: e.y + 15, vx: 0, vy: 4.5, radius: 4, color: '#ff4d4d', type: 'normal' });
        } 
        else if (e.stage === 2) {
          enemyBullets.push({ x: ex - 10, y: e.y + 15, vx: 0, vy: 7.0, radius: 5, color: '#f39c12', type: 'fast' });
          enemyBullets.push({ x: ex + 10, y: e.y + 15, vx: 0, vy: 7.0, radius: 5, color: '#f39c12', type: 'fast' });
        } 
        else if (e.stage === 3) {
          enemyBullets.push({ x: ex, y: e.y + 15, vx: 0, vy: 2.2, radius: 10, color: '#9b59b6', type: 'large' });
          enemyBullets.push({ x: ex - 14, y: e.y + 15, vx: -2.5, vy: 6.0, radius: 4, color: '#d500f9', type: 'fast' });
          enemyBullets.push({ x: ex + 14, y: e.y + 15, vx: 2.5, vy: 6.0, radius: 4, color: '#d500f9', type: 'fast' });
        } 
        else if (e.stage === 4) {
          enemyBullets.push({ x: ex, y: e.y + 15, vx: 0, vy: 1.8, radius: 14, color: '#16a085', type: 'huge' });
          enemyBullets.push({ x: ex - 10, y: e.y + 10, vx: -1.5, vy: 5.0, radius: 6, color: '#1abc9c', type: 'normal' });
          enemyBullets.push({ x: ex + 10, y: e.y + 10, vx: 1.5, vy: 5.0, radius: 6, color: '#1abc9c', type: 'normal' });
          enemyBullets.push({ x: ex - 22, y: e.y + 5, vx: -4.0, vy: 6.5, radius: 4, color: '#48c9b0', type: 'fast' });
          enemyBullets.push({ x: ex + 22, y: e.y + 5, vx: 4.0, vy: 6.5, radius: 4, color: '#48c9b0', type: 'fast' });
        } 
        else if (e.stage === 5) {
          enemyBullets.push({ x: ex, y: e.y + 15, vx: 0, vy: 1.5, radius: 16, color: '#f1c40f', type: 'huge' });
          enemyBullets.push({ x: ex - 15, y: e.y + 15, vx: -2, vy: 3.5, radius: 8, color: '#f39c12', type: 'large' });
          enemyBullets.push({ x: ex + 15, y: e.y + 15, vx: 2, vy: 3.5, radius: 8, color: '#f39c12', type: 'large' });
          enemyBullets.push({ x: ex - 28, y: e.y + 10, vx: -4.5, vy: 7.0, radius: 4, color: '#ffd700', type: 'fast' });
          enemyBullets.push({ x: ex + 28, y: e.y + 10, vx: 4.5, vy: 7.0, radius: 4, color: '#ffd700', type: 'fast' });
        } 
        else {
          enemyBullets.push({ x: ex, y: e.y + 15, vx: 0, vy: 1.2, radius: 18, color: '#ff0033', type: 'huge' });
          enemyBullets.push({ x: ex - 18, y: e.y + 15, vx: -2.5, vy: 3.0, radius: 10, color: '#e74c3c', type: 'large' });
          enemyBullets.push({ x: ex + 18, y: e.y + 15, vx: 2.5, vy: 3.0, radius: 10, color: '#e74c3c', type: 'large' });
          enemyBullets.push({ x: ex - 30, y: e.y + 10, vx: -5, vy: 8.0, radius: 4, color: '#c0392b', type: 'fast' });
          enemyBullets.push({ x: ex + 30, y: e.y + 10, vx: 5, vy: 8.0, radius: 4, color: '#c0392b', type: 'fast' });
        }
        
        e.fireTimer = 90 + Math.random() * 60;
      }
    }

    if (e.y > CH + 60) {
      enemies.splice(i, 1); lives--; updateHUD();
      if (lives <= 0) { gameOver(); return; }
      continue;
    }

    if (player.invincible <= 0 && Math.abs(ex - player.x) < 25 && Math.abs(e.y - player.y) < 25) {
      enemies.splice(i, 1); playerHit(); continue;
    }

    let enemyHit = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (Math.abs(bullets[j].x - ex) < 20 && Math.abs(bullets[j].y - e.y) < 20) {
        bullets.splice(j, 1); 
        enemyHit = true; 
        e.hp--;
        break;
      }
    }

    if (enemyHit) {
      if (e.hp <= 0) {
        const points = 10 + (e.stage * 2); 
        createExplosion(ex, e.y); 
        enemies.splice(i, 1);
        score += points; 
        updateHUD();
        addFloatingText(ex, e.y, `+${points}`, '#00ffff');
        
        if (Math.random() < 0.25) spawnPowerup(ex, e.y); 
        if (score > 0 && score % 200 === 0 && lives < 5) { lives++; updateHUD(); }
      } else {
        e.hitTimer = 5; 
        createSpark(ex, e.y, '#ffffff');
        addFloatingText(ex, e.y - 10, `-1`, '#ffffff');
      }
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.speed;
    p.time += 0.1;
    if (p.y > CH + 30) { powerups.splice(i, 1); continue; }
    if (Math.abs(p.x - player.x) < 30 && Math.abs(p.y - player.y) < 30) {
      if (p.type === 'power') {
        if (weaponLevel < 3) { weaponLevel++; updateHUD(); }
        else { score += 10; updateHUD(); addFloatingText(p.x, p.y, `+10`, '#ffd700'); }
      } else if (p.type === 'shield') {
        hasShield = true; shieldTimer = SHIELD_DURATION; score += 5; updateHUD();
        addFloatingText(p.x, p.y, `护盾激活`, '#00ffff');
      }
      powerups.splice(i, 1);
      createExplosion(player.x, player.y - 20, true);
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.x += eb.vx; eb.y += eb.vy;
    if (eb.y > CH + 20 || eb.x < -20 || eb.x > CW + 20) { enemyBullets.splice(i, 1); continue; }
    
    const hitRadius = eb.radius * 0.8; 
    // 使用稍微宽容一点的判定，对移动端搓玻璃稍微友好一点
    if (player.invincible <= 0 && Math.abs(eb.x - player.x) < (15 + hitRadius) && Math.abs(eb.y - player.y) < (20 + hitRadius)) {
      enemyBullets.splice(i, 1); playerHit(); continue;
    }
  }

  if (player.invincible > 0) player.invincible--;

  for (let i = explosions.length - 1; i >= 0; i--) {
    const exp = explosions[i];
    exp.x += exp.vx; exp.y += exp.vy; exp.vx *= 0.94; exp.vy *= 0.94;
    exp.life -= exp.decay;
    if (exp.life <= 0) explosions.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.5;
    ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  clouds.forEach(c => {
    c.y += c.speed;
    if (c.y > CH + 200) { c.y = -200; c.x = Math.random() * CW; }
  });

  groundFogs.forEach(f => {
    f.y += f.speed;
    if (f.y - f.radius > CH) { f.y = -f.radius; f.x = Math.random() * CW; }
  });
}

function playerHit() {
  if (player.invincible > 0) return;
  
  if (hasShield) {
    hasShield = false;
    shieldTimer = 0;
    player.invincible = 50; 
    createExplosion(player.x, player.y, true);
    addFloatingText(player.x, player.y - 30, '护盾破碎', '#00ffff');
    return;
  }

  lives--; 
  updateHUD(); 
  createExplosion(player.x, player.y, true);
  addFloatingText(player.x, player.y - 30, '受伤！', '#ff3366');
  
  if (lives <= 0) {
    gameOver(); 
  } else { 
    player.invincible = 100; 
    weaponLevel = Math.max(1, weaponLevel - 1); 
    updateHUD(); 
  }
}

function gameOver() {
  isGameOver = true; createExplosion(player.x, player.y, true);
}

// ---------- 绘制逻辑略长，保持原有视觉表现 ----------
function drawAdvancedGround() {
  const baseGradient = ctx.createLinearGradient(0, 0, 0, CH);
  baseGradient.addColorStop(0, '#24331c');
  baseGradient.addColorStop(1, '#182413');
  ctx.fillStyle = baseGradient;
  ctx.fillRect(0, 0, CW, CH);

  const drawPass = (offsetY) => {
    groundElements.forEach(el => {
      let y = el.y + offsetY;
      if (y < -300 || y > CH + 300) return;

      if (el.type === 'mountain') {
        ctx.fillStyle = 'rgba(10, 20, 5, 0.4)';
        ctx.beginPath(); ctx.ellipse(el.x, y, el.size, el.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      } 
      else if (el.type === 'forest') {
        ctx.fillStyle = 'rgba(15, 30, 10, 0.7)';
        ctx.beginPath(); ctx.arc(el.x + 5, y + 5, el.size * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(30, 55, 20, 0.9)';
        ctx.beginPath(); ctx.arc(el.x, y, el.size * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(60, 90, 40, 0.4)';
        ctx.beginPath(); ctx.arc(el.x - el.size*0.1, y - el.size*0.1, el.size * 0.3, 0, Math.PI * 2); ctx.fill();
      } 
      else if (el.type === 'farm') {
        const farmColors = ['#3e5e2a', '#5e6e1e', '#6e5e1e'];
        ctx.fillStyle = farmColors[el.colorIndex]; 
        ctx.fillRect(el.x - el.w/2, y - el.h/2, el.w, el.h);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)'; ctx.lineWidth = 1;
        ctx.beginPath();
        if (el.isHorizontal) {
          for (let i = 0; i < el.w; i += 6) { ctx.moveTo(el.x - el.w/2 + i, y - el.h/2); ctx.lineTo(el.x - el.w/2 + i, y + el.h/2); }
        } else {
          for (let i = 0; i < el.h; i += 6) { ctx.moveTo(el.x - el.w/2, y - el.h/2 + i); ctx.lineTo(el.x + el.w/2, y - el.h/2 + i); }
        }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(20, 30, 10, 0.6)'; ctx.lineWidth = 2;
        ctx.strokeRect(el.x - el.w/2, y - el.h/2, el.w, el.h);
      } 
      else if (el.type === 'building') {
        ctx.fillStyle = 'rgba(140, 130, 120, 0.8)';
        ctx.fillRect(el.x - el.w/2, y - el.h/2, el.w, el.h);
        ctx.fillStyle = 'rgba(30, 30, 30, 0.6)';
        ctx.fillRect(el.x + el.w/2 - 2, y - el.h/2 + 2, 2, el.h);
        ctx.fillRect(el.x - el.w/2 + 2, y + el.h/2 - 2, el.w - 2, 2);
      }
    });
  };
  drawPass(groundOffset);
  drawPass(groundOffset - CH * 2);

  const drawRiver = (offsetY) => {
    ctx.save();
    ctx.translate(0, offsetY);
    ctx.beginPath(); ctx.moveTo(-100, -100); ctx.bezierCurveTo(200, 300, 600, 200, CW + 100, CH + 100);
    ctx.strokeStyle = 'rgba(40, 70, 100, 0.9)'; ctx.lineWidth = 60; ctx.stroke();
    ctx.strokeStyle = 'rgba(120, 180, 220, 0.25)'; ctx.lineWidth = 15; ctx.stroke();
    ctx.restore();
  };
  drawRiver(groundOffset);
  drawRiver(groundOffset - CH * 2);
}

function drawCloud(x, y, scale, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(140, 160, 180, 0.5)';
  ctx.beginPath(); ctx.arc(8, 10, 40, 0, Math.PI * 2); ctx.arc(35, -5, 50, 0, Math.PI * 2); ctx.arc(70, 12, 42, 0, Math.PI * 2); ctx.arc(40, 25, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.arc(30, -15, 50, 0, Math.PI * 2); ctx.arc(65, 2, 42, 0, Math.PI * 2); ctx.arc(32, 15, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.beginPath(); ctx.arc(25, -20, 40, 0, Math.PI * 2); ctx.arc(50, -5, 30, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGroundFog() {
  ctx.save();
  groundFogs.forEach(f => {
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    grad.addColorStop(0, `rgba(220, 235, 245, ${f.alpha})`);
    grad.addColorStop(0.5, `rgba(220, 235, 245, ${f.alpha * 0.5})`);
    grad.addColorStop(1, 'rgba(220, 235, 245, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

function drawPlayer() {
  if (isGameOver || isWin || lives <= 0) return;
  if (player.invincible > 0 && Math.floor(gameFrame / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(player.x, player.y);

  if (gameFrame % 4 < 2) {
    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)';
    ctx.beginPath(); ctx.moveTo(-8, 20); ctx.lineTo(0, 35 + Math.random()*10); ctx.lineTo(8, 20); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-4, 20); ctx.lineTo(0, 30 + Math.random()*5); ctx.lineTo(4, 20); ctx.fill();
  }

  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.beginPath(); ctx.ellipse(5, 5, 18, 25, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#922b21';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-35, 15); ctx.lineTo(-25, 25); ctx.lineTo(-10, 15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(35, 15); ctx.lineTo(25, 25); ctx.lineTo(10, 15); ctx.fill();

  const bodyGradient = ctx.createLinearGradient(-15, 0, 15, 0);
  bodyGradient.addColorStop(0, '#e74c3c');
  bodyGradient.addColorStop(0.5, '#f1948a'); 
  bodyGradient.addColorStop(1, '#e74c3c');
  ctx.fillStyle = bodyGradient;
  ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(12, 10); ctx.lineTo(8, 20); ctx.lineTo(-8, 20); ctx.lineTo(-12, 10); ctx.fill();

  ctx.fillStyle = '#17202a';
  ctx.beginPath(); ctx.ellipse(0, -5, 6, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.beginPath(); ctx.ellipse(-2, -8, 2, 5, 0, 0, Math.PI * 2); ctx.fill();

  if (hasShield) {
    const isBlinking = shieldTimer < 120 && Math.floor(gameFrame / 4) % 2 === 0;
    if (!isBlinking) {
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
      const radius = 35 + Math.sin(gameFrame * 0.1) * 3; 
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function drawEnemy(e) {
  const ex = e.x + Math.sin(e.wobble) * 3;
  ctx.save();
  ctx.translate(ex, e.y);

  const isHit = e.hitTimer > 0;
  let mainColor, wingColor, cockpitColor;

  if (e.stage === 1) { mainColor = '#c0392b'; wingColor = '#7b241c'; cockpitColor = '#f39c12'; }
  else if (e.stage === 2) { mainColor = '#e67e22'; wingColor = '#a04000'; cockpitColor = '#f1c40f'; }
  else if (e.stage === 3) { mainColor = '#8e44ad'; wingColor = '#4a148c'; cockpitColor = '#ff1744'; }
  else if (e.stage === 4) { mainColor = '#16a085'; wingColor = '#0e6655'; cockpitColor = '#f1c40f'; }
  else if (e.stage === 5) { mainColor = '#d4ac0d'; wingColor = '#7d6608'; cockpitColor = '#ffffff'; }
  else { mainColor = '#641e16'; wingColor = '#290000'; cockpitColor = '#ff0033'; }

  if (isHit) { mainColor = '#ffffff'; wingColor = '#ffffff'; cockpitColor = '#ffffff'; }

  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.beginPath(); ctx.ellipse(5, 5, 20, 18, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = wingColor;
  if (e.stage === 3 || e.stage === 6) {
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-30, -15); ctx.lineTo(-15, 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(30, -15); ctx.lineTo(15, 5); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-25, -10); ctx.lineTo(-25, 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(25, -10); ctx.lineTo(25, 5); ctx.fill();
  }

  ctx.fillStyle = mainColor;
  ctx.beginPath(); ctx.ellipse(0, 0, 12, 20, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = cockpitColor;
  if (e.stage >= 3) {
    ctx.shadowColor = cockpitColor; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, 5, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.beginPath(); ctx.ellipse(0, 5, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function drawPowerups() {
  powerups.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    const scale = 1 + Math.sin(p.time) * 0.15;
    ctx.scale(scale, scale);

    if (p.type === 'power') {
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 15;
      ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0088ff';
      ctx.font = 'bold 14px "Microsoft YaHei"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('P', 0, 1);
    } else {
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#b8860b';
      ctx.font = 'bold 14px "Microsoft YaHei"';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('S', 0, 1);
    }
    ctx.restore();
  });
}

function draw() {
  drawAdvancedGround();
  drawGroundFog();

  clouds.forEach(c => {
    if (c.layer === 'far' || c.layer === 'mid') drawCloud(c.x, c.y, c.scale, c.alpha);
  });

  ctx.globalCompositeOperation = 'lighter';
  explosions.forEach(exp => {
    ctx.globalAlpha = exp.life;
    ctx.fillStyle = exp.color;
    ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.size * exp.life, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1.0;

  bullets.forEach(b => {
    if (weaponLevel === 1) {
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10; ctx.fillStyle = '#e0ffff';
    } else if (weaponLevel === 2) {
      ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 12; ctx.fillStyle = '#aaffee';
    } else {
      ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 15; ctx.fillStyle = '#ffccff';
    }
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 3, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(b.x, b.y - 3, 1.5, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  enemyBullets.forEach(eb => {
    ctx.save();
    ctx.translate(eb.x, eb.y);
    
    if (eb.type === 'huge') {
      ctx.rotate(gameFrame * 0.05);
      ctx.shadowColor = eb.color; ctx.shadowBlur = 25;
      
      ctx.fillStyle = eb.color; ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius * 1.3, 0, Math.PI * 2); ctx.fill();
      
      ctx.globalAlpha = 1.0;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius, 0, Math.PI * 2); ctx.fill();
      
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, eb.radius * 0.5, 0, Math.PI * 2); ctx.fill();
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-eb.radius * 1.5, 0); ctx.lineTo(eb.radius * 1.5, 0);
      ctx.moveTo(0, -eb.radius * 1.5); ctx.lineTo(0, eb.radius * 1.5);
      ctx.stroke();
    } else if (eb.type === 'large') {
      ctx.shadowColor = eb.color; ctx.shadowBlur = 15;
      ctx.fillStyle = eb.color;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius, 0, Math.PI * 2); ctx.fill();
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
      
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(-eb.radius*0.3, -eb.radius*0.3, eb.radius * 0.2, 0, Math.PI * 2); ctx.fill();
    } else if (eb.type === 'fast') {
      ctx.shadowColor = eb.color; ctx.shadowBlur = 10;
      ctx.fillStyle = eb.color;
      
      ctx.rotate(Math.atan2(eb.vy, eb.vx) - Math.PI/2);
      
      ctx.beginPath(); 
      ctx.moveTo(0, -eb.radius * 2);
      ctx.lineTo(eb.radius, 0);
      ctx.lineTo(0, eb.radius * 1.5);
      ctx.lineTo(-eb.radius, 0);
      ctx.closePath();
      ctx.fill();
      
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, eb.radius * 0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.shadowColor = eb.color; ctx.shadowBlur = 12;
      ctx.fillStyle = eb.color;
      ctx.beginPath(); ctx.arc(0, 0, eb.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(-eb.radius*0.3, -eb.radius*0.3, eb.radius * 0.4, 0, Math.PI * 2); ctx.fill();
    }
    
    ctx.restore();
  });

  enemies.forEach(e => drawEnemy(e));
  drawPowerups(); 
  drawPlayer();

  floatingTexts.forEach(ft => {
    ctx.globalAlpha = ft.life / ft.maxLife;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 18px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 5;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.shadowBlur = 0;
  });
  ctx.globalAlpha = 1.0;

  clouds.forEach(c => {
    if (c.layer === 'near') drawCloud(c.x, c.y, c.scale, c.alpha);
  });

  const fogGradient = ctx.createLinearGradient(0, 0, 0, CH);
  fogGradient.addColorStop(0, 'rgba(200, 220, 240, 0.45)'); 
  fogGradient.addColorStop(0.3, 'rgba(200, 220, 240, 0.1)');
  fogGradient.addColorStop(0.6, 'rgba(0, 0, 0, 0.0)');
  ctx.fillStyle = fogGradient;
  ctx.fillRect(0, 0, CW, CH);

  const vignette = ctx.createRadialGradient(CW/2, CH/2, CH/3, CW/2, CH/2, CH);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, CW, CH);

  if (warningTimer > 0) {
    if (Math.floor(warningTimer / 10) % 2 === 0) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
      ctx.fillRect(0, 0, CW, CH);
    }
    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 40px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20;
    ctx.fillText(warningText, CW / 2, CH / 2 - 100);
    ctx.shadowBlur = 0;
  }

  if (isGameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#ff3333';
    ctx.font = 'bold 60px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 20;
    ctx.fillText('游戏结束', CW / 2, CH / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px "Microsoft YaHei"';
    ctx.fillText('点击屏幕 或 按 [R] 重新开始', CW / 2, CH / 2 + 50);
  }

  if (isWin) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 70px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 30;
    ctx.fillText('胜 利', CW / 2, CH / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px "Microsoft YaHei"';
    ctx.fillText('点击屏幕 或 按 [R] 重新开始', CW / 2, CH / 2 + 60);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

initEnvironment();
resetGame();
gameLoop();
</script>
