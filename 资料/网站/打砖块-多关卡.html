<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>打砖块 · 多关卡</title>
  <style>
    /* ========== 全局重置 & 安全区 ========== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1a1e2e 0%, #0b0d14 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /* ========== 游戏容器 ========== */
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 540px;
      animation: floatUp 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 顶部信息卡（玻璃拟态） ========== */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 18px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #eef2ff;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }
    .hud .level {
      font-weight: 700;
      background: linear-gradient(135deg, #8ab4ff, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.1rem;
    }
    .hud .score {
      font-weight: 600;
      color: #b8c6ff;
      text-shadow: 0 0 12px rgba(140, 170, 255, 0.5);
    }
    .hud .remaining {
      font-size: 0.8rem;
      color: #8892b0;
      opacity: 0.9;
    }

    /* ========== 画布包装器 ========== */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 480px;
      background: #0a0c14;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(120, 150, 255, 0.15), 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 80px -20px rgba(80, 120, 255, 0.3);
      transition: box-shadow 0.3s;
    }
    .canvas-wrapper:hover {
      box-shadow: 0 0 0 1px rgba(140, 170, 255, 0.25), 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 100px -10px rgba(90, 130, 255, 0.45);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* ========== 虚拟滑条（H5主控） ========== */
    .slider-wrapper {
      width: 100%;
      max-width: 480px;
      margin-top: 18px;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .slider-wrapper label {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.78rem;
      color: #7c89a8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .slider-wrapper label span:first-child { color: #5f6f92; }
    .slider-wrapper label span:last-child { color: #b8c6ff; font-weight: 600; }

    /* 自定义滑条 */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: transparent;
      outline: none;
      margin: 8px 0;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 10px;
      background: linear-gradient(90deg, #2e3a5e, #4c5f8a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      margin-top: -9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e0e9ff, #6d8aff);
      box-shadow: 0 0 18px rgba(100, 140, 255, 0.9), 0 0 6px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(0, 0, 20, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
      box-shadow: 0 0 26px rgba(120, 160, 255, 1), 0 0 10px #fff;
    }
    input[type=range]::-moz-range-track {
      height: 8px;
      border-radius: 10px;
      background: linear-gradient(90deg, #2e3a5e, #4c5f8a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    input[type=range]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e0e9ff, #6d8aff);
      box-shadow: 0 0 18px rgba(100, 140, 255, 0.9), 0 0 6px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    /* 底部提示文字 */
    .hint {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #4f5a7a;
      letter-spacing: 0.3px;
      text-align: center;
      transition: opacity 0.5s;
    }

    /* 响应式：PC上隐藏滑条（但为了统一体验，我们保留，只是提示用键盘） */
    @media (min-width: 768px) {
      .slider-wrapper { opacity: 0.85; }
      .hint::after { content: ' · 键盘 ← → 或鼠标拖动'; color: #5f6f92; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <!-- 顶部 HUD -->
  <div class="hud" id="hud">
    <div class="level" id="levelDisplay">第 1 / 5 关</div>
    <div class="score" id="scoreDisplay">0 分</div>
    <div class="remaining" id="remainingDisplay">剩余 40</div>
  </div>

  <!-- 游戏画布 -->
  <div class="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- 虚拟滑条（H5 主控） -->
  <div class="slider-wrapper">
    <label>
      <span>◀ 接球区 ▶</span>
      <span id="sliderValue">50%</span>
    </label>
    <input type="range" id="paddleRange" min="0" max="100" value="50" step="1">
  </div>
  <div class="hint" id="hint">拖动滑条移动接球区</div>
</div>

<script>
  (function() {
    // ============================================================
    // 全局配置
    // ============================================================
    const LOGIC_SIZE = 480;                // 逻辑分辨率 480x480
    const FIXED_STEP = 1000 / 60;          // 固定步长 ~16.67ms
    const MAX_FRAME_TIME = 250;

    // 画布
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DPR 初始化
    function setupCanvasDPR() {
      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = LOGIC_SIZE + 'px';
      canvas.style.height = LOGIC_SIZE + 'px';
      canvas.width = LOGIC_SIZE * dpr;
      canvas.height = LOGIC_SIZE * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    setupCanvasDPR();

    // 响应式 DPR 重设
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        setupCanvasDPR();
      }, 100);
    });

    // ============================================================
    // 音频管理器（极简，无外部依赖）
    // ============================================================
    let audioCtx = null;
    let audioUnlocked = false;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        audioUnlocked = true;
      } catch (e) { /* 静默失败 */ }
    }

    // 首次交互解锁
    window.addEventListener('pointerdown', function unlock() {
      initAudio();
      if (audioUnlocked) window.removeEventListener('pointerdown', unlock);
    }, { once: false });

    function playTone(freq = 440, duration = 0.08, type = 'sine', volume = 0.06) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { /* 忽略 */ }
    }

    // ============================================================
    // 输入管理器：只保留 paddleTarget (0~1)
    // ============================================================
    const InputManager = {
      paddleTarget: 0.5,             // 归一化 0~1

      setPaddleTarget(norm) {
        this.paddleTarget = Math.min(1, Math.max(0, norm));
        // 同步滑条 UI
        if (paddleRange) {
          paddleRange.value = this.paddleTarget * 100;
          sliderValueEl.textContent = Math.round(this.paddleTarget * 100) + '%';
        }
      },
      getPaddleTarget() {
        return this.paddleTarget;
      },
      reset() {
        this.setPaddleTarget(0.5);
      }
    };

    // 滑条元素
    const paddleRange = document.getElementById('paddleRange');
    const sliderValueEl = document.getElementById('sliderValue');

    // 滑条输入
    paddleRange.addEventListener('input', (e) => {
      InputManager.setPaddleTarget(parseInt(e.target.value, 10) / 100);
    });

    // 键盘：左右键
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        let cur = InputManager.getPaddleTarget();
        const step = 0.06;
        if (e.key === 'ArrowLeft') cur -= step;
        else cur += step;
        InputManager.setPaddleTarget(cur);
      }
    });

    // 鼠标/触摸拖动画布 → 直接控制接球区
    let isPointerDown = false;

    function handleCanvasPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = LOGIC_SIZE / rect.width;
      let canvasX = (e.clientX - rect.left) * scaleX;
      canvasX = Math.min(LOGIC_SIZE, Math.max(0, canvasX));
      InputManager.setPaddleTarget(canvasX / LOGIC_SIZE);
    }

    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      canvas.setPointerCapture(e.pointerId);
      handleCanvasPointer(e);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (isPointerDown) {
        e.preventDefault();
        handleCanvasPointer(e);
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      isPointerDown = false;
      canvas.releasePointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointercancel', () => {
      isPointerDown = false;
    });

    // 防止触摸滚动
    window.addEventListener('touchmove', (e) => {
      if (e.target === canvas) e.preventDefault();
    }, { passive: false });

    // ============================================================
    // 关卡数据 (5 关)
    // 布局使用字符串图案: '0'=空, '1'=普通砖
    // ============================================================
    const LEVELS = [
      { // 第1关 热身: 5行 全满 (但底部留空)
        name: '热身',
        rows: 5,
        cols: 8,
        layout: [
          '11111111',
          '11111111',
          '11111111',
          '11111111',
          '11111111'
        ],
        ballSpeed: { vx: 3.0, vy: -4.2 },
        paddleWidth: 100,
        paddleHeight: 14,
        brickHp: 1
      },
      { // 第2关 镂空: 中间空洞
        name: '镂空',
        rows: 6,
        cols: 8,
        layout: [
          '11111111',
          '11000011',
          '10000001',
          '10000001',
          '11000011',
          '11111111'
        ],
        ballSpeed: { vx: 3.2, vy: -4.5 },
        paddleWidth: 95,
        paddleHeight: 14,
        brickHp: 1
      },
      { // 第3关 密集: 7行, 球速稍快
        name: '密集',
        rows: 7,
        cols: 8,
        layout: [
          '11111111',
          '11111111',
          '11111111',
          '11111111',
          '11111111',
          '11111111',
          '11111111'
        ],
        ballSpeed: { vx: 3.5, vy: -4.8 },
        paddleWidth: 90,
        paddleHeight: 14,
        brickHp: 1
      },
      { // 第4关 窄接球区: 球速快, 接球区窄
        name: '窄接球',
        rows: 6,
        cols: 8,
        layout: [
          '11111111',
          '11111111',
          '11011011',
          '11011011',
          '11111111',
          '11111111'
        ],
        ballSpeed: { vx: 3.8, vy: -5.2 },
        paddleWidth: 75,
        paddleHeight: 12,
        brickHp: 1
      },
      { // 第5关 综合: 有硬砖 (2血) 用 '2' 表示
        name: '综合挑战',
        rows: 7,
        cols: 8,
        layout: [
          '22222222',
          '11111111',
          '11000011',
          '10000001',
          '11000011',
          '11111111',
          '22222222'
        ],
        ballSpeed: { vx: 4.0, vy: -5.5 },
        paddleWidth: 80,
        paddleHeight: 14,
        brickHp: 2 // 但 '1' 砖为1血, '2'为2血; 这里使用 layout 字符判断
      }
    ];

    // ============================================================
    // 打砖块游戏核心（单关逻辑）
    // ============================================================
    const brickGame = {
      // 当前关卡索引
      levelIndex: 0,

      // 球
      ballX: LOGIC_SIZE / 2,
      ballY: LOGIC_SIZE - 80,
      ballVX: 3.2,
      ballVY: -4.5,
      ballRadius: 8,

      // 挡板（隐形碰撞区域，由滑条驱动）
      paddleWidth: 100,
      paddleHeight: 14,
      paddleX: LOGIC_SIZE / 2 - 50,  // 左上角 X
      paddleY: LOGIC_SIZE - 40,

      // 砖块
      bricks: [],
      brickRows: 5,
      brickCols: 8,
      brickWidth: 48,
      brickHeight: 20,
      brickPadding: 6,
      brickOffsetTop: 50,
      brickOffsetLeft: 27, // 动态计算

      // 状态
      score: 0,
      totalScore: 0,
      gameOver: false,
      win: false,           // 本关胜利
      allLevelsComplete: false,
      transitioning: false, // 过关动画中

      // 特效
      particles: [],        // 砖块破碎粒子
      ballTrail: [],        // 球拖尾

      // 当前关卡配置
      config: null,

      // ---- 初始化关卡 ----
      loadLevel(index) {
        if (index < 0 || index >= LEVELS.length) {
          this.allLevelsComplete = true;
          return;
        }
        this.levelIndex = index;
        this.config = LEVELS[index];

        // 重置球
        this.ballX = LOGIC_SIZE / 2;
        this.ballY = LOGIC_SIZE - 80;
        this.ballVX = this.config.ballSpeed.vx;
        this.ballVY = this.config.ballSpeed.vy;
        this.ballRadius = 8;

        // 重置挡板
        this.paddleWidth = this.config.paddleWidth || 100;
        this.paddleHeight = this.config.paddleHeight || 14;
        this.paddleY = LOGIC_SIZE - 40;

        // 重置状态
        this.score = 0;
        this.gameOver = false;
        this.win = false;
        this.allLevelsComplete = false;
        this.transitioning = false;
        this.particles = [];
        this.ballTrail = [];

        // 生成砖块
        this.generateBricks();

        // 重置输入到中间
        InputManager.reset();
        this.updatePaddlePosition();

        // 更新HUD
        updateHUD();
      },

      generateBricks() {
        this.bricks = [];
        const layout = this.config.layout;
        const rows = layout.length;
        const cols = layout[0].length;

        this.brickCols = cols;
        this.brickRows = rows;

        // 根据列数计算砖块宽度
        const totalPadding = (cols - 1) * this.brickPadding;
        this.brickWidth = (LOGIC_SIZE - 2 * 30 - totalPadding) / cols;
        this.brickOffsetLeft = 30;

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const ch = layout[row][col];
            if (ch === '0') continue;

            let hp = 1;
            if (ch === '2') hp = 2;
            if (ch === '1') hp = 1;

            // 每行不同色相, 更美观
            const hue = (row * 40 + col * 15) % 360;
            const color = `hsl(${hue}, 75%, 62%)`;
            const colorDark = `hsl(${hue}, 75%, 42%)`;

            this.bricks.push({
              x: this.brickOffsetLeft + col * (this.brickWidth + this.brickPadding),
              y: this.brickOffsetTop + row * (this.brickHeight + this.brickPadding),
              w: this.brickWidth,
              h: this.brickHeight,
              active: true,
              hp: hp,
              maxHp: hp,
              color: color,
              colorDark: colorDark,
              row: row,
              col: col
            });
          }
        }
      },

      // 计算挡板位置 (基于输入归一化值)
      updatePaddlePosition() {
        const targetNorm = InputManager.getPaddleTarget();
        const targetX = targetNorm * LOGIC_SIZE - this.paddleWidth / 2;
        this.paddleX = Math.max(0, Math.min(LOGIC_SIZE - this.paddleWidth, targetX));
      },

      // ---- 更新逻辑 (固定步长) ----
      update(dt) {
        // 处理过关/失败后的过渡等待
        if (this.transitioning) {
          // 过渡中只更新粒子
          this.updateParticles();
          return;
        }

        if (this.gameOver || this.win || this.allLevelsComplete) {
          this.updateParticles();
          return;
        }

        // 1. 更新挡板位置（从输入管理器）
        this.updatePaddlePosition();

        // 2. 更新球位置（固定步长，速度恒定）
        this.ballX += this.ballVX;
        this.ballY += this.ballVY;

        // 3. 记录球拖尾
        this.ballTrail.push({ x: this.ballX, y: this.ballY, life: 1.0 });
        if (this.ballTrail.length > 8) this.ballTrail.shift();
        // 拖尾衰减
        this.ballTrail.forEach(p => p.life -= 0.08);

        // 4. 墙壁碰撞
        // 左/右
        if (this.ballX - this.ballRadius <= 0) {
          this.ballX = this.ballRadius;
          this.ballVX *= -1;
          playTone(600, 0.05, 'sine', 0.04);
        } else if (this.ballX + this.ballRadius >= LOGIC_SIZE) {
          this.ballX = LOGIC_SIZE - this.ballRadius;
          this.ballVX *= -1;
          playTone(600, 0.05, 'sine', 0.04);
        }
        // 顶部
        if (this.ballY - this.ballRadius <= 0) {
          this.ballY = this.ballRadius;
          this.ballVY *= -1;
          playTone(600, 0.05, 'sine', 0.04);
        }

        // 底部：游戏结束
        if (this.ballY + this.ballRadius > LOGIC_SIZE) {
          this.gameOver = true;
          playTone(180, 0.4, 'sawtooth', 0.08);
          return;
        }

        // 5. 挡板碰撞（隐形接球区）
        const paddleLeft = this.paddleX;
        const paddleRight = this.paddleX + this.paddleWidth;
        const paddleTop = this.paddleY;
        const paddleBottom = this.paddleY + this.paddleHeight;

        // 球底部与挡板顶部相交, 且球在水平范围内
        if (this.ballVY > 0 &&
            this.ballY + this.ballRadius >= paddleTop &&
            this.ballY - this.ballRadius <= paddleBottom &&
            this.ballX + this.ballRadius >= paddleLeft &&
            this.ballX - this.ballRadius <= paddleRight) {

          // 反射
          this.ballY = paddleTop - this.ballRadius;

          // 根据击中位置改变角度
          const hitPos = (this.ballX - paddleLeft) / this.paddleWidth; // 0~1
          const angle = (hitPos - 0.5) * 2; // -1~1
          const speed = Math.hypot(this.ballVX, this.ballVY);
          const baseSpeed = Math.min(6.5, speed * 1.01); // 微加速，封顶
          const newVX = angle * baseSpeed * 0.85;
          const newVY = -Math.sqrt(Math.max(1, baseSpeed * baseSpeed - newVX * newVX));
          this.ballVX = newVX;
          this.ballVY = newVY;

          playTone(820, 0.06, 'sine', 0.05);
        }

        // 6. 砖块碰撞
        for (let i = 0; i < this.bricks.length; i++) {
          const brick = this.bricks[i];
          if (!brick.active) continue;

          // 圆与矩形碰撞检测
          const closestX = Math.max(brick.x, Math.min(this.ballX, brick.x + brick.w));
          const closestY = Math.max(brick.y, Math.min(this.ballY, brick.y + brick.h));
          const dx = this.ballX - closestX;
          const dy = this.ballY - closestY;
          const distSq = dx * dx + dy * dy;

          if (distSq < this.ballRadius * this.ballRadius) {
            // 砖块被击中
            brick.hp -= 1;

            // 粒子效果
            this.spawnParticles(brick);

            if (brick.hp <= 0) {
              brick.active = false;
              this.score += 10;
              playTone(1000, 0.08, 'square', 0.04);
            } else {
              // 硬砖受伤变色
              brick.color = `hsl(${brick.row * 40 + brick.col * 15}, 75%, 45%)`;
              playTone(500, 0.06, 'sawtooth', 0.03);
            }

            // 反弹方向判定（根据重叠最小方向）
            const overlapLeft = (this.ballX + this.ballRadius) - brick.x;
            const overlapRight = (brick.x + brick.w) - (this.ballX - this.ballRadius);
            const overlapTop = (this.ballY + this.ballRadius) - brick.y;
            const overlapBottom = (brick.y + brick.h) - (this.ballY - this.ballRadius);
            const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

            if (minOverlap === overlapLeft || minOverlap === overlapRight) {
              this.ballVX *= -1;
            } else {
              this.ballVY *= -1;
            }

            break; // 每帧最多撞一个砖块
          }
        }

        // 7. 检查是否所有砖块清空 → 本关胜利
        if (this.bricks.every(b => !b.active)) {
          this.win = true;
          this.transitioning = true;

          // 进入过关过渡
          setTimeout(() => {
            if (this.levelIndex + 1 < LEVELS.length) {
              this.loadLevel(this.levelIndex + 1);
            } else {
              this.allLevelsComplete = true;
              this.transitioning = false;
            }
            updateHUD();
          }, 1500); // 1.5秒后自动下一关
        }

        // 更新粒子
        this.updateParticles();
      },

      // 生成破碎粒子
      spawnParticles(brick) {
        const cx = brick.x + brick.w / 2;
        const cy = brick.y + brick.h / 2;
        const count = 8;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 3;
          this.particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0,
            color: brick.color,
            size: 3 + Math.random() * 4
          });
        }
      },

      updateParticles() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.1; // 轻微重力
          p.life -= 0.02;
          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      },

      // ---- 渲染 ----
      render(ctx) {
        // 背景
        this.drawBackground(ctx);

        // 砖块
        this.bricks.forEach(brick => {
          if (!brick.active) return;
          this.drawBrick(ctx, brick);
        });

        // 粒子（在球下层）
        this.particles.forEach(p => {
          ctx.globalAlpha = p.life * 0.8;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // 球拖尾
        this.ballTrail.forEach((p, idx) => {
          if (p.life <= 0) return;
          const alpha = p.life * 0.4;
          const radius = this.ballRadius * p.life * 0.8;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#aaccff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // 挡板（隐形碰撞区）→ 绘制为底部发光弧形光带
        this.drawPaddleGlow(ctx);

        // 球
        this.drawBall(ctx);

        // 游戏结束/胜利覆盖层
        if (this.gameOver) {
          this.drawOverlay(ctx, '挑战失败', `得分 ${this.score}`, '点击画布重试');
        } else if (this.win && this.transitioning) {
          this.drawOverlay(ctx, `第 ${this.levelIndex + 1} 关通过`, `得分 ${this.score}`, '即将进入下一关...');
        } else if (this.allLevelsComplete) {
          this.drawOverlay(ctx, '全部通关 🎉', `总分 ${this.totalScore}`, '点击画布重新开始');
        }

        // 更新HUD剩余砖块数
        this.updateHUDIfNeeded();
      },

      drawBackground(ctx) {
        // 径向渐变背景
        const grad = ctx.createRadialGradient(
          LOGIC_SIZE / 2, LOGIC_SIZE * 0.3, 20,
          LOGIC_SIZE / 2, LOGIC_SIZE * 0.7, LOGIC_SIZE
        );
        grad.addColorStop(0, '#151b2e');
        grad.addColorStop(0.6, '#0b0e18');
        grad.addColorStop(1, '#05070c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

        // 微弱的网格线
        ctx.strokeStyle = 'rgba(80, 110, 180, 0.05)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 10; i++) {
          const pos = (i / 10) * LOGIC_SIZE;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, LOGIC_SIZE);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(LOGIC_SIZE, pos);
          ctx.stroke();
        }
      },

      drawBrick(ctx, brick) {
        const radius = 6;
        // 发光
        ctx.shadowColor = brick.color;
        ctx.shadowBlur = 10;

        // 渐变填充
        const grad = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
        grad.addColorStop(0, brick.color);
        grad.addColorStop(1, brick.colorDark || brick.color);
        ctx.fillStyle = grad;

        // 圆角矩形
        ctx.beginPath();
        ctx.roundRect(brick.x, brick.y, brick.w, brick.h, radius);
        ctx.fill();

        // 高光线
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(brick.x + 1, brick.y + 1, brick.w - 2, brick.h - 2, radius - 1);
        ctx.stroke();

        // 硬砖小标记
        if (brick.maxHp > 1) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.font = 'bold 10px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('★', brick.x + brick.w / 2, brick.y + brick.h / 2);
        }
        ctx.shadowBlur = 0;
      },

      drawPaddleGlow(ctx) {
        // 隐形挡板 → 底部弧形光带
        const x = this.paddleX + this.paddleWidth / 2;
        const y = this.paddleY + this.paddleHeight / 2;

        // 光晕
        const glowGrad = ctx.createRadialGradient(x, y, 4, x, y, this.paddleWidth * 0.9);
        glowGrad.addColorStop(0, 'rgba(120, 170, 255, 0.45)');
        glowGrad.addColorStop(0.5, 'rgba(90, 130, 255, 0.15)');
        glowGrad.addColorStop(1, 'rgba(90, 130, 255, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(x, y, this.paddleWidth * 0.9, 0, Math.PI * 2);
        ctx.fill();

        // 弧形光带
        ctx.shadowColor = '#8ab4ff';
        ctx.shadowBlur = 20;
        ctx.strokeStyle = 'rgba(180, 210, 255, 0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, this.paddleWidth * 0.45, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();

        // 中心亮点
        ctx.shadowBlur = 30;
        ctx.fillStyle = 'rgba(220, 235, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(x, y - 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
      },

      drawBall(ctx) {
        // 外发光
        ctx.shadowColor = '#aaccff';
        ctx.shadowBlur = 24;

        // 球体渐变
        const grad = ctx.createRadialGradient(
          this.ballX - 3, this.ballY - 3, 1,
          this.ballX, this.ballY, this.ballRadius
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.7, '#c8ddff');
        grad.addColorStop(1, '#6d8aff');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.ballX, this.ballY, this.ballRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
      },

      drawOverlay(ctx, title, subtitle, hint) {
        ctx.fillStyle = 'rgba(5, 8, 18, 0.8)';
        ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

        // 标题
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#8ab4ff';
        ctx.fillStyle = '#f0f4ff';
        ctx.font = 'bold 34px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, LOGIC_SIZE / 2, LOGIC_SIZE / 2 - 30);

        // 副标题
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#5a7aff';
        ctx.fillStyle = '#b8c6ff';
        ctx.font = '600 20px Inter, system-ui, sans-serif';
        ctx.fillText(subtitle, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 25);

        // 提示
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#5f6f92';
        ctx.font = '14px Inter, system-ui, sans-serif';
        ctx.fillText(hint, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 80);

        ctx.shadowBlur = 0;
      },

      // 画布点击 → 重试 / 重开
      handleCanvasClick() {
        if (this.gameOver) {
          // 重开当前关
          this.loadLevel(this.levelIndex);
        } else if (this.allLevelsComplete) {
          // 从头开始
          this.levelIndex = 0;
          this.totalScore = 0;
          this.allLevelsComplete = false;
          this.loadLevel(0);
        }
      },

      updateHUDIfNeeded() {
        // 在循环中调用更新剩余砖块数
        const remaining = this.bricks.filter(b => b.active).length;
        if (remainingDisplayEl) {
          remainingDisplayEl.textContent = `剩余 ${remaining}`;
        }
      }
    };

    // ============================================================
    // HUD 更新
    // ============================================================
    const levelDisplayEl = document.getElementById('levelDisplay');
    const scoreDisplayEl = document.getElementById('scoreDisplay');
    const remainingDisplayEl = document.getElementById('remainingDisplay');

    function updateHUD() {
      if (!brickGame.config) return;
      levelDisplayEl.textContent = `第 ${brickGame.levelIndex + 1} / ${LEVELS.length} 关`;
      scoreDisplayEl.textContent = `${brickGame.score} 分`;
      const remaining = brickGame.bricks.filter(b => b.active).length;
      remainingDisplayEl.textContent = `剩余 ${remaining}`;
    }

    // ============================================================
    // 画布点击处理 (重开/重试)
    // ============================================================
    canvas.addEventListener('click', (e) => {
      // 防止与拖动冲突
      if (!isPointerDown) {
        brickGame.handleCanvasClick();
      }
    });

    // ============================================================
    // 游戏循环 (固定步长)
    // ============================================================
    let lastTime = performance.now();
    let accumulator = 0;

    // 初始化第一关
    brickGame.loadLevel(0);

    function gameLoop(currentTime) {
      let delta = currentTime - lastTime;
      lastTime = currentTime;
      delta = Math.min(delta, MAX_FRAME_TIME);

      accumulator += delta;

      while (accumulator >= FIXED_STEP) {
        brickGame.update(FIXED_STEP);
        accumulator -= FIXED_STEP;
      }

      brickGame.render(ctx);

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    // 初始化HUD
    setTimeout(() => updateHUD(), 0);

    // ============================================================
    // 一些小优化：防止双击缩放等
    // ============================================================
    document.addEventListener('gesturestart', (e) => e.preventDefault());

  })();
</script>
</body>
