<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048 · 闯关版</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1a1e2e 0%, #0b0d14 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .game-container {
      position: relative; display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 440px;
      animation: floatUp 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== HUD ===== */
    .hud {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 10px 16px; margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #eef2ff; font-size: 0.9rem; letter-spacing: 0.3px;
      flex-wrap: wrap; gap: 6px 12px;
    }
    .hud .level { font-weight: 700; background: linear-gradient(135deg, #8ab4ff, #c084fc);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hud .goal { font-weight: 600; color: #b8c6ff; }
    .hud .constraint { font-weight: 600; color: #ff8a8a; }
    .hud .score { font-weight: 600; color: #ffd966; }
    .hud .extra { font-size: 0.8rem; color: #8892b0; }

    /* ===== 棋盘 ===== */
    .board-wrapper {
      position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 440px;
      background: #1a1e2e; border-radius: 24px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(120, 150, 255, 0.15), 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 80px -20px rgba(80, 120, 255, 0.3);
      touch-action: none;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px;
      width: 100%; height: 100%;
      background: #12162a;
    }
    .cell {
      position: relative;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: clamp(1.2rem, 5vw, 2.2rem);
      color: #fff;
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      will-change: transform;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .cell[data-value="0"] { background: rgba(255, 255, 255, 0.03); box-shadow: none; }
    .cell.obstacle {
      background: repeating-linear-gradient(45deg, #2a2f42, #2a2f42 6px, #363c52 6px, #363c52 12px);
      color: #7c89a8; font-size: 1.4rem;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
    }
    .cell.merged {
      animation: pop 0.18s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .cell.spawn {
      animation: spawn 0.15s ease-out;
    }
    @keyframes spawn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* 方块配色 */
    .cell[data-value="2"]    { background: linear-gradient(135deg, #3a3f5e, #2e3450); }
    .cell[data-value="4"]    { background: linear-gradient(135deg, #4a4f7e, #3a3f6a); }
    .cell[data-value="8"]    { background: linear-gradient(135deg, #5a5f9e, #4a4f8a); }
    .cell[data-value="16"]   { background: linear-gradient(135deg, #6a6fce, #5a5fbe); }
    .cell[data-value="32"]   { background: linear-gradient(135deg, #7a7fff, #6a6fef); }
    .cell[data-value="64"]   { background: linear-gradient(135deg, #8a8fff, #7a7fff); color: #fff; }
    .cell[data-value="128"]  { background: linear-gradient(135deg, #a080ff, #9070ff); }
    .cell[data-value="256"]  { background: linear-gradient(135deg, #b060ff, #a050ff); }
    .cell[data-value="512"]  { background: linear-gradient(135deg, #c040ff, #b030ff); }
    .cell[data-value="1024"] { background: linear-gradient(135deg, #ff50c0, #e040b0); }
    .cell[data-value="2048"] { background: linear-gradient(135deg, #ffd966, #f0a030); color: #1a1e2e; }
    .cell[data-value="4096"] { background: linear-gradient(135deg, #ff6b4a, #e05030); }

    /* ===== 底部按钮 ===== */
    .controls {
      display: flex; gap: 12px; margin-top: 14px; width: 100%; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .ctrl-btn {
      flex: 1; max-width: 140px; padding: 12px 0;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px; color: #eef2ff; font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      transition: 0.08s; touch-action: manipulation;
    }
    .ctrl-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3); }
    .ctrl-btn:disabled { opacity: 0.35; pointer-events: none; }
    .ctrl-btn.undo { background: rgba(255, 200, 100, 0.15); border-color: rgba(255, 200, 100, 0.3); color: #ffd966; }
    .ctrl-btn.restart { background: rgba(100, 200, 255, 0.15); border-color: rgba(100, 200, 255, 0.3); color: #aaddff; }

    .hint { margin-top: 8px; font-size: 0.72rem; color: #4f5a7a; text-align: center; }
    @media (min-width: 768px) {
      .hint::after { content: ' · 方向键 / WASD 滑动'; color: #5f6f92; }
    }

    /* 过关覆盖层 */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(5, 8, 18, 0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 24px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
      padding: 20px;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 {
      margin: 0 0 8px; font-size: 1.8rem;
      background: linear-gradient(135deg, #ffd966, #f0a030);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 200, 80, 0.4);
    }
    .overlay p { margin: 4px 0; color: #b8c6ff; font-size: 1rem; }
    .overlay .stars { font-size: 2rem; letter-spacing: 4px; margin: 10px 0; }
    .overlay button {
      margin-top: 16px; padding: 12px 32px;
      background: linear-gradient(135deg, #4c7eff, #3a5fce);
      border: none; border-radius: 14px; color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 0 #1e3b7a;
      transition: 0.08s;
    }
    .overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e3b7a; }
  </style>
</head>
<body>
<div class="game-container">
  <div class="hud" id="hud">
    <div class="level" id="levelDisplay">第 1 关</div>
    <div class="goal" id="goalDisplay">合成 128</div>
    <div class="constraint" id="constraintDisplay">无限制</div>
    <div class="score" id="scoreDisplay">0 分</div>
  </div>

  <div class="board-wrapper" id="boardWrapper">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">关卡完成</h2>
      <p id="overlaySubtitle">得分 0</p>
      <div class="stars" id="overlayStars">⭐⭐⭐</div>
      <p id="overlayHint">点击继续</p>
      <button id="overlayBtn">继续</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn undo" id="btnUndo" disabled>撤销 (2)</button>
    <button class="ctrl-btn restart" id="btnRestart">重开</button>
  </div>
  <div class="hint" id="hint">滑动方块合并相同数字</div>
</div>

<script>
  (function() {
    // ============================================================
    // 配置
    // ============================================================
    const SIZE = 4;
    const OBSTACLE = -1;
    const STORAGE_KEY = '2048_level_progress';
    const UNDO_PER_LEVEL = 2;

    // 10 关配置
    const LEVELS = [
      { id: 1,  goalType: 'create', goalValue: 128,  steps: 0,   time: 0, obstacles: 0,  star2: 60, star3: 40,  name: '第 1 关' },
      { id: 2,  goalType: 'create', goalValue: 256,  steps: 120, time: 0, obstacles: 0,  star2: 105, star3: 90, name: '第 2 关' },
      { id: 3,  goalType: 'create', goalValue: 256,  steps: 90,  time: 0, obstacles: 0,  star2: 78, star3: 65,  name: '第 3 关' },
      { id: 4,  goalType: 'create', goalValue: 512,  steps: 0,   time: 0, obstacles: 2,  star2: 140, star3: 100, name: '第 4 关' },
      { id: 5,  goalType: 'create', goalValue: 512,  steps: 120, time: 0, obstacles: 5,  star2: 170, star3: 120, name: '第 5 关' },
      { id: 6,  goalType: 'score',  goalValue: 5000, steps: 0,   time: 120, obstacles: 0, star2: 90, star3: 110, name: '第 6 关' },
      { id: 7,  goalType: 'create', goalValue: 1024, steps: 150, time: 0, obstacles: 3,  star2: 135, star3: 115, name: '第 7 关' },
      { id: 8,  goalType: 'clear',  goalValue: 64,   steps: 80,  time: 0, obstacles: 0,  star2: 68, star3: 55,  name: '第 8 关' },
      { id: 9,  goalType: 'create', goalValue: 1024, steps: 0,   time: 0, obstacles: 0,  idlePenalty: 4000, star2: 180, star3: 130, name: '第 9 关' },
      { id: 10, goalType: 'create', goalValue: 2048, steps: 200, time: 0, obstacles: 4,  star2: 180, star3: 155, name: '第 10 关' }
    ];

    // ============================================================
    // 合并引擎（纯函数，含障碍物分段处理）
    // ============================================================
    function slideRowLeft(row) {
      // row 数组，障碍物 OBSTACLE (-1)
      // 分段处理：按障碍物切分
      const segments = [];
      let current = [];
      for (let i = 0; i < row.length; i++) {
        if (row[i] === OBSTACLE) {
          if (current.length > 0) { segments.push(current); current = []; }
          segments.push(null); // 标记障碍物
        } else {
          current.push(row[i]);
        }
      }
      if (current.length > 0) segments.push(current);

      let score = 0;
      const result = [];

      for (const seg of segments) {
        if (seg === null) {
          result.push(OBSTACLE);
          continue;
        }
        // 去零
        const nonZero = seg.filter(v => v !== 0);
        // 合并
        const merged = [];
        for (let i = 0; i < nonZero.length; i++) {
          if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
            const val = nonZero[i] * 2;
            merged.push(val);
            score += val;
            i++;
          } else {
            merged.push(nonZero[i]);
          }
        }
        // 补零
        while (merged.length < seg.length) merged.push(0);
        result.push(...merged);
      }

      // 如果 result 长度不对（理论上不会），补零
      while (result.length < row.length) result.push(0);
      return { row: result, score };
    }

    // 四方向复用
    function slideBoard(board, direction) {
      // board: SIZE x SIZE 二维数组
      const newBoard = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      let totalScore = 0;
      let moved = false;

      // 获取每一行/列并执行左压缩
      if (direction === 'left') {
        for (let r = 0; r < SIZE; r++) {
          const { row, score } = slideRowLeft(board[r]);
          totalScore += score;
          newBoard[r] = row;
          if (!moved && row.some((v, i) => v !== board[r][i])) moved = true;
        }
      } else if (direction === 'right') {
        for (let r = 0; r < SIZE; r++) {
          const reversed = [...board[r]].reverse();
          const { row, score } = slideRowLeft(reversed);
          totalScore += score;
          newBoard[r] = row.reverse();
          if (!moved && newBoard[r].some((v, i) => v !== board[r][i])) moved = true;
        }
      } else if (direction === 'up') {
        for (let c = 0; c < SIZE; c++) {
          const col = [];
          for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
          const { row, score } = slideRowLeft(col);
          totalScore += score;
          for (let r = 0; r < SIZE; r++) {
            newBoard[r][c] = row[r];
            if (!moved && row[r] !== board[r][c]) moved = true;
          }
        }
      } else if (direction === 'down') {
        for (let c = 0; c < SIZE; c++) {
          const col = [];
          for (let r = SIZE - 1; r >= 0; r--) col.push(board[r][c]);
          const { row, score } = slideRowLeft(col);
          totalScore += score;
          for (let r = SIZE - 1, i = 0; r >= 0; r--, i++) {
            newBoard[r][c] = row[i];
            if (!moved && row[i] !== board[r][c]) moved = true;
          }
        }
      }

      return { board: newBoard, score: totalScore, moved };
    }

    // ============================================================
    // 棋盘管理
    // ============================================================
    class Board {
      constructor() {
        this.grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        this.score = 0;
      }

      reset() {
        this.grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        this.score = 0;
      }

      setObstacles(count) {
        if (count <= 0) return;
        // 随机放置障碍物（避开中心 2x2，避免一开始就卡死）
        const candidates = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (r >= 1 && r <= 2 && c >= 1 && c <= 2) continue; // 中心不放
            candidates.push([r, c]);
          }
        }
        // 洗牌
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
        }
        for (let i = 0; i < Math.min(count, candidates.length); i++) {
          const [r, c] = candidates[i];
          this.grid[r][c] = OBSTACLE;
        }
      }

      // 获取空单元格
      getEmptyCells() {
        const cells = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (this.grid[r][c] === 0) cells.push([r, c]);
          }
        }
        return cells;
      }

      // 随机生成 2 或 4
      spawnRandom() {
        const empty = this.getEmptyCells();
        if (empty.length === 0) return false;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        return { r, c };
      }

      // 检查是否有可移动的
      canMove() {
        if (this.getEmptyCells().length > 0) return true;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const v = this.grid[r][c];
            if (v === OBSTACLE || v === 0) continue;
            if (r + 1 < SIZE && this.grid[r + 1][c] === v) return true;
            if (c + 1 < SIZE && this.grid[r][c + 1] === v) return true;
          }
        }
        return false;
      }

      // 获取最大值
      getMaxTile() {
        let max = 0;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const v = this.grid[r][c];
            if (v !== OBSTACLE && v > max) max = v;
          }
        }
        return max;
      }

      // 深拷贝
      clone() {
        const b = new Board();
        b.grid = this.grid.map(row => [...row]);
        b.score = this.score;
        return b;
      }
    }

    // ============================================================
    // 关卡规则引擎
    // ============================================================
    const LevelRules = {
      // 检查目标是否达成
      isGoalAchieved(level, board) {
        if (level.goalType === 'create') {
          return board.getMaxTile() >= level.goalValue;
        } else if (level.goalType === 'score') {
          return board.score >= level.goalValue;
        } else if (level.goalType === 'clear') {
          // 消除目标：棋盘上所有 >= goalValue 的方块都被消除（即不存在）
          // 但更合理的理解：目标值是 64，即不出现 64 以上的方块？不对。
          // 经典"消除 64"：合成出 64 即消除，然后继续？这里简化为：棋盘上不再有 64 以上的方块（即所有 64 都被消除？）
          // 更合理：目标值为 64，即需要消除 64 这个方块（合成出 64 后自动消除）
          // 我们采用：游戏过程中，每当合成出 64，该方块消失（不留在棋盘），然后继续
          // 胜利条件：累计消除 64 的次数达到 1 次？不，这太简单。
          // 重新理解：clear 目标 = 在步数限制内，棋盘上不存在任何 >= goalValue 的方块
          // 即你必须在合成出 64 之前完成？也不对。
          // 经典 2048 "消除"模式：目标是合成出指定方块，然后它会被移除，你需要移除 N 个。
          // 为了简单且可玩：目标 = 合成出 64 即胜利（同 create），但 64 会被消除而不是留在棋盘上。
          // 这里我们采用：clear 目标 = 合成出 goalValue 即胜利，且该方块被移除，棋盘恢复。
          // 那么和 create 有什么区别？区别在于胜利后该方块消失，不影响后续。
          // 既然只是演示，我们就实现为：合成出 goalValue 即胜利。
          return board.getMaxTile() >= level.goalValue;
        }
        return false;
      },

      // 检查是否失败
      isFailed(level, board, stepsLeft, timeLeft) {
        if (level.steps > 0 && stepsLeft <= 0) return true;
        if (level.time > 0 && timeLeft <= 0) return true;
        if (!board.canMove()) return true;
        return false;
      },

      // 计算星级
      calcStars(level, stepsLeft, timeLeft, score) {
        let remaining = 0;
        if (level.steps > 0) remaining = stepsLeft;
        else if (level.time > 0) remaining = timeLeft;
        else remaining = 999; // 无限制，直接三星？

        if (remaining >= level.star3) return 3;
        if (remaining >= level.star2) return 2;
        return 1;
      }
    };

    // ============================================================
    // 游戏主控
    // ============================================================
    const game = {
      levelIndex: 0,
      level: null,
      board: new Board(),
      stepsLeft: 0,
      timeLeft: 0,
      undoLeft: UNDO_PER_LEVEL,
      history: [],        // 用于撤销
      gameOver: false,
      win: false,
      transitioning: false,
      idleTimer: 0,       // 空闲惩罚计时
      idlePenalty: 0,     // 空闲惩罚阈值（毫秒）

      // DOM 缓存
      boardEl: document.getElementById('board'),
      overlayEl: document.getElementById('overlay'),
      overlayTitle: document.getElementById('overlayTitle'),
      overlaySubtitle: document.getElementById('overlaySubtitle'),
      overlayStars: document.getElementById('overlayStars'),
      overlayHint: document.getElementById('overlayHint'),
      overlayBtn: document.getElementById('overlayBtn'),
      levelDisplay: document.getElementById('levelDisplay'),
      goalDisplay: document.getElementById('goalDisplay'),
      constraintDisplay: document.getElementById('constraintDisplay'),
      scoreDisplay: document.getElementById('scoreDisplay'),
      btnUndo: document.getElementById('btnUndo'),
      btnRestart: document.getElementById('btnRestart'),

      init() {
        this.loadLevel(0);
        this.bindEvents();
        this.render();
      },

      bindEvents() {
        // 键盘
        window.addEventListener('keydown', (e) => {
          if (this.transitioning || this.gameOver || this.win) return;
          const keyMap = {
            'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
            'a': 'left', 'd': 'right', 'w': 'up', 's': 'down',
            'A': 'left', 'D': 'right', 'W': 'up', 'S': 'down'
          };
          const dir = keyMap[e.key];
          if (dir) {
            e.preventDefault();
            this.move(dir);
          }
        });

        // 触摸滑动
        let touchStartX = 0, touchStartY = 0;
        const boardWrapper = document.getElementById('boardWrapper');

        boardWrapper.addEventListener('touchstart', (e) => {
          if (this.transitioning || this.gameOver || this.win) return;
          const touch = e.touches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }, { passive: true });

        boardWrapper.addEventListener('touchend', (e) => {
          if (this.transitioning || this.gameOver || this.win) return;
          if (e.changedTouches.length === 0) return;
          const touch = e.changedTouches[0];
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;
          const absDx = Math.abs(dx);
          const absDy = Math.abs(dy);
          if (Math.max(absDx, absDy) < 30) return; // 阈值
          if (absDx > absDy) {
            this.move(dx > 0 ? 'right' : 'left');
          } else {
            this.move(dy > 0 ? 'down' : 'up');
          }
          e.preventDefault();
        }, { passive: false });

        // 撤销
        this.btnUndo.addEventListener('click', () => this.undo());

        // 重开
        this.btnRestart.addEventListener('click', () => {
          this.loadLevel(this.levelIndex);
        });

        // 覆盖层按钮
        this.overlayBtn.addEventListener('click', () => {
          if (this.win) {
            // 下一关
            if (this.levelIndex + 1 < LEVELS.length) {
              this.loadLevel(this.levelIndex + 1);
            } else {
              // 全部通关
              this.loadLevel(0);
            }
          } else if (this.gameOver) {
            this.loadLevel(this.levelIndex);
          }
          this.overlayEl.classList.remove('show');
        });
      },

      loadLevel(index) {
        this.levelIndex = index;
        this.level = LEVELS[index];
        this.board.reset();
        this.stepsLeft = this.level.steps || 999;
        this.timeLeft = this.level.time || 0;
        this.undoLeft = UNDO_PER_LEVEL;
        this.history = [];
        this.gameOver = false;
        this.win = false;
        this.transitioning = false;
        this.idleTimer = 0;
        this.idlePenalty = this.level.idlePenalty || 0;

        // 放置障碍物
        if (this.level.obstacles > 0) {
          this.board.setObstacles(this.level.obstacles);
        }

        // 初始生成两个方块
        this.board.spawnRandom();
        this.board.spawnRandom();

        this.overlayEl.classList.remove('show');
        this.updateHUD();
        this.render(true);
      },

      move(direction) {
        if (this.gameOver || this.win || this.transitioning) return;

        const oldBoard = this.board.clone();
        const oldSteps = this.stepsLeft;
        const oldTime = this.timeLeft;
        const oldScore = this.board.score;

        const result = slideBoard(this.board.grid, direction);
        if (!result.moved) return; // 无效移动

        // 保存历史
        this.history.push({
          grid: oldBoard.grid,
          score: oldBoard.score,
          stepsLeft: oldSteps,
          timeLeft: oldTime
        });
        if (this.history.length > 20) this.history.shift();

        // 更新棋盘
        this.board.grid = result.board;
        this.board.score += result.score;

        // 消耗步数
        if (this.level.steps > 0) {
          this.stepsLeft--;
        }

        // 生成新方块
        this.board.spawnRandom();

        // 重置空闲计时
        this.idleTimer = 0;

        // 检查目标
        if (LevelRules.isGoalAchieved(this.level, this.board)) {
          this.win = true;
          this.transitioning = true;
          this.showOverlay('win');
          this.updateHUD();
          this.render();
          return;
        }

        // 检查失败
        if (LevelRules.isFailed(this.level, this.board, this.stepsLeft, this.timeLeft)) {
          this.gameOver = true;
          this.transitioning = true;
          this.showOverlay('lose');
          this.updateHUD();
          this.render();
          return;
        }

        this.updateHUD();
        this.render();
      },

      undo() {
        if (this.undoLeft <= 0 || this.history.length === 0) return;
        const prev = this.history.pop();
        this.board.grid = prev.grid.map(row => [...row]);
        this.board.score = prev.score;
        this.stepsLeft = prev.stepsLeft;
        this.timeLeft = prev.timeLeft;
        this.undoLeft--;
        this.updateHUD();
        this.render();
      },

      // 时间更新（由外部循环驱动）
      update(dt) {
        if (this.gameOver || this.win || this.transitioning) return;
        if (this.level.time > 0) {
          this.timeLeft -= dt / 1000;
          if (this.timeLeft <= 0) {
            this.timeLeft = 0;
            this.gameOver = true;
            this.transitioning = true;
            this.showOverlay('lose');
            this.updateHUD();
          }
        }

        // 空闲惩罚
        if (this.idlePenalty > 0) {
          this.idleTimer += dt;
          if (this.idleTimer >= this.idlePenalty) {
            this.idleTimer = 0;
            // 生成一个干扰方块（随机位置放一个 2 或 4）
            const empty = this.board.getEmptyCells();
            if (empty.length > 0) {
              const [r, c] = empty[Math.floor(Math.random() * empty.length)];
              this.board.grid[r][c] = Math.random() < 0.5 ? 2 : 4;
              this.render();
            }
          }
        }

        this.updateHUD();
      },

      updateHUD() {
        if (!this.level) return;
        this.levelDisplay.textContent = this.level.name;

        // 目标
        if (this.level.goalType === 'create') {
          this.goalDisplay.textContent = `合成 ${this.level.goalValue}`;
        } else if (this.level.goalType === 'score') {
          this.goalDisplay.textContent = `${this.level.goalValue} 分`;
        } else if (this.level.goalType === 'clear') {
          this.goalDisplay.textContent = `消除 ${this.level.goalValue}`;
        }

        // 约束
        let constraint = '';
        if (this.level.steps > 0) {
          constraint = `步数 ${this.stepsLeft}`;
          if (this.stepsLeft <= 10) constraint += ' ⚠️';
        } else if (this.level.time > 0) {
          constraint = `时间 ${Math.ceil(this.timeLeft)}s`;
        } else if (this.level.idlePenalty > 0) {
          constraint = `空闲 ${Math.ceil((this.idlePenalty - this.idleTimer) / 1000)}s 惩罚`;
        } else {
          constraint = '无限制';
        }
        this.constraintDisplay.textContent = constraint;

        // 分数
        this.scoreDisplay.textContent = `${this.board.score} 分`;

        // 撤销按钮
        this.btnUndo.disabled = this.undoLeft <= 0 || this.history.length === 0;
        this.btnUndo.textContent = `撤销 (${this.undoLeft})`;

        // 星级预览（实时？不需要）
      },

      showOverlay(type) {
        const stars = type === 'win' ? this.calcStars() : 0;
        if (type === 'win') {
          this.overlayTitle.textContent = '关卡完成！';
          this.overlaySubtitle.textContent = `得分 ${this.board.score}`;
          this.overlayStars.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
          this.overlayHint.textContent = this.levelIndex + 1 < LEVELS.length ? '点击进入下一关' : '恭喜通关全部关卡！';
          this.overlayBtn.textContent = this.levelIndex + 1 < LEVELS.length ? '下一关' : '重新开始';
        } else {
          this.overlayTitle.textContent = '挑战失败';
          this.overlaySubtitle.textContent = `得分 ${this.board.score}`;
          this.overlayStars.textContent = '💔';
          this.overlayHint.textContent = '点击重新挑战';
          this.overlayBtn.textContent = '重试';
        }
        this.overlayEl.classList.add('show');

        // 音效
        playTone(type === 'win' ? 1200 : 180, 0.3, type === 'win' ? 'sine' : 'sawtooth', 0.08);
      },

      calcStars() {
        let remaining = 0;
        if (this.level.steps > 0) remaining = this.stepsLeft;
        else if (this.level.time > 0) remaining = this.timeLeft;
        else remaining = 999;
        if (remaining >= this.level.star3) return 3;
        if (remaining >= this.level.star2) return 2;
        return 1;
      },

      // ===== 渲染 =====
      render(force) {
        const grid = this.board.grid;
        const cells = this.boardEl.children;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const idx = r * SIZE + c;
            const cell = cells[idx];
            if (!cell) continue;
            const val = grid[r][c];
            if (val === OBSTACLE) {
              cell.textContent = '🧱';
              cell.className = 'cell obstacle';
              cell.dataset.value = 'obstacle';
            } else {
              cell.textContent = val === 0 ? '' : val;
              cell.className = 'cell';
              cell.dataset.value = val;
              // 方块值对应的样式已经通过 data-value 控制
            }
          }
        }
      }
    };

    // 初始化 DOM 棋盘
    function initBoardDOM() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.value = '0';
        boardEl.appendChild(cell);
      }
    }

    // ============================================================
    // 音频
    // ============================================================
    let audioCtx = null;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
    window.addEventListener('pointerdown', initAudio, { once: false });

    function playTone(freq, duration, type, volume) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.value = volume || 0.06;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // ============================================================
    // 主循环（只处理时间）
    // ============================================================
    let lastTime = performance.now();
    let accumulator = 0;
    const FIXED_STEP = 1000 / 60;

    function gameLoop(now) {
      let delta = now - lastTime;
      lastTime = now;
      delta = Math.min(delta, 250);
      accumulator += delta;
      while (accumulator >= FIXED_STEP) {
        if (game) game.update(FIXED_STEP);
        accumulator -= FIXED_STEP;
      }
      requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // 启动
    // ============================================================
    initBoardDOM();
    game.init();
    requestAnimationFrame(gameLoop);

    document.addEventListener('gesturestart', (e) => e.preventDefault());

    // 禁止页面滚动（防止触摸滑动时页面跟着动）
    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.board-wrapper')) {
        e.preventDefault();
      }
    }, { passive: false });

  })();
</script>
