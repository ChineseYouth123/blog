<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>打砖块 · 多球分裂版</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1a1e2e 0%, #0b0d14 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .game-container {
      position: relative; display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 540px;
      animation: floatUp 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .hud {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 10px 18px; margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: #eef2ff; font-size: 0.95rem; letter-spacing: 0.3px;
    }
    .hud .level { font-weight: 700; background: linear-gradient(135deg, #8ab4ff, #c084fc);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.1rem; }
    .hud .score { font-weight: 600; color: #b8c6ff; text-shadow: 0 0 12px rgba(140, 170, 255, 0.5); }
    .hud .remaining { font-size: 0.8rem; color: #8892b0; opacity: 0.9; }
    .hud .ballcount { font-size: 0.8rem; color: #ffd966; font-weight: 600; }

    .canvas-wrapper {
      position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 480px;
      background: #0a0c14; border-radius: 28px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(120, 150, 255, 0.15), 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 80px -20px rgba(80, 120, 255, 0.3);
      transition: box-shadow 0.3s;
    }
    .canvas-wrapper:hover {
      box-shadow: 0 0 0 1px rgba(140, 170, 255, 0.25), 0 30px 50px -20px rgba(0, 0, 0, 0.9), 0 0 100px -10px rgba(90, 130, 255, 0.45);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

    .slider-wrapper {
      width: 100%; max-width: 480px; margin-top: 18px; padding: 0 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .slider-wrapper label {
      display: flex; justify-content: space-between; width: 100%;
      font-size: 0.78rem; color: #7c89a8; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .slider-wrapper label span:first-child { color: #5f6f92; }
    .slider-wrapper label span:last-child { color: #b8c6ff; font-weight: 600; }

    input[type=range] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 8px;
      background: transparent; outline: none; margin: 8px 0; cursor: pointer;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 8px; border-radius: 10px;
      background: linear-gradient(90deg, #2e3a5e, #4c5f8a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 26px; height: 26px;
      margin-top: -9px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e0e9ff, #6d8aff);
      box-shadow: 0 0 18px rgba(100, 140, 255, 0.9), 0 0 6px rgba(255, 255, 255, 0.6), inset 0 -2px 4px rgba(0, 0, 20, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.12); box-shadow: 0 0 26px rgba(120, 160, 255, 1), 0 0 10px #fff;
    }
    input[type=range]::-moz-range-track {
      height: 8px; border-radius: 10px;
      background: linear-gradient(90deg, #2e3a5e, #4c5f8a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    input[type=range]::-moz-range-thumb {
      width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e0e9ff, #6d8aff);
      box-shadow: 0 0 18px rgba(100, 140, 255, 0.9), 0 0 6px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5); cursor: pointer;
    }

    .hint {
      margin-top: 10px; font-size: 0.75rem; color: #4f5a7a;
      letter-spacing: 0.3px; text-align: center; transition: opacity 0.5s;
    }
    @media (min-width: 768px) {
      .slider-wrapper { opacity: 0.85; }
      .hint::after { content: ' · 键盘 ← → 或鼠标拖动'; color: #5f6f92; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <div class="hud" id="hud">
    <div class="level" id="levelDisplay">第 1 / 5 关</div>
    <div class="score" id="scoreDisplay">0 分</div>
    <div class="remaining" id="remainingDisplay">剩余 40</div>
    <div class="ballcount" id="ballCountDisplay">球 1</div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="slider-wrapper">
    <label>
      <span>◀ 接球区 ▶</span>
      <span id="sliderValue">50%</span>
    </label>
    <input type="range" id="paddleRange" min="0" max="100" value="50" step="1">
  </div>
  <div class="hint" id="hint">拖动滑条移动接球区 · 击碎砖块分裂小球</div>
</div>

<script>
  (function() {
    const LOGIC_SIZE = 480;
    const FIXED_STEP = 1000 / 60;
    const MAX_FRAME_TIME = 250;
    const MAX_BALLS = 8; // 球数量上限

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function setupCanvasDPR() {
      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = LOGIC_SIZE + 'px';
      canvas.style.height = LOGIC_SIZE + 'px';
      canvas.width = LOGIC_SIZE * dpr;
      canvas.height = LOGIC_SIZE * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    setupCanvasDPR();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => setupCanvasDPR(), 100);
    });

    // ========== 音频 ==========
    let audioCtx = null;
    let audioUnlocked = false;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        audioUnlocked = true;
      } catch (e) {}
    }
    window.addEventListener('pointerdown', function unlock() {
      initAudio();
      if (audioUnlocked) window.removeEventListener('pointerdown', unlock);
    }, { once: false });

    function playTone(freq = 440, duration = 0.08, type = 'sine', volume = 0.06) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // ========== 输入管理 ==========
    const InputManager = {
      paddleTarget: 0.5,
      setPaddleTarget(norm) {
        this.paddleTarget = Math.min(1, Math.max(0, norm));
        if (paddleRange) {
          paddleRange.value = this.paddleTarget * 100;
          sliderValueEl.textContent = Math.round(this.paddleTarget * 100) + '%';
        }
      },
      getPaddleTarget() { return this.paddleTarget; },
      reset() { this.setPaddleTarget(0.5); }
    };

    const paddleRange = document.getElementById('paddleRange');
    const sliderValueEl = document.getElementById('sliderValue');
    paddleRange.addEventListener('input', (e) => {
      InputManager.setPaddleTarget(parseInt(e.target.value, 10) / 100);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        let cur = InputManager.getPaddleTarget();
        const step = 0.06;
        if (e.key === 'ArrowLeft') cur -= step;
        else cur += step;
        InputManager.setPaddleTarget(cur);
      }
    });

    let isPointerDown = false;
    function handleCanvasPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = LOGIC_SIZE / rect.width;
      let canvasX = (e.clientX - rect.left) * scaleX;
      canvasX = Math.min(LOGIC_SIZE, Math.max(0, canvasX));
      InputManager.setPaddleTarget(canvasX / LOGIC_SIZE);
    }
    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      canvas.setPointerCapture(e.pointerId);
      handleCanvasPointer(e);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (isPointerDown) { e.preventDefault(); handleCanvasPointer(e); }
    });
    canvas.addEventListener('pointerup', (e) => {
      isPointerDown = false;
      canvas.releasePointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointercancel', () => { isPointerDown = false; });
    window.addEventListener('touchmove', (e) => {
      if (e.target === canvas) e.preventDefault();
    }, { passive: false });

    // ========== 关卡 ==========
    const LEVELS = [
      { name: '热身', rows: 5, cols: 8, layout: [
        '11111111','11111111','11111111','11111111','11111111'
      ], ballSpeed: { vx: 3.0, vy: -4.2 }, paddleWidth: 100, paddleHeight: 14 },
      { name: '镂空', rows: 6, cols: 8, layout: [
        '11111111','11000011','10000001','10000001','11000011','11111111'
      ], ballSpeed: { vx: 3.2, vy: -4.5 }, paddleWidth: 95, paddleHeight: 14 },
      { name: '密集', rows: 7, cols: 8, layout: [
        '11111111','11111111','11111111','11111111','11111111','11111111','11111111'
      ], ballSpeed: { vx: 3.5, vy: -4.8 }, paddleWidth: 90, paddleHeight: 14 },
      { name: '窄接球', rows: 6, cols: 8, layout: [
        '11111111','11111111','11011011','11011011','11111111','11111111'
      ], ballSpeed: { vx: 3.8, vy: -5.2 }, paddleWidth: 75, paddleHeight: 12 },
      { name: '综合挑战', rows: 7, cols: 8, layout: [
        '22222222','11111111','11000011','10000001','11000011','11111111','22222222'
      ], ballSpeed: { vx: 4.0, vy: -5.5 }, paddleWidth: 80, paddleHeight: 14 }
    ];

    // ========== 打砖块（多球版） ==========
    const brickGame = {
      levelIndex: 0,
      config: null,

      // 多球数组
      balls: [],
      ballRadius: 8,

      // 挡板
      paddleWidth: 100,
      paddleHeight: 14,
      paddleX: 0,
      paddleY: LOGIC_SIZE - 40,

      // 砖块
      bricks: [],
      brickWidth: 48,
      brickHeight: 20,
      brickPadding: 6,
      brickOffsetTop: 50,
      brickOffsetLeft: 27,

      score: 0,
      totalScore: 0,
      gameOver: false,
      win: false,
      allLevelsComplete: false,
      transitioning: false,

      particles: [],

      loadLevel(index) {
        if (index < 0 || index >= LEVELS.length) {
          this.allLevelsComplete = true;
          return;
        }
        this.levelIndex = index;
        this.config = LEVELS[index];

        // 初始化单球
        const speed = this.config.ballSpeed;
        this.balls = [{
          x: LOGIC_SIZE / 2,
          y: LOGIC_SIZE - 80,
          vx: speed.vx,
          vy: speed.vy,
          trail: []
        }];

        this.paddleWidth = this.config.paddleWidth || 100;
        this.paddleHeight = this.config.paddleHeight || 14;
        this.paddleY = LOGIC_SIZE - 40;

        this.score = 0;
        this.gameOver = false;
        this.win = false;
        this.allLevelsComplete = false;
        this.transitioning = false;
        this.particles = [];

        this.generateBricks();
        InputManager.reset();
        this.updatePaddlePosition();
        updateHUD();
      },

      generateBricks() {
        this.bricks = [];
        const layout = this.config.layout;
        const rows = layout.length;
        const cols = layout[0].length;
        this.brickCols = cols;
        this.brickRows = rows;

        const totalPadding = (cols - 1) * this.brickPadding;
        this.brickWidth = (LOGIC_SIZE - 2 * 30 - totalPadding) / cols;
        this.brickOffsetLeft = 30;

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const ch = layout[row][col];
            if (ch === '0') continue;
            let hp = ch === '2' ? 2 : 1;
            const hue = (row * 40 + col * 15) % 360;
            const color = `hsl(${hue}, 75%, 62%)`;
            const colorDark = `hsl(${hue}, 75%, 42%)`;
            this.bricks.push({
              x: this.brickOffsetLeft + col * (this.brickWidth + this.brickPadding),
              y: this.brickOffsetTop + row * (this.brickHeight + this.brickPadding),
              w: this.brickWidth, h: this.brickHeight,
              active: true, hp: hp, maxHp: hp,
              color, colorDark, row, col
            });
          }
        }
      },

      updatePaddlePosition() {
        const targetNorm = InputManager.getPaddleTarget();
        const targetX = targetNorm * LOGIC_SIZE - this.paddleWidth / 2;
        this.paddleX = Math.max(0, Math.min(LOGIC_SIZE - this.paddleWidth, targetX));
      },

      // 更新所有球
      update(dt) {
        if (this.transitioning) { this.updateParticles(); return; }
        if (this.gameOver || this.win || this.allLevelsComplete) { this.updateParticles(); return; }

        this.updatePaddlePosition();

        // 遍历所有球（倒序方便删除）
        for (let i = this.balls.length - 1; i >= 0; i--) {
          const ball = this.balls[i];

          // 移动
          ball.x += ball.vx;
          ball.y += ball.vy;

          // 拖尾
          ball.trail.push({ x: ball.x, y: ball.y, life: 1.0 });
          if (ball.trail.length > 6) ball.trail.shift();
          ball.trail.forEach(p => p.life -= 0.08);

          // 墙壁碰撞
          let bounced = false;
          if (ball.x - this.ballRadius <= 0) {
            ball.x = this.ballRadius;
            ball.vx *= -1;
            bounced = true;
          } else if (ball.x + this.ballRadius >= LOGIC_SIZE) {
            ball.x = LOGIC_SIZE - this.ballRadius;
            ball.vx *= -1;
            bounced = true;
          }
          if (ball.y - this.ballRadius <= 0) {
            ball.y = this.ballRadius;
            ball.vy *= -1;
            bounced = true;
          }
          if (bounced) playTone(600, 0.04, 'sine', 0.03);

          // 底部掉落 → 移除该球
          if (ball.y + this.ballRadius > LOGIC_SIZE) {
            this.balls.splice(i, 1);
            continue;
          }

          // 挡板碰撞
          const paddleLeft = this.paddleX;
          const paddleRight = this.paddleX + this.paddleWidth;
          const paddleTop = this.paddleY;
          const paddleBottom = this.paddleY + this.paddleHeight;

          if (ball.vy > 0 &&
              ball.y + this.ballRadius >= paddleTop &&
              ball.y - this.ballRadius <= paddleBottom &&
              ball.x + this.ballRadius >= paddleLeft &&
              ball.x - this.ballRadius <= paddleRight) {

            ball.y = paddleTop - this.ballRadius;
            const hitPos = (ball.x - paddleLeft) / this.paddleWidth;
            const angle = (hitPos - 0.5) * 2;
            const speed = Math.hypot(ball.vx, ball.vy);
            const baseSpeed = Math.min(6.5, speed * 1.01);
            const newVX = angle * baseSpeed * 0.85;
            const newVY = -Math.sqrt(Math.max(1, baseSpeed * baseSpeed - newVX * newVX));
            ball.vx = newVX;
            ball.vy = newVY;
            playTone(820, 0.06, 'sine', 0.05);
          }

          // 砖块碰撞
          let hitBrick = null;
          for (let j = 0; j < this.bricks.length; j++) {
            const brick = this.bricks[j];
            if (!brick.active) continue;

            const closestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
            const closestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
            const dx = ball.x - closestX;
            const dy = ball.y - closestY;
            if (dx * dx + dy * dy < this.ballRadius * this.ballRadius) {
              hitBrick = brick;
              // 反弹
              const overlapLeft = (ball.x + this.ballRadius) - brick.x;
              const overlapRight = (brick.x + brick.w) - (ball.x - this.ballRadius);
              const overlapTop = (ball.y + this.ballRadius) - brick.y;
              const overlapBottom = (brick.y + brick.h) - (ball.y - this.ballRadius);
              const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
              if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                ball.vx *= -1;
              } else {
                ball.vy *= -1;
              }
              break;
            }
          }

          // 处理击中砖块
          if (hitBrick) {
            hitBrick.hp -= 1;
            this.spawnParticles(hitBrick);

            if (hitBrick.hp <= 0) {
              hitBrick.active = false;
              this.score += 10;
              playTone(1000, 0.08, 'square', 0.04);

              // ★ 分裂小球
              this.splitBall(ball);
            } else {
              hitBrick.color = `hsl(${hitBrick.row * 40 + hitBrick.col * 15}, 75%, 45%)`;
              playTone(500, 0.06, 'sawtooth', 0.03);
            }
          }
        }

        // 所有球掉落 → 游戏结束
        if (this.balls.length === 0) {
          this.gameOver = true;
          playTone(180, 0.4, 'sawtooth', 0.08);
          return;
        }

        // 过关检测
        if (this.bricks.every(b => !b.active)) {
          this.win = true;
          this.transitioning = true;
          setTimeout(() => {
            if (this.levelIndex + 1 < LEVELS.length) {
              this.loadLevel(this.levelIndex + 1);
            } else {
              this.allLevelsComplete = true;
              this.transitioning = false;
            }
            updateHUD();
          }, 1500);
        }

        this.updateParticles();
      },

      // 分裂小球：基于当前球生成第二个球
      splitBall(sourceBall) {
        if (this.balls.length >= MAX_BALLS) return;

        // 复制当前球
        const newBall = {
          x: sourceBall.x,
          y: sourceBall.y,
          vx: sourceBall.vx,
          vy: sourceBall.vy,
          trail: []
        };

        // 两个球的角度略微分开
        const speed = Math.hypot(sourceBall.vx, sourceBall.vy);
        const baseAngle = Math.atan2(sourceBall.vy, sourceBall.vx);
        const spread = 0.35; // 弧度

        sourceBall.vx = Math.cos(baseAngle - spread) * speed;
        sourceBall.vy = Math.sin(baseAngle - spread) * speed;
        newBall.vx = Math.cos(baseAngle + spread) * speed;
        newBall.vy = Math.sin(baseAngle + spread) * speed;

        this.balls.push(newBall);
        playTone(1200, 0.1, 'sine', 0.04);
      },

      spawnParticles(brick) {
        const cx = brick.x + brick.w / 2;
        const cy = brick.y + brick.h / 2;
        for (let i = 0; i < 8; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.5 + Math.random() * 3;
          this.particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1.0, color: brick.color,
            size: 3 + Math.random() * 4
          });
        }
      },

      updateParticles() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
      },

      // ========== 渲染 ==========
      render(ctx) {
        this.drawBackground(ctx);

        // 砖块
        this.bricks.forEach(b => { if (b.active) this.drawBrick(ctx, b); });

        // 粒子
        this.particles.forEach(p => {
          ctx.globalAlpha = p.life * 0.8;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        // 挡板光带
        this.drawPaddleGlow(ctx);

        // 所有球（含拖尾）
        this.balls.forEach(ball => {
          // 拖尾
          ball.trail.forEach(p => {
            if (p.life <= 0) return;
            ctx.globalAlpha = p.life * 0.35;
            ctx.fillStyle = '#aaccff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, this.ballRadius * p.life * 0.8, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.globalAlpha = 1;

          // 球体
          ctx.shadowColor = '#aaccff';
          ctx.shadowBlur = 24;
          const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, this.ballRadius);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.7, '#c8ddff');
          grad.addColorStop(1, '#6d8aff');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, this.ballRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        });

        // 覆盖层
        if (this.gameOver) {
          this.drawOverlay(ctx, '挑战失败', `得分 ${this.score}`, '点击画布重试');
        } else if (this.win && this.transitioning) {
          this.drawOverlay(ctx, `第 ${this.levelIndex + 1} 关通过`, `得分 ${this.score}`, '即将进入下一关...');
        } else if (this.allLevelsComplete) {
          this.drawOverlay(ctx, '全部通关 🎉', `总分 ${this.totalScore}`, '点击画布重新开始');
        }

        this.updateHUDIfNeeded();
      },

      drawBackground(ctx) {
        const grad = ctx.createRadialGradient(
          LOGIC_SIZE / 2, LOGIC_SIZE * 0.3, 20,
          LOGIC_SIZE / 2, LOGIC_SIZE * 0.7, LOGIC_SIZE
        );
        grad.addColorStop(0, '#151b2e');
        grad.addColorStop(0.6, '#0b0e18');
        grad.addColorStop(1, '#05070c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

        ctx.strokeStyle = 'rgba(80, 110, 180, 0.05)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 10; i++) {
          const pos = (i / 10) * LOGIC_SIZE;
          ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, LOGIC_SIZE); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(LOGIC_SIZE, pos); ctx.stroke();
        }
      },

      drawBrick(ctx, brick) {
        const radius = 6;
        ctx.shadowColor = brick.color;
        ctx.shadowBlur = 10;
        const grad = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
        grad.addColorStop(0, brick.color);
        grad.addColorStop(1, brick.colorDark || brick.color);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(brick.x, brick.y, brick.w, brick.h, radius);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(brick.x + 1, brick.y + 1, brick.w - 2, brick.h - 2, radius - 1);
        ctx.stroke();

        if (brick.maxHp > 1) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.font = 'bold 10px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('★', brick.x + brick.w / 2, brick.y + brick.h / 2);
        }
      },

      drawPaddleGlow(ctx) {
        const x = this.paddleX + this.paddleWidth / 2;
        const y = this.paddleY + this.paddleHeight / 2;
        const glowGrad = ctx.createRadialGradient(x, y, 4, x, y, this.paddleWidth * 0.9);
        glowGrad.addColorStop(0, 'rgba(120, 170, 255, 0.45)');
        glowGrad.addColorStop(0.5, 'rgba(90, 130, 255, 0.15)');
        glowGrad.addColorStop(1, 'rgba(90, 130, 255, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(x, y, this.paddleWidth * 0.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#8ab4ff';
        ctx.shadowBlur = 20;
        ctx.strokeStyle = 'rgba(180, 210, 255, 0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, this.paddleWidth * 0.45, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();

        ctx.shadowBlur = 30;
        ctx.fillStyle = 'rgba(220, 235, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(x, y - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      },

      drawOverlay(ctx, title, subtitle, hint) {
        ctx.fillStyle = 'rgba(5, 8, 18, 0.8)';
        ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#8ab4ff';
        ctx.fillStyle = '#f0f4ff';
        ctx.font = 'bold 34px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, LOGIC_SIZE / 2, LOGIC_SIZE / 2 - 30);
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#5a7aff';
        ctx.fillStyle = '#b8c6ff';
        ctx.font = '600 20px Inter, system-ui, sans-serif';
        ctx.fillText(subtitle, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 25);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#5f6f92';
        ctx.font = '14px Inter, system-ui, sans-serif';
        ctx.fillText(hint, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 80);
      },

      handleCanvasClick() {
        if (this.gameOver) {
          this.loadLevel(this.levelIndex);
        } else if (this.allLevelsComplete) {
          this.levelIndex = 0;
          this.totalScore = 0;
          this.allLevelsComplete = false;
          this.loadLevel(0);
        }
      },

      updateHUDIfNeeded() {
        if (remainingDisplayEl) {
          const remaining = this.bricks.filter(b => b.active).length;
          remainingDisplayEl.textContent = `剩余 ${remaining}`;
        }
        if (ballCountDisplayEl) {
          ballCountDisplayEl.textContent = `球 ${this.balls.length}`;
        }
      }
    };

    // ========== HUD ==========
    const levelDisplayEl = document.getElementById('levelDisplay');
    const scoreDisplayEl = document.getElementById('scoreDisplay');
    const remainingDisplayEl = document.getElementById('remainingDisplay');
    const ballCountDisplayEl = document.getElementById('ballCountDisplay');

    function updateHUD() {
      if (!brickGame.config) return;
      levelDisplayEl.textContent = `第 ${brickGame.levelIndex + 1} / ${LEVELS.length} 关`;
      scoreDisplayEl.textContent = `${brickGame.score} 分`;
      const remaining = brickGame.bricks.filter(b => b.active).length;
      remainingDisplayEl.textContent = `剩余 ${remaining}`;
      ballCountDisplayEl.textContent = `球 ${brickGame.balls.length}`;
    }

    // 画布点击
    canvas.addEventListener('click', (e) => {
      if (!isPointerDown) brickGame.handleCanvasClick();
    });

    // ========== 主循环 ==========
    let lastTime = performance.now();
    let accumulator = 0;

    brickGame.loadLevel(0);

    function gameLoop(currentTime) {
      let delta = currentTime - lastTime;
      lastTime = currentTime;
      delta = Math.min(delta, MAX_FRAME_TIME);
      accumulator += delta;
      while (accumulator >= FIXED_STEP) {
        brickGame.update(FIXED_STEP);
        accumulator -= FIXED_STEP;
      }
      brickGame.render(ctx);
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    setTimeout(() => updateHUD(), 0);
    document.addEventListener('gesturestart', (e) => e.preventDefault());
  })();
</script>
